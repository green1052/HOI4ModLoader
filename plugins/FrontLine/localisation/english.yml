l_english:
    com.green1052.frontline.desc:0 "Does the front line micro you would otherwise do by hand: rotation, plugging, escape, attacks, fire brigade, depth defence and front shuffle. Hotkeys start or halt every battle plan and launch blitzes and pincers."
    com.green1052.frontline.Rotation:0 "Rotation (rest)"
    com.green1052.frontline.Rotation.desc:0 "Worn-out front divisions rest behind the line and come back once recovered.\n- Only where another division of the same front holds their province, so it never empties\n- Thresholds and the resting cap are set below"
    com.green1052.frontline.WornOrganisation:0 "Worn: organisation (%)"
    com.green1052.frontline.WornOrganisation.desc:0 "A front division below this organisation goes to rest.\n- Divisions in combat are left alone"
    com.green1052.frontline.WornStrength:0 "Worn: strength (%)"
    com.green1052.frontline.WornStrength.desc:0 "Or below this strength (equipment and manpower)."
    com.green1052.frontline.ReturnOrganisation:0 "Return: organisation (%)"
    com.green1052.frontline.ReturnOrganisation.desc:0 "A resting division goes back to its front at this organisation."
    com.green1052.frontline.ReturnStrength:0 "Return: strength (%)"
    com.green1052.frontline.ReturnStrength.desc:0 "And at this strength.\n- After two weeks resting, organisation alone is enough (equipment or manpower may stay short)"
    com.green1052.frontline.MaxRestingPercent:0 "Resting at once (%)"
    com.green1052.frontline.MaxRestingPercent.desc:0 "At most this share of a front's divisions rests at once."
    com.green1052.frontline.Plugging:0 "Plugging gaps"
    com.green1052.frontline.Plugging.desc:0 "Sends the nearest fresh division into a defence of ours that is being lost.\n- Helpers: resting divisions, divisions off battle plans, spares of quiet fronts\n- They go back to their front once the battle is over and they have recovered"
    com.green1052.frontline.LosingPercent:0 "Plugging threshold (%)"
    com.green1052.frontline.LosingPercent.desc:0 "A defence counts as being lost when the attacker holds this share of the battle bar (organisation)."
    com.green1052.frontline.PlugRadius:0 "Helper distance (provinces)"
    com.green1052.frontline.PlugRadius.desc:0 "How far a helper may come from."
    com.green1052.frontline.Escape:0 "Encirclement escape"
    com.green1052.frontline.Escape.desc:0 "Pulls front divisions out of a salient that is about to be cut off.\n- When its way back narrows to 1-2 provinces next to the enemy\n- Only if the enemy at that neck is at least as strong as our divisions in the salient (else it can't close it)\n- Once cut off (pocket up to 30 provinces, friendly lines within 6), the divisions inside break out together once a day"
    com.green1052.frontline.Attack:0 "Opportunity attacks"
    com.green1052.frontline.Attack.desc:0 "Takes empty enemy provinces next to the line with one fresh division, always leaving one behind.\n- Surrounded enemy divisions: only with at least as many fresh ones (more behind forts)\n- Best first: closing a pocket, then victory points, supply hubs, airfields, ports, then a shorter front\n- Skipped: where supply can't follow (unless it closes a pocket), or the front grows by more than 2 provinces for nothing"
    com.green1052.frontline.AttackOdds:0 "Assault odds (%)"
    com.green1052.frontline.AttackOdds.desc:0 "Attacks an enemy province when fresh divisions of our neighbouring provinces outgun its defenders by this much.\n- 200 = twice their power; more behind forts, in rough terrain (mountain, city, marsh, jungle) or across a river\n- Mop-up: encircled enemies (pocket up to 12 provinces) and enemies inside our ground are attacked first at even odds\n- Your divisions assault only on a running battle plan (mop-up always)\n0 = off"
    com.green1052.frontline.FireBrigade:0 "Fire brigade (mobile reserve)"
    com.green1052.frontline.FireBrigade.desc:0 "Keeps a few armored or motorized divisions per front off its battle plan, a province behind the line.\n- Where the enemy breaks in (a province lost in the last 2 days, a landing, enemy troops in our ground), the nearest counterattack with enough to win\n- Forts are counted; each mobile division counts double\n- They go back to their post afterwards\nAn AI country without spare mobile divisions uses infantry"
    com.green1052.frontline.DepthDefense:0 "Defence in depth"
    com.green1052.frontline.DepthDefense.desc:0 "Puts a spare division of the front a province behind key line provinces as a second line.\n- Key provinces: ports, victory points, river crossings, cities, mountains\n- It stays while the line holds there"
    com.green1052.frontline.Shuffle:0 "Front shuffle"
    com.green1052.frontline.Shuffle.desc:0 "Sends spare fresh divisions of quiet fronts to a losing one.\n- Losing: 3 provinces lost in 2 days, a defence being lost, or facing twice its divisions\n- They reinforce its most pressed provinces and go back a day after the crisis\n- Meanwhile idle enemy stacks of 1-2 divisions next to the crisis get a pinning attack (one division each, called off when its organisation drops)
- A front facing only an encircled pocket keeps twice the pocket's divisions (2 at least); the rest join their army's main front"
    com.green1052.frontline.BattlePlanKeys:0 "Battle plan keys"
    com.green1052.frontline.BattlePlanKeys.desc:0 "Ctrl+Alt+E activates every battle plan at once, Ctrl+Alt+H halts them all."
    com.green1052.frontline.OperationKeys:0 "Operation keys (blitz, pincer)"
    com.green1052.frontline.OperationKeys.desc:0 "Launches a blitz or a pincer with the selected units.\n- Ctrl+Alt+B blitz: armor breaks through the weakest sector to a deep objective, infantry holds the corridor\n- Ctrl+Alt+P pincer: two selected armies (or an army group) meet behind the enemy, infantry holds the ring\n- Meanwhile fresh divisions of those armies pin enemy stacks next to the breakthrough\nThe same key again cancels"
    com.green1052.frontline.OperationDepth:0 "Operation depth (provinces)"
    com.green1052.frontline.OperationDepth.desc:0 "How many provinces behind the enemy line an operation's objective may lie."
    com.green1052.frontline.SpearheadOrganisation:0 "Spearhead stop organisation (%)"
    com.green1052.frontline.SpearheadOrganisation.desc:0 "Spearheads stop advancing below this organisation.\n- The operation ends when all of one wing's spearheads have stopped"
    com.green1052.frontline.ApplyToAI:0 "Apply to AI"
    com.green1052.frontline.ApplyToAI.desc:0 "Single player: AI countries get the same front line micro, with the settings above.\n- Rotation, plugging, escape, attacks, fire brigade, depth defence, front shuffle\n- AI Assist's own versions (rotation, escape, reserves, second line, local attacks) stand aside and leave these divisions alone\nWithout AI Assist, the AI's regrouping may take them back"
