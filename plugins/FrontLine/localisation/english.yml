l_english:
    com.green1052.frontline.desc:0 "Front line micro done for you: worn-out divisions rotate, defences being lost get help, salients about to be cut off pull back, the best empty and surrounded enemy provinces get attacked, mobile reserves counterattack break-ins, key provinces get a second line, losing fronts get divisions from quiet ones, Ctrl+Alt+E/H start or halt every battle plan, and Ctrl+Alt+B/P launch a blitz or a pincer with the selected armies."
    com.green1052.frontline.Rotation:0 "Division rotation"
    com.green1052.frontline.Rotation.desc:0 "Worn-out divisions in contact with the enemy rest behind the line and come back rested, where another of ours holds their province."
    com.green1052.frontline.WornOrganisation:0 "Worn: organisation (%)"
    com.green1052.frontline.WornOrganisation.desc:0 "A front line division below this organisation (%) goes to rest."
    com.green1052.frontline.WornStrength:0 "Worn: strength (%)"
    com.green1052.frontline.WornStrength.desc:0 "Or below this strength (%: equipment and manpower)."
    com.green1052.frontline.ReturnOrganisation:0 "Return: organisation (%)"
    com.green1052.frontline.ReturnOrganisation.desc:0 "A resting division goes back to its front at this organisation (%)."
    com.green1052.frontline.ReturnStrength:0 "Return: strength (%)"
    com.green1052.frontline.ReturnStrength.desc:0 "And this strength (%); after two weeks resting, organisation alone is enough (equipment or manpower may be short)."
    com.green1052.frontline.MaxRestingPercent:0 "Resting at once (%)"
    com.green1052.frontline.MaxRestingPercent.desc:0 "At most this share (%) of a front's divisions rests at once."
    com.green1052.frontline.Plugging:0 "Plugging"
    com.green1052.frontline.Plugging.desc:0 "Send the nearest fresh division into a defence of ours that is being lost; it joins the battle and goes back to its front afterwards."
    com.green1052.frontline.LosingPercent:0 "Losing defence (%)"
    com.green1052.frontline.LosingPercent.desc:0 "A defence counts as being lost when the attacker holds this share (%) of the battle's organisation (the battle bar)."
    com.green1052.frontline.PlugRadius:0 "Helper distance (provinces)"
    com.green1052.frontline.PlugRadius.desc:0 "How far (provinces) a helper may come from."
    com.green1052.frontline.Escape:0 "Encirclement escape"
    com.green1052.frontline.Escape.desc:0 "Pull front divisions back out of a salient whose way back narrows to one or two provinces next to the enemy (and the enemy there is strong enough to close it), through that neck while it is still open. Once cut off (up to 30 provinces, friendly lines within 6), the divisions inside attack together once a day toward the nearest friendly ground."
    com.green1052.frontline.Attack:0 "Opportunity attacks and pocket mop-up"
    com.green1052.frontline.Attack.desc:0 "Take empty enemy provinces next to the line with a fresh division, and attack enemy divisions already surrounded with at least as many fresh ones (more behind forts); a province of ours always keeps one. Best targets first: closing a pocket, then victory points, supply hubs, airfields and ports, then shortening the front; none our supply can't follow (unless it closes a pocket) or that lengthen the front by more than two provinces for nothing."
    com.green1052.frontline.AttackOdds:0 "Assault odds (%)"
    com.green1052.frontline.AttackOdds.desc:0 "Also attack an enemy province its neighbours of ours can outgun this many times (%: 200 = twice its defenders' power, more behind forts, in rough ground or across a river), with fresh divisions from all of them, each keeping one. Your divisions only on a battle plan that is running. 0: off."
    com.green1052.frontline.FireBrigade:0 "Fire brigade"
    com.green1052.frontline.FireBrigade.desc:0 "Keep a few armored or motorized divisions per front a province behind the line, off its battle plan. Where the enemy breaks in (a province of ours lost in the last two days, a landing, enemy troops in our provinces), the nearest ones counterattack with enough to win (forts counted, each counting double), then go back to their post. An AI country without spare mobile divisions uses infantry."
    com.green1052.frontline.DepthDefense:0 "Defence in depth"
    com.green1052.frontline.DepthDefense.desc:0 "Key line provinces (ports, victory points, river crossings, cities and mountains) get a second division a province behind them, from spare divisions of a front; it stays while the line holds there."
    com.green1052.frontline.Shuffle:0 "Front shuffle"
    com.green1052.frontline.Shuffle.desc:0 "When a front is losing (three provinces lost in two days or defences being lost, or facing twice its divisions), spare fresh divisions of quiet fronts reinforce its most pressed provinces and go back to their own front a day after the crisis. Meanwhile fresh divisions next to the crisis attack idle enemy stacks of one or two divisions (one attacker each, while its organisation holds) so they are locked in combat and can't be moved in."
    com.green1052.frontline.BattlePlanKeys:0 "Battle plan keys"
    com.green1052.frontline.BattlePlanKeys.desc:0 "Ctrl+Alt+E activates every battle plan at once, Ctrl+Alt+H halts them."
    com.green1052.frontline.OperationKeys:0 "Operation keys (blitz, pincer)"
    com.green1052.frontline.OperationKeys.desc:0 "Ctrl+Alt+B: blitz with the selected divisions (armor breaks through the weakest sector to a deep objective, infantry holds the corridor). Ctrl+Alt+P: pincer with two selected armies or an army group (two spearheads meet behind the enemy, infantry holds the ring). Meanwhile fresh divisions of those armies lock enemy stacks next to the breakthrough in combat. The same key again cancels."
    com.green1052.frontline.OperationDepth:0 "Operation depth (provinces)"
    com.green1052.frontline.OperationDepth.desc:0 "How deep (provinces) behind the enemy line an operation's objective may lie."
    com.green1052.frontline.SpearheadOrganisation:0 "Spearhead stops at organisation (%)"
    com.green1052.frontline.SpearheadOrganisation.desc:0 "Spearheads stop advancing below this organisation (%); the operation ends when all of a wing's are."
    com.green1052.frontline.ApplyToAI:0 "Apply to AI"
    com.green1052.frontline.ApplyToAI.desc:0 "Single player: AI countries get the same front line micro (rotation, plugging, escape, attack, fire brigade, depth defence and shuffle, with the settings above). AI Assist's own rotation, escape, reserves, second line and local attacks stand aside meanwhile, and its regrouping hooks leave these divisions alone; without AI Assist the AI's regrouping may take them back."
