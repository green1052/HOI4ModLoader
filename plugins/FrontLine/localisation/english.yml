l_english:
    com.green1052.frontline.desc:0 "Does the front line micro you would otherwise do by hand.\n- Rotation, plugging gaps, encirclement escape\n- Opportunity attacks and assaults\n- Fire brigade, defence in depth, front shuffle\n- Ctrl+Alt+E / Ctrl+Alt+H: start / halt every battle plan\n- Ctrl+Alt+B / Ctrl+Alt+P: blitz / pincer with the selected units\nWorks in multiplayer."
    com.green1052.frontline.Rotation:0 "Rotation (rest)"
    com.green1052.frontline.Rotation.desc:0 "Worn front divisions rest behind the line and come back once recovered.\n- Only where another division of the same front holds their province, so it never empties"
    com.green1052.frontline.WornOrganisation:0 "Worn: organisation (%)"
    com.green1052.frontline.WornOrganisation.desc:0 "A front division below this organisation goes to rest, unless it is in combat."
    com.green1052.frontline.WornStrength:0 "Worn: strength (%)"
    com.green1052.frontline.WornStrength.desc:0 "Or below this strength (equipment and manpower)."
    com.green1052.frontline.ReturnOrganisation:0 "Return: organisation (%)"
    com.green1052.frontline.ReturnOrganisation.desc:0 "A resting division goes back to its front at this organisation."
    com.green1052.frontline.ReturnStrength:0 "Return: strength (%)"
    com.green1052.frontline.ReturnStrength.desc:0 "And at this strength. After two weeks resting, organisation alone is enough."
    com.green1052.frontline.MaxRestingPercent:0 "Resting at once (%)"
    com.green1052.frontline.MaxRestingPercent.desc:0 "At most this share of a front's divisions rests at once."
    com.green1052.frontline.Plugging:0 "Plugging gaps"
    com.green1052.frontline.Plugging.desc:0 "Sends fresh divisions into a defence of ours that is being lost.\n- Being lost: past the threshold below, or out of organisation within 2 days\n- Only divisions that arrive in time; two if it falls within a day\n- A line province facing twice its divisions gets one before the attack\n- Cordon: empty provinces around a fresh breach are manned\n- They go back once the threat is gone (a week at most)"
    com.green1052.frontline.LosingPercent:0 "Plugging threshold (%)"
    com.green1052.frontline.LosingPercent.desc:0 "A defence counts as being lost when the attacker holds this share of the battle bar."
    com.green1052.frontline.PlugRadius:0 "Helper distance (provinces)"
    com.green1052.frontline.PlugRadius.desc:0 "How far a helper may come from."
    com.green1052.frontline.Lure:0 "Lure (AI)"
    com.green1052.frontline.Lure.desc:0 "AI only: a defence being lost is let go to draw the attacker in, when it can be cut off.\n- Our line provinces on both sides hold and are not being lost\n- 2+ fresh mobile divisions within 3 provinces, against at most twice as many attackers\nAI Assist's encirclement then cuts the salient and the fire brigade counterattacks."
    com.green1052.frontline.Escape:0 "Encirclement escape"
    com.green1052.frontline.Escape.desc:0 "Pulls front divisions out of a salient about to be cut off.\n- When its way back narrows to 1-2 provinces next to the enemy\n- Only if the enemy there is strong enough to close it\n- A cut-off pocket out of supply (up to 30 provinces, friendly lines within 6) breaks out once a day"
    com.green1052.frontline.Attack:0 "Opportunity attacks"
    com.green1052.frontline.Attack.desc:0 "Takes empty enemy provinces next to the line with one fresh division, always leaving one behind.\n- Surrounded enemy divisions: with at least as many fresh ones (more behind forts)\n- Best first: closing a pocket, then victory points, supply hubs, airfields, ports, then a shorter front\n- From a landing without a port, the way to the nearest enemy port counts high\n- Skipped: where supply can't follow, or the front grows by more than 2 provinces for nothing"
    com.green1052.frontline.AttackOdds:0 "Assault odds (%)"
    com.green1052.frontline.AttackOdds.desc:0 "Attacks an enemy province when our neighbouring fresh divisions outgun its defenders by this much.\n- 200 = twice their power; more for forts, rough terrain and rivers\n- Encircled enemies and enemies inside our ground go first, at even odds\n- Your divisions only on a running battle plan (mop-up always)\n0 = off (mop-up too)"
    com.green1052.frontline.FireBrigade:0 "Fire brigade (mobile reserve)"
    com.green1052.frontline.FireBrigade.desc:0 "Keeps a few armored or motorized divisions per front off its battle plan, a province behind the line.\n- Where the enemy breaks in, the nearest counterattack with enough to win\n- Break-in: ground lost in the last 2 days, a landing, enemy troops in our ground\n- They go back to their post afterwards\nAI countries without spare mobile divisions use infantry."
    com.green1052.frontline.DepthDefense:0 "Defence in depth"
    com.green1052.frontline.DepthDefense.desc:0 "Puts a spare division a province behind key line provinces as a second line.\n- Key: ports, victory points, river crossings, cities, mountains\n- It stays while the line holds there"
    com.green1052.frontline.Shuffle:0 "Front shuffle"
    com.green1052.frontline.Shuffle.desc:0 "Sends spare fresh divisions of quiet fronts to a losing one.\n- Losing: 3+ line provinces lost or being lost in 2 days, or facing twice its divisions\n- They reinforce its most pressed provinces and go back a day after the crisis\n- Idle enemy stacks of 1-2 divisions next to it get a pinning attack\n- A front facing only a pocket keeps twice the pocket's divisions; the rest join their army's main front"
    com.green1052.frontline.BattlePlanKeys:0 "Battle plan keys"
    com.green1052.frontline.BattlePlanKeys.desc:0 "Ctrl+Alt+E activates every battle plan at once, Ctrl+Alt+H halts them all."
    com.green1052.frontline.OperationKeys:0 "Operation keys (blitz, pincer)"
    com.green1052.frontline.OperationKeys.desc:0 "Launches a blitz or a pincer with the selected units.\n- Ctrl+Alt+B blitz: armor breaks through the weakest sector to a deep objective, infantry holds the corridor\n- Ctrl+Alt+P pincer: two selected armies (or an army group) meet behind the enemy, infantry holds the ring\n- Fresh divisions of those armies pin enemy stacks next to the breakthrough\n- The same key again cancels"
    com.green1052.frontline.OperationDepth:0 "Operation depth (provinces)"
    com.green1052.frontline.OperationDepth.desc:0 "How many provinces behind the enemy line an operation's objective may lie."
    com.green1052.frontline.SpearheadOrganisation:0 "Spearhead stop organisation (%)"
    com.green1052.frontline.SpearheadOrganisation.desc:0 "Spearheads stop advancing below this organisation. The operation ends when a whole wing has stopped."
    com.green1052.frontline.ApplyToAI:0 "Apply to AI"
    com.green1052.frontline.ApplyToAI.desc:0 "Single player: AI countries get the same front line micro and the lure, with the settings above.\n- Not rotation: AI front orders take resting divisions straight back\n- AI Assist's matching features leave these divisions alone\nWithout AI Assist, the AI's regrouping may take them back."
    com.green1052.frontline.PlayerRepositions:0 "Move your divisions elsewhere"
    com.green1052.frontline.PlayerRepositions.desc:0 "Takes your divisions off their battle plans to stand elsewhere: depth defence, fire brigade posts, shuffles, cordons.\nOff (default): only actions where they stand and the operation keys; posted divisions go back onto their plan.\nAI countries are unaffected."
