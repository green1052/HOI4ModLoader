l_korean:
 com.green1052.frontline.name:0 "전선 관리"
 com.green1052.frontline.desc:0 "사람이 손으로 하던 전선 미세조작을 대신합니다: 지친 사단 교대, 뚫리는 방어전 돌려막기, 포위되기 직전 돌출부 탈출."
 com.green1052.frontline.Rotation:0 "사단 교대"
 com.green1052.frontline.Rotation.desc:0 "적과 맞닿은 전선의 지친 사단을 뒤로 빼서 쉬게 하고, 회복하면 원래 전선으로 돌려보냅니다. 같은 프로빈스에 같은 전선의 우리 사단이 하나 더 있을 때만 빼므로 프로빈스가 비지 않습니다."
 com.green1052.frontline.WornOrganisation:0 "교대 기준: 조직력(%)"
 com.green1052.frontline.WornOrganisation.desc:0 "전선 사단의 조직력이 이보다 낮으면 쉬러 갑니다. 교전 중인 사단은 건드리지 않습니다."
 com.green1052.frontline.WornStrength:0 "교대 기준: 강도(%)"
 com.green1052.frontline.WornStrength.desc:0 "또는 강도(장비와 인력)가 이보다 낮으면 쉬러 갑니다."
 com.green1052.frontline.ReturnOrganisation:0 "복귀 기준: 조직력(%)"
 com.green1052.frontline.ReturnOrganisation.desc:0 "쉬는 사단의 조직력이 이만큼 회복되면 원래 전선으로 돌아갑니다."
 com.green1052.frontline.ReturnStrength:0 "복귀 기준: 강도(%)"
 com.green1052.frontline.ReturnStrength.desc:0 "그리고 강도가 이만큼이어야 돌아갑니다."
 com.green1052.frontline.MaxSwapsPerArmy:0 "야전군당 동시 교대 수"
 com.green1052.frontline.MaxSwapsPerArmy.desc:0 "한 번에 쉬러 보내는 사단 수입니다. 전선이 한꺼번에 바뀌지 않게 합니다."
 com.green1052.frontline.MaxRestingPercent:0 "동시 휴식 상한(%)"
 com.green1052.frontline.MaxRestingPercent.desc:0 "한 전선의 사단 중 동시에 쉬는 비율의 상한입니다."
 com.green1052.frontline.RestDepth:0 "휴식 위치(프로빈스)"
 com.green1052.frontline.RestDepth.desc:0 "쉬러 가는 곳이 전선에서 몇 프로빈스 뒤인지입니다. 이웃에 적 점령지가 없는 아군 프로빈스를 고릅니다."
 com.green1052.frontline.Plugging:0 "돌려막기"
 com.green1052.frontline.Plugging.desc:0 "지고 있는 우리 방어전에 가장 가까운 쌩쌩한 사단(쉬는 사단, 전투계획 밖 사단, 조용한 전선에서 남는 사단)을 보내 방어에 합류시킵니다. 전투가 끝나고 회복하면 원래 전선으로 돌아갑니다."
 com.green1052.frontline.LosingPercent:0 "돌려막기 기준(%)"
 com.green1052.frontline.LosingPercent.desc:0 "전투 막대에서 공격 측이 조직력의 이 비율 이상을 쥐고 있으면 지는 방어전으로 봅니다."
 com.green1052.frontline.PlugRadius:0 "증원 거리(프로빈스)"
 com.green1052.frontline.PlugRadius.desc:0 "증원 사단을 데려올 수 있는 최대 거리입니다."
 com.green1052.frontline.Escape:0 "포위 탈출"
 com.green1052.frontline.Escape.desc:0 "돌출부에 있는 전선 사단의 퇴로가 적과 맞닿은 프로빈스 하나로 좁아지면, 포위가 닫히기 전에 뒤로 뺍니다."
 com.green1052.frontline.Opportunity:0 "기회 공격"
 com.green1052.frontline.Opportunity.desc:0 "전선 옆 적 프로빈스가 비어 있으면 쌩쌩한 사단 하나를 보내 점령합니다. 그 프로빈스에 우리 사단이 하나 더 있을 때만 보내므로 자리가 비지 않습니다."
 com.green1052.frontline.MopUp:0 "포위망 소탕"
 com.green1052.frontline.MopUp.desc:0 "이미 포위된 적 사단(육지 이웃이 모두 우리나 교전하지 않는 나라)을 옆의 쌩쌩한 사단 최대 2개로 공격합니다."
 com.green1052.frontline.ApplyToAi:0 "AI에도 적용 (싱글)"
 com.green1052.frontline.ApplyToAi.desc:0 "AI 국가의 사단에도 교대와 돌려막기를 적용합니다(포위 탈출은 따로 켤 수 있고, 기회 공격·소탕은 AI가 자체적으로 하므로 제외). 우리가 다루는 사단은 AI의 군 재편 대상에서 빠지므로, 작은 군이 마구 생기지 않습니다. 싱글 플레이 전용."
 com.green1052.frontline.AiOpportunity:0 "AI 기회 공격 (싱글)"
 com.green1052.frontline.AiOpportunity.desc:0 "AI 국가가 전선 옆의 빈 적 프로빈스를 쌩쌩한 사단 하나로 점령합니다. 출발 프로빈스에 사단 하나는 남깁니다. 바닐라 국지 공격은 측면 조건 때문에 빈 땅을 그냥 지나치곤 합니다. 싱글 플레이 전용."
 com.green1052.frontline.AiEscape:0 "AI 포위 탈출 (싱글)"
 com.green1052.frontline.AiEscape.desc:0 "AI 사단도 플레이어처럼, 퇴로가 좁아지는 돌출부에서 포위가 닫히기 전에 빠져나와 쉬었다가 회복하면 원래 전선으로 돌아갑니다. 싱글 플레이 전용."
