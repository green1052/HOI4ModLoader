l_korean:
 com.green1052.frontline.name:0 "전선 관리"
 com.green1052.frontline.desc:0 "사람이 손으로 하던 전선 미세조작을 대신합니다: 지친 사단 교대, 뚫리는 방어전 돌려막기, 포위되기 직전 돌출부 탈출, 값진 빈 적 프로빈스와 포위된 적 공격, 기동 예비대의 역습, 요충지 뒤 2선 배치, 밀리는 전선에 조용한 전선 병력 돌리기. Ctrl+Alt+E/H로 모든 전투 계획을 시작하거나 멈추고, Ctrl+Alt+B/P로 선택한 군으로 전격전이나 협공을 겁니다."
 com.green1052.frontline.Rotation:0 "사단 교대"
 com.green1052.frontline.Rotation.desc:0 "적과 맞닿은 전선의 지친 사단을 뒤로 빼서 쉬게 하고, 회복하면 원래 전선으로 돌려보냅니다. 같은 프로빈스에 같은 전선의 우리 사단이 하나 더 있을 때만 빼므로 프로빈스가 비지 않습니다."
 com.green1052.frontline.WornOrganisation:0 "교대 기준: 조직력(%)"
 com.green1052.frontline.WornOrganisation.desc:0 "전선 사단의 조직력이 이보다 낮으면 쉬러 갑니다. 교전 중인 사단은 건드리지 않습니다."
 com.green1052.frontline.WornStrength:0 "교대 기준: 강도(%)"
 com.green1052.frontline.WornStrength.desc:0 "또는 강도(장비와 인력)가 이보다 낮으면 쉬러 갑니다."
 com.green1052.frontline.ReturnOrganisation:0 "복귀 기준: 조직력(%)"
 com.green1052.frontline.ReturnOrganisation.desc:0 "쉬는 사단의 조직력이 이만큼 회복되면 원래 전선으로 돌아갑니다."
 com.green1052.frontline.ReturnStrength:0 "복귀 기준: 강도(%)"
 com.green1052.frontline.ReturnStrength.desc:0 "그리고 강도가 이만큼이어야 돌아갑니다. 단, 2주 넘게 쉬었다면 장비나 인력이 모자랄 수 있으니 조직력만 회복되면 돌아갑니다."
 com.green1052.frontline.MaxRestingPercent:0 "동시 휴식 상한(%)"
 com.green1052.frontline.MaxRestingPercent.desc:0 "한 전선의 사단 중 동시에 쉬는 비율의 상한입니다."
 com.green1052.frontline.Plugging:0 "돌려막기"
 com.green1052.frontline.Plugging.desc:0 "지고 있는 우리 방어전에 가장 가까운 쌩쌩한 사단(쉬는 사단, 전투계획 밖 사단, 조용한 전선에서 남는 사단)을 보내 방어에 합류시킵니다. 전투가 끝나고 회복하면 원래 전선으로 돌아갑니다."
 com.green1052.frontline.LosingPercent:0 "돌려막기 기준(%)"
 com.green1052.frontline.LosingPercent.desc:0 "전투 막대에서 공격 측이 조직력의 이 비율 이상을 쥐고 있으면 지는 방어전으로 봅니다."
 com.green1052.frontline.PlugRadius:0 "증원 거리(프로빈스)"
 com.green1052.frontline.PlugRadius.desc:0 "증원 사단을 데려올 수 있는 최대 거리입니다."
 com.green1052.frontline.Escape:0 "포위 탈출"
 com.green1052.frontline.Escape.desc:0 "돌출부의 퇴로가 적과 맞닿은 프로빈스 한두 개로 좁아지면, 그 길목이 막히기 전에 전선 사단을 길목 너머로 빼냅니다."
 com.green1052.frontline.Attack:0 "기회 공격과 포위망 소탕"
 com.green1052.frontline.Attack.desc:0 "전선 옆의 빈 적 프로빈스는 쌩쌩한 사단 하나를 보내 점령하고, 이미 포위된 적 사단은 적 사단 수 이상(요새가 있으면 더 많이)의 쌩쌩한 사단을 모아 칠 때만 공격합니다. 출발한 프로빈스에는 우리 사단을 하나 남깁니다. 목표는 포위를 완성하는 곳이 먼저고, 다음은 승점·보급 허브·비행장·항구가 있는 곳, 그다음은 전선이 짧아지는 곳입니다. 점령해도 보급이 따라오지 못하는 곳(포위를 완성하는 곳은 예외)이나 얻는 것 없이 전선만 길어지는 곳은 치지 않습니다."
 com.green1052.frontline.FireBrigade:0 "기동 예비대"
 com.green1052.frontline.FireBrigade.desc:0 "전선마다 기갑·차량화 사단 몇 개를 전투 계획에서 빼 전선 한 칸 뒤에 대기시킵니다. 적이 뚫고 들어오면(이틀 안에 잃은 우리 프로빈스, 상륙, 우리 땅에 들어온 적 부대) 가장 가까운 예비대가 이길 만큼 모여 역습하고(요새 반영, 기동 사단은 두 개로 셈), 끝나면 대기 위치로 돌아갑니다."
 com.green1052.frontline.DepthDefense:0 "종심 방어"
 com.green1052.frontline.DepthDefense.desc:0 "전선의 요충지(항구, 승점, 강을 낀 곳, 도시와 산악) 바로 뒤 프로빈스에 전선에서 남는 사단 하나를 2선으로 세워 둡니다. 그곳 전선이 유지되는 동안 계속 자리를 지킵니다."
 com.green1052.frontline.Shuffle:0 "전선 간 병력 이동"
 com.green1052.frontline.Shuffle.desc:0 "어떤 전선이 밀리면(이틀 사이 프로빈스 세 곳을 잃었거나 지고 있는 방어전이 있거나, 맞선 적이 우리 사단의 두 배 이상이면) 조용한 전선에서 남는 쌩쌩한 사단을 가장 압박받는 프로빈스로 보내고, 위기가 지나고 하루 뒤 원래 전선으로 돌려보냅니다. 그동안 위기 지역 옆에서 쉬고 있는 적 한두 개 사단 스택에 쌩쌩한 사단 하나씩 견제 공격을 걸어 전투에 묶어 두므로, 적이 그 병력을 위기 지역으로 돌리지 못합니다. 견제 공격은 조직력이 떨어지면 물립니다."
 com.green1052.frontline.BattlePlanKeys:0 "전투 계획 단축키"
 com.green1052.frontline.BattlePlanKeys.desc:0 "Ctrl+Alt+E로 모든 전투 계획을 한 번에 시작하고, Ctrl+Alt+H로 전부 멈춥니다."
 com.green1052.frontline.OperationKeys:0 "작전 단축키 (전격전, 협공)"
 com.green1052.frontline.OperationKeys.desc:0 "Ctrl+Alt+B: 선택한 사단으로 전격전을 겁니다(기갑·차량화 사단이 가장 약한 구간을 뚫고 깊숙한 목표까지 밀고 들어가며, 보병이 뒤따라 돌파로를 지킵니다). Ctrl+Alt+P: 선택한 두 군이나 집단군으로 협공합니다(두 선봉이 적 후방에서 만나 포위망을 닫고, 보병이 포위망을 지킵니다). 그동안 같은 군의 쌩쌩한 사단이 돌파 지점 옆 적 스택에 견제 공격을 걸어 전투에 묶어 둡니다. 같은 키를 다시 누르면 취소합니다."
 com.green1052.frontline.OperationDepth:0 "작전 깊이 (프로빈스)"
 com.green1052.frontline.OperationDepth.desc:0 "작전 목표가 적 전선 뒤로 몇 프로빈스까지 들어갈 수 있는지입니다."
 com.green1052.frontline.SpearheadOrganisation:0 "선봉 정지 조직력 (%)"
 com.green1052.frontline.SpearheadOrganisation.desc:0 "선봉 사단은 조직력이 이 값(%) 아래로 떨어지면 더 나아가지 않고, 한쪽 날개의 선봉이 전부 그렇게 되면 작전이 끝납니다."
 com.green1052.frontline.ApplyToAI:0 "AI에도 적용"
 com.green1052.frontline.ApplyToAI.desc:0 "싱글플레이 전용: AI 국가도 같은 전선 보조(교대 휴식, 구멍 메우기, 탈출, 공격, 소방수, 종심 방어, 전선 간 병력 이동)를 위 설정값 그대로 받습니다. 그동안 AI Assist의 교대 휴식, 탈출, 예비대, 2선, 국지 공격은 물러나고, AI Assist의 재편성 훅이 이 사단들을 건드리지 않게 막습니다. AI Assist가 없으면 AI의 재편성이 사단을 도로 데려갈 수 있습니다."
