l_korean:
    com.green1052.frontline.name:0 "전선 관리"
    com.green1052.frontline.desc:0 "손으로 하던 전선 미세조작을 대신합니다.\n- 교대 휴식, 구멍 메우기, 포위 탈출\n- 기회 공격과 우세 공격\n- 소방수, 종심 방어, 전선 간 병력 이동\n- Ctrl+Alt+E / Ctrl+Alt+H: 모든 전투 계획 시작 / 정지\n- Ctrl+Alt+B / Ctrl+Alt+P: 선택한 부대로 블리츠 / 협공\n멀티플레이에서도 작동합니다."
    com.green1052.frontline.Rotation:0 "교대 휴식"
    com.green1052.frontline.Rotation.desc:0 "지친 전선 사단을 뒤로 빼서 쉬게 하고, 회복되면 돌려보냅니다.\n- 같은 전선의 다른 사단이 그 프로빈스를 지킬 때만 빼므로 자리가 비지 않습니다"
    com.green1052.frontline.WornOrganisation:0 "교대 기준: 조직력(%)"
    com.green1052.frontline.WornOrganisation.desc:0 "전선 사단의 조직력이 이 값보다 낮으면 쉬러 갑니다. 교전 중인 사단은 빼지 않습니다."
    com.green1052.frontline.WornStrength:0 "교대 기준: 강도(%)"
    com.green1052.frontline.WornStrength.desc:0 "강도(장비와 인력)가 이 값보다 낮아도 쉬러 갑니다."
    com.green1052.frontline.ReturnOrganisation:0 "복귀 기준: 조직력(%)"
    com.green1052.frontline.ReturnOrganisation.desc:0 "쉬는 사단은 조직력이 이 값까지 회복되면 전선으로 돌아갑니다."
    com.green1052.frontline.ReturnStrength:0 "복귀 기준: 강도(%)"
    com.green1052.frontline.ReturnStrength.desc:0 "강도도 이 값 이상이어야 돌아갑니다. 2주 넘게 쉬었다면 조직력만 회복돼도 돌아갑니다."
    com.green1052.frontline.MaxRestingPercent:0 "동시 휴식 상한(%)"
    com.green1052.frontline.MaxRestingPercent.desc:0 "한 전선에서 동시에 쉴 수 있는 사단 비율의 상한입니다."
    com.green1052.frontline.Plugging:0 "구멍 메우기"
    com.green1052.frontline.Plugging.desc:0 "무너지는 아군 방어전에 쌩쌩한 사단을 보냅니다.\n- 무너지는 중: 아래 기준을 넘었거나, 2일 안에 조직력이 바닥날 때\n- 제때 도착할 수 있는 사단만 보내고, 하루 안에 무너지면 2개를 보냅니다\n- 아군 사단의 2배가 넘는 적과 맞닿은 전선 프로빈스에는 공격 전에 미리 1개\n- 봉쇄: 막 뚫린 곳 둘레의 빈 아군 프로빈스를 채웁니다\n- 위협이 사라지면 전선으로 돌아갑니다(최대 1주)"
    com.green1052.frontline.LosingPercent:0 "구멍 메우기 기준(%)"
    com.green1052.frontline.LosingPercent.desc:0 "전투 막대에서 공격 측이 이 비율 이상을 차지하면 지고 있는 방어전으로 봅니다."
    com.green1052.frontline.PlugRadius:0 "증원 거리(프로빈스)"
    com.green1052.frontline.PlugRadius.desc:0 "증원 사단을 데려올 수 있는 최대 거리입니다."
    com.green1052.frontline.Lure:0 "유인 포위 (AI)"
    com.green1052.frontline.Lure.desc:0 "AI 전용: 지고 있는 방어전을 일부러 내주어 적을 끌어들입니다. 잘라낼 수 있을 때만 합니다.\n- 양옆 전선 프로빈스를 지키고 있고, 그곳 방어전도 지고 있지 않음\n- 3칸 안에 쌩쌩한 기동 사단 2개 이상, 밀고 오는 적은 그 2배 이하\n그 뒤 AI 보조의 포위 기능이 돌출부를 끊고, 소방수가 반격합니다."
    com.green1052.frontline.Escape:0 "포위 탈출"
    com.green1052.frontline.Escape.desc:0 "포위되기 직전의 돌출부에서 전선 사단을 빼냅니다.\n- 퇴로가 적과 맞닿은 프로빈스 1~2개로 좁아졌을 때\n- 그 길목의 적이 포위를 닫을 만큼 강할 때만\n- 이미 포위되어 보급이 끊기면(30 프로빈스 이하, 6칸 안에 아군 전선) 하루 한 번 함께 돌파합니다"
    com.green1052.frontline.Attack:0 "기회 공격"
    com.green1052.frontline.Attack.desc:0 "전선 옆의 빈 적 프로빈스를 쌩쌩한 사단 하나로 점령합니다. 출발지에는 한 사단을 남깁니다.\n- 포위된 적 사단은 그 수 이상(요새면 더 많이) 모여야 공격\n- 우선순위: 포위 완성 > 승점·보급 허브·비행장·항구 > 전선 단축\n- 항구 없는 상륙 교두보에서는 가장 가까운 적 항구 쪽을 우선합니다\n- 제외: 보급이 못 따라오는 곳, 얻는 것 없이 전선이 2칸 넘게 늘어나는 곳"
    com.green1052.frontline.AttackOdds:0 "우세 공격 배율(%)"
    com.green1052.frontline.AttackOdds.desc:0 "이웃 아군 프로빈스의 쌩쌩한 사단 전력이 방어군의 이 배율 이상이면 함께 공격합니다.\n- 200 = 2배. 요새·험지·도하는 더 필요\n- 포위된 적과 아군 땅 안의 적은 대등한 전력만 돼도 먼저 공격\n- 내 사단은 실행 중인 전투 계획에 있을 때만(포위 섬멸은 항상)\n0이면 끕니다(포위 섬멸 포함)"
    com.green1052.frontline.FireBrigade:0 "소방수(기동 예비대)"
    com.green1052.frontline.FireBrigade.desc:0 "전선마다 기갑·차량화 사단 몇 개를 전투 계획에서 빼 전선 한 칸 뒤에 대기시킵니다.\n- 적이 뚫고 들어오면 가장 가까운 예비대가 이길 만큼 모여 역습\n- 돌파 판정: 이틀 안에 잃은 프로빈스, 상륙, 아군 땅 안의 적\n- 역습이 끝나면 대기 위치로 돌아갑니다\n남는 기동 사단이 없는 AI 국가는 보병을 씁니다."
    com.green1052.frontline.DepthDefense:0 "종심 방어"
    com.green1052.frontline.DepthDefense.desc:0 "전선 요충지 바로 뒤에 남는 사단 하나를 2선으로 세웁니다.\n- 요충지: 항구, 승점, 강을 낀 곳, 도시, 산악\n- 그곳 전선이 버티는 동안 자리를 지킵니다"
    com.green1052.frontline.Shuffle:0 "전선 간 병력 이동"
    com.green1052.frontline.Shuffle.desc:0 "조용한 전선의 남는 쌩쌩한 사단을 밀리는 전선으로 보냅니다.\n- 밀리는 전선: 이틀 새 잃었거나 지고 있는 전선 프로빈스가 3곳 이상, 또는 적이 아군의 2배 이상\n- 가장 압박받는 프로빈스를 보강하고, 위기가 끝나고 하루 뒤 돌아갑니다\n- 옆에서 쉬고 있는 적 스택(1~2개 사단)에는 견제 공격을 겁니다\n- 포위망만 마주한 전선은 포위망 사단 수의 2배만 남기고, 나머지는 같은 군의 주 전선으로 보냅니다"
    com.green1052.frontline.BattlePlanKeys:0 "전투 계획 단축키"
    com.green1052.frontline.BattlePlanKeys.desc:0 "Ctrl+Alt+E로 모든 전투 계획을 한 번에 시작하고, Ctrl+Alt+H로 전부 멈춥니다."
    com.green1052.frontline.OperationKeys:0 "작전 단축키(블리츠, 협공)"
    com.green1052.frontline.OperationKeys.desc:0 "선택한 부대로 블리츠나 협공 작전을 겁니다.\n- Ctrl+Alt+B 블리츠: 기갑·차량화가 가장 약한 구간을 뚫고 깊이 진격하고, 보병이 돌파로를 지킵니다\n- Ctrl+Alt+P 협공: 선택한 두 군(또는 집단군)이 적 후방에서 만나고, 보병이 포위망을 지킵니다\n- 같은 군의 쌩쌩한 사단이 돌파 지점 옆의 적을 견제 공격합니다\n- 같은 키를 다시 누르면 취소합니다"
    com.green1052.frontline.OperationDepth:0 "작전 깊이(프로빈스)"
    com.green1052.frontline.OperationDepth.desc:0 "작전 목표를 적 전선 뒤 몇 프로빈스까지 잡을 수 있는지 정합니다."
    com.green1052.frontline.SpearheadOrganisation:0 "선봉 정지 조직력(%)"
    com.green1052.frontline.SpearheadOrganisation.desc:0 "선봉 사단은 조직력이 이 값보다 낮아지면 진격을 멈춥니다. 한쪽 날개의 선봉이 모두 멈추면 작전이 끝납니다."
    com.green1052.frontline.ApplyToAI:0 "AI에도 적용"
    com.green1052.frontline.ApplyToAI.desc:0 "싱글플레이에서 AI 국가에도 이 전선 보조와 유인 포위를 위 설정 그대로 적용합니다.\n- 교대 휴식은 제외: AI 전선 명령이 쉬는 사단을 바로 되가져갑니다\n- AI 보조의 같은 기능은 이 사단들을 건드리지 않습니다\nAI 보조가 없으면 AI의 재편성이 사단을 도로 데려갈 수 있습니다."
    com.green1052.frontline.PlayerRepositions:0 "내 사단을 다른 자리로 이동"
    com.green1052.frontline.PlayerRepositions.desc:0 "내 사단을 전투 계획에서 빼 다른 자리에 세웁니다: 종심 방어, 소방수 대기 자리, 다른 전선 지원, 봉쇄.\n끄면(기본): 그 자리에서 하는 일과 작전 단축키만 쓰고, 이미 다른 자리에 있던 사단은 전투 계획으로 돌아갑니다.\nAI 국가에는 영향이 없습니다."
