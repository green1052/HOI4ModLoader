l_korean:
    com.green1052.frontline.name:0 "전선 관리"
    com.green1052.frontline.desc:0 "손으로 하던 전선 미세조작(교대 휴식, 구멍 메우기, 포위 탈출, 공격, 소방수, 종심 방어, 전선 간 병력 이동)을 대신합니다. 단축키로 모든 전투 계획을 시작·정지하고, 블리츠와 협공 작전을 겁니다."
    com.green1052.frontline.Rotation:0 "교대 휴식"
    com.green1052.frontline.Rotation.desc:0 "지친 전선 사단을 뒤로 빼 쉬게 하고, 회복하면 원래 자리로 돌려보냅니다.\n- 같은 전선의 다른 사단이 그 프로빈스를 지킬 때만 빼므로 자리가 비지 않습니다\n- 교대·복귀 기준과 동시 휴식 상한은 아래에서 정합니다"
    com.green1052.frontline.WornOrganisation:0 "교대 기준: 조직력(%)"
    com.green1052.frontline.WornOrganisation.desc:0 "전선 사단의 조직력이 이 값보다 낮으면 쉬러 갑니다.\n- 교전 중인 사단은 빼지 않습니다"
    com.green1052.frontline.WornStrength:0 "교대 기준: 강도(%)"
    com.green1052.frontline.WornStrength.desc:0 "강도(장비와 인력)가 이 값보다 낮아도 쉬러 갑니다."
    com.green1052.frontline.ReturnOrganisation:0 "복귀 기준: 조직력(%)"
    com.green1052.frontline.ReturnOrganisation.desc:0 "쉬는 사단은 조직력이 이 값까지 회복되면 전선으로 돌아갑니다."
    com.green1052.frontline.ReturnStrength:0 "복귀 기준: 강도(%)"
    com.green1052.frontline.ReturnStrength.desc:0 "강도도 이 값 이상이어야 돌아갑니다.\n- 2주 넘게 쉬었다면 조직력만 회복돼도 돌아갑니다(장비·인력이 계속 모자랄 수 있어서)"
    com.green1052.frontline.MaxRestingPercent:0 "동시 휴식 상한(%)"
    com.green1052.frontline.MaxRestingPercent.desc:0 "한 전선에서 동시에 쉴 수 있는 사단 비율의 상한입니다."
    com.green1052.frontline.Plugging:0 "구멍 메우기"
    com.green1052.frontline.Plugging.desc:0 "무너지는 아군 방어전에 생생한 사단을 보냅니다.\n- 무너지는 중: 아래 기준을 넘었거나, 조직력이 깎이는 속도로 보아 2일 안에 바닥남\n- 제때 도착할 수 있는 사단만(기동 사단 칸당 10시간, 보병 20시간), 하루 안에 무너지면 2개\n- 보강: 자기 사단의 2배 적과 맞닿은 전선 주에 공격 전 미리 1개\n- 봉쇄(종심 방어): 최근 2일 안에 적에게 빼앗긴 땅 둘레의 빈 아군 주를 채워 돌파를 벽으로 막음\n- 위협이 사라지면 전선으로 복귀(최대 1주)"
    com.green1052.frontline.LosingPercent:0 "구멍 메우기 기준(%)"
    com.green1052.frontline.LosingPercent.desc:0 "전투 막대(조직력)에서 공격 측이 이 비율 이상을 차지하면 지는 방어전으로 봅니다."
    com.green1052.frontline.PlugRadius:0 "증원 거리(프로빈스)"
    com.green1052.frontline.PlugRadius.desc:0 "구멍 메우기에 보낼 사단을 데려올 수 있는 최대 거리입니다."
    com.green1052.frontline.Lure:0 "유인 포위 (AI)"
    com.green1052.frontline.Lure.desc:0 "AI 전용(AI에도 적용): 지고 있는 방어전을 막지 않고 적을 끌어들입니다. 잘라낼 수 있을 때만.\n- 양옆(어깨) 전선 프로빈스를 지키고 있고 거기서도 지고 있지 않음\n- 3칸 안에 쌩쌩한 기동 사단 2개 이상, 밀고 오는 적은 그 2배 이하\n적이 들어오면 AI 보조의 포위 기능이 돌출부의 목을 끊고, 소방수가 반격합니다."
    com.green1052.frontline.Escape:0 "포위 탈출"
    com.green1052.frontline.Escape.desc:0 "포위되기 직전의 돌출부에서 전선 사단을 퇴로 밖으로 빼냅니다.\n- 퇴로가 적과 맞닿은 프로빈스 1~2개로 좁아졌을 때\n- 그 길목의 적이 돌출부 안 아군 이상으로 강할 때만(약하면 포위를 닫지 못하므로)\n- 이미 포위됐다면(30 프로빈스 이하, 6칸 안에 아군 전선) 안의 사단이 하루 한 번 함께 아군 쪽으로 돌파합니다"
    com.green1052.frontline.Attack:0 "기회 공격"
    com.green1052.frontline.Attack.desc:0 "전선 옆 빈 적 프로빈스를 쌩쌩한 사단 하나로 점령합니다(출발지엔 한 사단을 남김).\n- 이미 둘러싸인 적 사단은 적 수 이상(요새면 더 많이) 모일 때만 공격\n- 항구 없는 상륙 교두보에서는 포위 완성 다음으로 가장 가까운 적 항구 쪽을 먼저 공격\n- 우선순위: 포위 완성 > 승점·보급 허브·비행장·항구 > 전선 단축\n- 제외: 보급이 못 따라오는 곳(포위 완성은 예외), 얻는 것 없이 전선이 2칸 넘게 늘어나는 곳"
    com.green1052.frontline.AttackOdds:0 "우세 공격 배율(%)"
    com.green1052.frontline.AttackOdds.desc:0 "이웃 아군 프로빈스의 쌩쌩한 사단 전력이 방어군의 이 배율 이상이면 함께 공격합니다.\n- 200 = 2배. 요새·험지(산·도시·습지·정글)·도하는 더 필요\n- 포위 섬멸: 포위된 적(12 프로빈스 이하)과 아군 땅 안의 적은 대등한 전력만 모여도 먼저 공격\n- 플레이어 사단은 실행 중인 전투 계획에 있을 때만 우세 공격(포위 섬멸은 항상)\n0이면 끕니다"
    com.green1052.frontline.FireBrigade:0 "소방수(기동 예비대)"
    com.green1052.frontline.FireBrigade.desc:0 "전선마다 기갑·차량화 사단 몇 개를 전투 계획에서 빼 전선 한 칸 뒤에 대기시킵니다.\n- 적이 뚫고 들어오면(이틀 안에 잃은 프로빈스, 상륙, 아군 땅의 적) 가장 가까운 예비대가 이길 만큼 모여 역습\n- 요새를 반영하고, 기동 사단은 두 개로 셉니다\n- 역습이 끝나면 대기 위치로 돌아갑니다\nAI 국가는 남는 기동 사단이 없으면 보병을 씁니다"
    com.green1052.frontline.DepthDefense:0 "종심 방어"
    com.green1052.frontline.DepthDefense.desc:0 "전선 요충지 바로 뒤에 전선의 남는 사단 하나를 2선으로 세워 둡니다.\n- 요충지: 항구, 승점, 강을 낀 곳, 도시, 산악\n- 그곳 전선이 유지되는 동안 자리를 지킵니다"
    com.green1052.frontline.Shuffle:0 "전선 간 병력 이동"
    com.green1052.frontline.Shuffle.desc:0 "밀리는 전선에 조용한 전선의 남는 쌩쌩한 사단을 보냅니다.\n- 밀리는 전선: 이틀 새 잃은 전선 프로빈스와 지는 방어전이 합쳐 3곳 이상, 또는 적이 아군의 2배 이상\n- 가장 압박받는 프로빈스로 가고, 위기가 지나고 하루 뒤 돌아갑니다\n- 그동안 위기 지역 옆에서 쉬는 적 스택(1~2개 사단)에 한 사단씩 견제 공격을 걸어 묶어 둡니다(조직력이 떨어지면 물림)\n- 포위망만 마주한 전선은 포위망 사단 수의 2배(최소 2개)만 남기고, 나머지는 같은 군의 주 전선으로 보냅니다"
    com.green1052.frontline.BattlePlanKeys:0 "전투 계획 단축키"
    com.green1052.frontline.BattlePlanKeys.desc:0 "Ctrl+Alt+E로 모든 전투 계획을 한 번에 시작하고, Ctrl+Alt+H로 전부 멈춥니다."
    com.green1052.frontline.OperationKeys:0 "작전 단축키(블리츠, 협공)"
    com.green1052.frontline.OperationKeys.desc:0 "선택한 부대로 블리츠나 협공 작전을 겁니다.\n- Ctrl+Alt+B 블리츠: 기갑·차량화가 가장 약한 구간을 뚫고 깊이 진격, 보병이 돌파로를 지킴\n- Ctrl+Alt+P 협공: 선택한 두 군(또는 집단군)의 선봉이 적 후방에서 만나 포위, 보병이 포위망을 지킴\n- 그동안 같은 군의 쌩쌩한 사단이 돌파 지점 옆 적에 견제 공격\n같은 키를 다시 누르면 취소합니다"
    com.green1052.frontline.OperationDepth:0 "작전 깊이(프로빈스)"
    com.green1052.frontline.OperationDepth.desc:0 "작전 목표를 적 전선 뒤 몇 프로빈스까지 잡을 수 있는지 정합니다."
    com.green1052.frontline.SpearheadOrganisation:0 "선봉 정지 조직력(%)"
    com.green1052.frontline.SpearheadOrganisation.desc:0 "선봉 사단은 조직력이 이 값보다 낮아지면 진격을 멈춥니다.\n- 한쪽 날개의 선봉이 모두 멈추면 작전이 끝납니다"
    com.green1052.frontline.ApplyToAI:0 "AI에도 적용"
    com.green1052.frontline.ApplyToAI.desc:0 "싱글플레이에서 AI 국가에도 이 전선 보조를 위 설정 그대로 적용합니다.\n- 대상: 구멍 메우기, 탈출, 공격, 소방수, 종심 방어, 전선 간 병력 이동, 유인\n- 교대 휴식은 제외: AI 전선 명령이 쉬는 사단을 바로 되가져감\n- 그동안 AI Assist의 같은 기능(교대 휴식, 탈출, 예비대, 2선, 국지 공격)은 물러나고, 이 사단들을 재편성하지 않습니다\nAI Assist가 없으면 AI의 재편성이 사단을 도로 데려갈 수 있습니다"
