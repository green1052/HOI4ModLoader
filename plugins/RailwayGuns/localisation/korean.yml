l_korean:
 com.green1052.railwayguns.name:0 "열차포"
 com.green1052.railwayguns.desc:0 "열차포를 원수에게 배정할 수 있고(멀티: 야전군들에 나눠 배정), 전선 바로 뒤에 머물며 바다를 건너지 않습니다."
 com.green1052.railwayguns.FieldMarshal:0 "원수 배정"
 com.green1052.railwayguns.FieldMarshal.desc:0 "열차포를 선택한 채 원수 카드를 우클릭하면 원수에게 배정하고, 원수의 모든 야전군을 따라 자리를 잡습니다. 싱글 플레이: 게임 규칙을 바꿉니다."
 com.green1052.railwayguns.SpreadOverArmies:0 "멀티: 야전군에 나눠 배정"
 com.green1052.railwayguns.SpreadOverArmies.desc:0 "멀티플레이에서는 원수가 열차포를 가질 수 없으므로, 열차포를 선택한 채 원수 카드를 우클릭하면 그 원수의 야전군들에 나눠 배정합니다."
 com.green1052.railwayguns.FrontPenalty:0 "최전선 감점"
 com.green1052.railwayguns.FrontPenalty.desc:0 "최전선(적 점령지나 적 부대 옆) 프로빈스에서 깎는 점수입니다. 0이면 끕니다. 전투 근처 바닐라 보너스는 100~200 정도입니다. 싱글 플레이 전용."
 com.green1052.railwayguns.NoSeaTransfer:0 "바다 수송 금지"
 com.green1052.railwayguns.NoSeaTransfer.desc:0 "열차포를 바다로 수송하지 않고 자기 철도망 안에서만 움직입니다. 싱글 플레이 전용."
