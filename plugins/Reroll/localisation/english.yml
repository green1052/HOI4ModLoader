l_english:
    com.green1052.reroll.desc:0 "A fresh random seed every time a game starts or a save is loaded.\n- Reloading no longer replays the same combat and event dice\n- What was settled before the save (an open event, a scheduled one) stays\nSingle player only. Ironman games only with the setting below."
    com.green1052.reroll.InIronman:0 "In Ironman too"
    com.green1052.reroll.InIronman.desc:0 "Also in Ironman games (whose point is that nothing is replayed).\nOff by default."
