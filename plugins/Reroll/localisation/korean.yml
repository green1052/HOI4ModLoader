l_korean:
    com.green1052.reroll.name:0 "리롤"
    com.green1052.reroll.desc:0 "게임을 시작하거나 불러올 때마다 새 난수 시드를 씁니다.\n- 다시 불러와도 전투·이벤트 결과가 똑같이 반복되지 않음\n- 저장 전에 이미 정해진 것(열린 이벤트, 예정된 이벤트)은 그대로\n싱글 전용. 철인 모드는 아래 설정을 켜야 적용."
    com.green1052.reroll.InIronman:0 "철인 모드에서도"
    com.green1052.reroll.InIronman.desc:0 "철인 모드 게임에서도 새 시드를 씁니다(기본 꺼짐).\n철인 모드는 원래 다시 굴리기를 막는 모드입니다."
