l_korean:
    com.green1052.reroll.name:0 "리롤"
    com.green1052.reroll.desc:0 "게임을 시작하거나 세이브를 불러올 때마다 새 난수 시드를 씁니다. 다시 불러와도 전투, 이벤트의 무작위 결과(random_list, 평균 발생 시간)가 똑같이 반복되지 않습니다. 저장 시점에 이미 정해진 것(열린 이벤트 창, 날짜가 정해진 이벤트)은 그대로입니다."
    com.green1052.reroll.InIronman:0 "철인 모드에서도"
    com.green1052.reroll.InIronman.desc:0 "철인 모드 게임에서도 새 시드를 씁니다(철인 모드는 원래 다시 굴리기를 막는 모드입니다)."
