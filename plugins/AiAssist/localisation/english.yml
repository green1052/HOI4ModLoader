l_english:
    com.green1052.aiassist.desc:0 "Add-on for Sheep Mod: fixes AI logic its scripts cannot reach (no bonuses). Single player; does nothing without Sheep Mod."
    com.green1052.aiassist.ArmorTerrain:0 "Armor terrain"
    com.green1052.aiassist.ArmorTerrain.desc:0 "Armored and motorized divisions don't make local attacks into terrain that cripples them (forest, hills, marsh...) or across a river into mountains, marsh, jungle or cities. It reads the divisions' own terrain modifiers, so modded values count."
    com.green1052.aiassist.AirRetreat:0 "Air retreat"
    com.green1052.aiassist.AirRetreat.desc:0 "The AI pulls its planes out of regions where it is losing the air war badly (under 35 % of air superiority, 20+ planes lost in a week, 1.5+ losses per kill) and uses them where it can win. Under 15 % it leaves completely."
    com.green1052.aiassist.HoldTheLine:0 "Hold the line"
    com.green1052.aiassist.HoldTheLine.desc:0 "At war, the AI keeps a division in every province of a front that borders the enemy (enemy divisions or not); vanilla can ship a whole fighting front away (supply crisis, another front). Its regrouping can't take the last defender of a province next to enemy ground (troops there or not), the divisions walling in a pocket, a reserve, or a division that arrived in the last week (vanilla shuffles fresh arrivals back and forth). Free divisions walk back into empty line provinces, ports, victory points, river banks, cities and mountains first (key ground from further away), the same front's divisions first; one taken from another front is held there. A country with divisions to spare keeps reserves a province behind its line and a second division behind its key line provinces; ready reserves counterattack break-ins near them (enemy troops inside our lines, ground lost in the last two days, a landing) and go back to their post. A country short of divisions for its line doesn't start attacks and stops the running offensives of its thinly held fronts (advancing would widen the line and get the spearhead cut off), unless it outguns the enemy there two to one. Divisions worn out by fighting rest a few provinces back (a quarter of those around at most), and divisions in a salient whose way back is closing under an enemy at least as strong pull out, as long as another division holds their province; not where the AI outguns the enemy two to one. Rested divisions go back on their own order, as do reserves the line moved away from (vanilla would send them to a far front and back). Newly deployed divisions go where they are needed most first: the grad's holes (Defensive postures), else the empty provinces of the line, then the province least held of the most thinly held front; vanilla's theatre share-out sends them wherever its requests point. They are left alone while they walk there."
    com.green1052.aiassist.DefensivePostures:0 "Defensive postures"
    com.green1052.aiassist.DefensivePostures.desc:0 "An AI country facing a much stronger enemy (twice its share of power along the line, or 1.3x while it lost line provinces in the last week or is short of divisions) gives up exposed ground and holds its grad: the most defensible short line between that enemy and its capital (rivers, mountains, marsh, forests, hills, cities and forts in front, few directions to be attacked from), redrawn weekly, or one line back once the enemy breaks in. Its divisions walk there and stay (victory point cities get one more), it starts no offensives or paradrops (landings still go), and it attacks only fought-out enemy stacks next to the line, with two fresh divisions or more (reserves behind the grad too), while single divisions pin the enemy stacks that could come to their aid; worn-out attackers break off. Once every enemy it fell back from stays under 80 % of its power for a week (a month after falling back at the earliest), its divisions go back on their orders, and for a month only twice its strength puts it back on a grad. Out of contact, the posture stays as it is. Needs Hold the line."
    com.green1052.aiassist.BreakthroughAxis:0 "Breakthrough axis"
    com.green1052.aiassist.BreakthroughAxis.desc:0 "The AI's local attacks keep to a breakthrough axis: while the AI's own armoured spearhead (the game's force concentration) attacks, the axis is where its path crosses the enemy line, and it moves forward with the spearhead; otherwise its front's thinnest enemy sector (few divisions, no forts, open terrain), held three days and moved on only once taken, so divisions don't zig-zag between sectors. Off the axis, the line only attacks enemy divisions next to it, where the attack is strong enough: a division under attack can't move except to retreat, so they can't shift into the breakthrough. Its close air support backs battles on the axis first; vanilla goes by province list order."
    com.green1052.aiassist.Encirclement:0 "Encirclement"
    com.green1052.aiassist.Encirclement.desc:0 "The breakthrough axis goes for enemy salients first: where enemy ground bulges into the AI's line through a neck of one or two provinces, and taking the neck cuts off 3+ enemy divisions for less than it costs, the local attacks and close air support of both flanks go for the neck instead of pushing the salient head-on. Kept until the pocket closes, a week at most. Needs Breakthrough axis."
    com.green1052.aiassist.RailwayGuns:0 "Railway guns"
    com.green1052.aiassist.RailwayGuns.desc:0 "The AI's railway guns go to the armies on its breakthrough axis first and stay there: those armies are served first, and other armies can't take their guns. Vanilla hands them to the biggest armies wherever they are. Needs Breakthrough axis."
    com.green1052.aiassist.SupplyHubs:0 "Supply hubs"
    com.green1052.aiassist.SupplyHubs.desc:0 "Where an AI country's divisions are low on supply, the railway from the supply hub feeding them to the capital is upgraded a level (one a week, the same hub's again after 60 days; a railway level costs little next to a hub). From 1941 on, where the divisions of an AI country with 60+ civilian factories starve with no supply hub within 3 provinces, it also builds one there (railway-connected provinces first); checked weekly, two a month at most. A hub costs 20000, so earlier or poorer it doesn't. Vanilla's AI only upgrades and links the hubs it has."
    com.green1052.aiassist.AttackTargets:0 "Attack targets"
    com.green1052.aiassist.AttackTargets.desc:0 "The AI's local attacks pick their target instead of at random among the ones that pass vanilla's checks: provinces that cut off enemy divisions first, then valuable ones (victory points, capitals, supply hubs, airfields, resources, empty or worn-out defences; defenders dug in to 60 %+ count against), then ones that shorten the front over ones that lengthen it. Next to a pocket of the AI's own divisions, the enemy province that opens a corridor to it comes first (also breakouts from inside), ahead of pocket closing when at least as many of its divisions are trapped as the attack would cut off; vanilla has no relief or breakout logic. Fresh divisions also take empty enemy provinces next to the line, where another division stays behind; vanilla's local attacks often skip them."
    com.green1052.aiassist.BeachDefense:0 "Beach defence"
    com.green1052.aiassist.BeachDefense.desc:0 "Naval landings are answered at once: free divisions near the beachhead wall it in and attack into it. A beachhead is ground the enemy took from the sea in the last ten days, even next to its own coast, or a small enemy pocket on the coast. Vanilla leaves a landing alone until the front collapses."
    com.green1052.aiassist.SupplyAwareAttacks:0 "Supply-aware attacks"
    com.green1052.aiassist.SupplyAwareAttacks.desc:0 "The AI's local attacks skip provinces its divisions couldn't be supplied in once taken: supply only flows through provinces of ours or our allies, and the attack's own province gets too little while no other of ours next to the target has some to spare. Pocket-closing targets and the corridor to a pocket of ours are still taken. Vanilla never looks at supply when it picks a local attack."
    com.green1052.aiassist.SupplyAwareMinPercent:0 "Supply-aware attacks: supply (%)"
    com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "Supply (% of what the attacking province needs) it must get, or another province of ours next to the target must have to spare, for a local attack."
    com.green1052.aiassist.RefitPriority:0 "Front-line refit"
    com.green1052.aiassist.RefitPriority.desc:0 "Reinforcements and new equipment go to the AI's front-line divisions (in combat or next to enemy-held ground) before its rear and garrison divisions. Vanilla ranks divisions only by template and theatre priority. A front-line division more than 75 % full still yields to empty ones."
    com.green1052.aiassist.BombingTargets:0 "Bombing targets"
    com.green1052.aiassist.BombingTargets.desc:0 "The AI's strategic bombers go for the enemy regions next to its land front first (the factories, supply hubs and airfields feeding the battle): they ask for twice the planes there, while regions far behind the front get half the planes and a lower priority. Vanilla scores enemy regions by what is in them only, however far from the front."
    com.green1052.aiassist.ProductionLines:0 "Production lines"
    com.green1052.aiassist.ProductionLines.desc:0 "The AI keeps factories on production lines that have built up efficiency: a small cut (up to a quarter) to equipment whose lines average 35 %+ efficiency is held for a while and the factories come off the smallest increases elsewhere. Vanilla takes them off the last lines whatever their efficiency and moves them to other equipment, where they start over at 10 %. Big cuts and full stops go through."
    com.green1052.aiassist.StickyDays:0 "Production lines: hold (days)"
    com.green1052.aiassist.StickyDays.desc:0 "Days a small cut to an efficient production line is held; if the AI still wants it after that, it goes through."
    com.green1052.aiassist.StrategicInvasions:0 "Strategic invasions"
    com.green1052.aiassist.StrategicInvasions.desc:0 "The AI picks the beach for a naval invasion by what is there: thinly held coast near victory points, capitals, supply hubs, airfields and resources first; beaches with enemy divisions nearby, land forts or coastal bunkers last. Vanilla weighs only distance, ports and area priorities. A planned landing also waits (a week at most) while the enemy divisions around its beach outnumber half the landing force. Fighters cover the sea regions on a planned landing's route: twice what the air AI wants there (100 at least), and twice the naval bombers where enemy ships are; vanilla's air AI never looks at the route (its navy already has to win those regions before the landing sails)."
    com.green1052.aiassist.StrategicParadrops:0 "Strategic paradrops"
    com.green1052.aiassist.StrategicParadrops.desc:0 "The AI uses its paratroopers (needs Breakthrough axis): up to four paradrop-capable divisions of an army of the theatre its breakthrough axis is in fly from the airbase nearest the axis that can carry them onto an empty enemy province behind the line near the axis (victory points, supply hubs, airfields, pockets first). They jump only when vanilla allows the drop: prepared, enough transport planes, air superiority on the route. Meanwhile the rest of the AI leaves them alone; a drop that hasn't gone in two weeks is given up. Vanilla's AI never paradrops. Sheep Mod's AI builds no paratroopers or transport planes, so drops are rare there; the log says which check stopped them."
