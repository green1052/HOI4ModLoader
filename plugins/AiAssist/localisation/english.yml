l_english:
 com.green1052.aiassist.desc:0 "Add-on for Sheep Mod: fixes AI logic its scripts cannot reach (no bonuses). Single player; does nothing without Sheep Mod."
 com.green1052.aiassist.ArmorTerrain:0 "Armor terrain"
 com.green1052.aiassist.ArmorTerrain.desc:0 "Armored and motorized divisions don't make local attacks into terrain that cripples them (forest, hills, marsh...) or across a river into mountains, marsh, jungle or cities. It reads the divisions' own terrain modifiers, so modded values count."
 com.green1052.aiassist.AirRetreat:0 "Air retreat"
 com.green1052.aiassist.AirRetreat.desc:0 "The AI pulls its planes out of regions where it is losing the air war badly (under 35 % of air superiority, 20+ planes lost in a week, 1.5+ losses per kill) and uses them where it can win. Under 15 % it leaves completely."
 com.green1052.aiassist.HoldTheLine:0 "Hold the line"
 com.green1052.aiassist.HoldTheLine.desc:0 "At war, the AI keeps a division in every province of a front that borders the enemy (enemy divisions or not); vanilla can ship a whole fighting front away (supply crisis, another front). Its regrouping can't take a province's last defender, the divisions walling in a pocket, a reserve, or a division that arrived in the last week (vanilla shuffles fresh arrivals back and forth). Free divisions walk back into empty line provinces, ports, victory points, river banks, cities and mountains first (key ground from twice as far); a country with divisions to spare keeps reserves a province behind its line; and one short of divisions for its line doesn't start attacks (advancing would widen it and get the spearhead cut off). Worn-out divisions in contact rest a few provinces back where another division holds their province, and divisions in a salient whose way back is closing pull out before the pocket closes; both go back to a front once rested. Running attacks are never stopped."
 com.green1052.aiassist.BreakthroughAxis:0 "Breakthrough axis"
 com.green1052.aiassist.BreakthroughAxis.desc:0 "The AI's local attacks keep to a breakthrough axis: its front's thinnest enemy sector (few divisions, no forts, open terrain), held for a day so divisions don't zig-zag between sectors. Its close air support backs battles on the axis first; vanilla goes by province list order."
 com.green1052.aiassist.AttackTargets:0 "Attack targets"
 com.green1052.aiassist.AttackTargets.desc:0 "The AI's local attacks pick their target instead of at random among the ones that pass vanilla's checks: provinces that cut off enemy divisions first, then valuable ones (victory points, capitals, supply hubs, airfields, resources, empty or worn-out defences; defenders dug in to 60 %+ count against), then ones that shorten the front over ones that lengthen it. Fresh divisions also take empty enemy provinces next to the line, where another division stays behind; vanilla's local attacks often skip them."
 com.green1052.aiassist.BeachDefense:0 "Beach defence"
 com.green1052.aiassist.BeachDefense.desc:0 "Naval landings are answered at once: free divisions next to the beachhead wall it in and attack into it. Vanilla leaves a landing alone until the front collapses."
 com.green1052.aiassist.SupplyAwareAttacks:0 "Supply-aware attacks"
 com.green1052.aiassist.SupplyAwareAttacks.desc:0 "The AI's local attacks skip provinces its divisions couldn't be supplied in once taken: supply only flows through provinces of ours or our allies, and the attack's own province gets too little while no other of ours next to the target has some to spare. Pocket-closing targets are still taken. Vanilla never looks at supply when it picks a local attack."
 com.green1052.aiassist.SupplyAwareMinPercent:0 "Supply-aware attacks: supply (%)"
 com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "Supply (% of what the attacking province needs) it must get, or another province of ours next to the target must have to spare, for a local attack."
 com.green1052.aiassist.RefitPriority:0 "Front-line refit"
 com.green1052.aiassist.RefitPriority.desc:0 "Reinforcements and new equipment go to the AI's front-line divisions (in combat or next to enemy-held ground) before its rear and garrison divisions. Vanilla ranks divisions only by template and theatre priority. A front-line division more than 75 % full still yields to empty ones."
