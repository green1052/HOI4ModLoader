l_english:
    com.green1052.aiassist.desc:0 "Add-on for Sheep Mod: fixes AI decisions its scripts cannot reach (no stat bonuses). Single player only; does nothing without Sheep Mod."
    com.green1052.aiassist.ArmorTerrain:0 "Armor terrain"
    com.green1052.aiassist.ArmorTerrain.desc:0 "Armored and motorized divisions don't make local attacks into bad terrain.\n- Avoids terrain that cuts their attack hard (forest, hills, marsh...)\n- Never across a river into mountains, marsh, jungle or cities\n- Reads the divisions' own terrain modifiers, so modded values count"
    com.green1052.aiassist.AirRetreat:0 "Air retreat"
    com.green1052.aiassist.AirRetreat.desc:0 "Pulls planes out of regions where the AI is losing the air war badly and uses them where it can win.\n- When: under 35 % air superiority, 20+ planes lost in a week, 1.5+ losses per kill\n- Under 15 % it leaves completely"
    com.green1052.aiassist.HoldTheLine:0 "Hold the line"
    com.green1052.aiassist.HoldTheLine.desc:0 "At war, the AI never leaves its line facing the enemy empty.\n- One division stays in every province bordering the enemy (troops there or not), and on the front at least as many divisions as the enemy has across it (other fronts can't take them) ; divisions on or right behind a line with enemy divisions near aren't redeployed to another front; pocket walls, reserves and divisions that arrived within a week aren't taken either\n- Against enemies that hold no port (they can't land), no coast and home garrisons: those divisions stay on the front\n- Empty spots are filled by nearby free divisions (ports, victory points, cities, mountains first); with divisions to spare, reserves counterattack break-ins\n- Short of divisions, it stops offensives (unless 2x stronger there)\n- Worn-out divisions rest behind the line; divisions in a closing salient pull out"
    com.green1052.aiassist.DefensivePostures:0 "Defensive postures"
    com.green1052.aiassist.DefensivePostures.desc:0 "Facing a much stronger enemy, the AI gives up exposed ground and falls back to a grad.\n- Grad: the most defensible short line between the enemy and its capital (redrawn weekly, one line back if broken)\n- When: enemy 2x stronger (1.6x while it lost line provinces in the last week)\n- No new offensives or paradrops (landings go on); only fought-out enemy stacks at the line are hit, with 2+ divisions\n- Returns once every enemy stays under 80 % of its power for a week (not before a month); then only 2x sends it back for a month\nNeeds: Hold the line"
    com.green1052.aiassist.BreakthroughAxis:0 "Breakthrough axis"
    com.green1052.aiassist.BreakthroughAxis.desc:0 "Local attacks keep to one breakthrough axis, so divisions don't zig-zag along the front.\n- While the armored spearhead (force concentration) attacks, its path is the axis and moves with it\n- Otherwise the thinnest enemy sector (few divisions, no forts, open terrain), held 3 days and moved on only once taken\n- Off the axis, only pinning attacks that can win\n- Close air support backs battles on the axis first"
    com.green1052.aiassist.Encirclement:0 "Encirclement"
    com.green1052.aiassist.Encirclement.desc:0 "The breakthrough axis goes for enemy salients first, to encircle them.\n- Target: a salient whose neck (1-2 provinces wide) cuts off 3+ enemy divisions when taken, worth what it costs\n- Local attacks and close air support of both flanks hit the neck, not the salient head-on\n- Kept until the pocket closes, a week at most\nNeeds: Breakthrough axis"
    com.green1052.aiassist.RailwayGuns:0 "Railway guns"
    com.green1052.aiassist.RailwayGuns.desc:0 "The AI's railway guns go to the armies on its breakthrough axis first and stay there.\n- Other armies can't take them\n- Vanilla hands them to the biggest armies wherever they are\nNeeds: Breakthrough axis"
    com.green1052.aiassist.SupplyHubs:0 "Supply hubs"
    com.green1052.aiassist.SupplyHubs.desc:0 "Upgrades railways and builds supply hubs for AI divisions low on supply.\n- Railway from the hub feeding them to the capital +1 level (once a week, same hub again after 60 days)\n- From 1941, with 60+ civilian factories and no hub within 3 provinces, builds a new one (railway-linked provinces first)\n- At most 2 hubs a month (a hub costs 20000)"
    com.green1052.aiassist.GroundCrews:0 "Ground crews"
    com.green1052.aiassist.GroundCrews.desc:0 "The AI turns on More Ground Crews where its air wings fight hardest.\n- Effect: +10 % air efficiency in a region for 20 command power (given back when off)\n- Every 2 days, up to 2 regions with 10+ planes lost and shot down in the last 3 days, only if 50+ command power is left after the cost\n- Off after a week without fighting, or one at a time while command power is under 50\nVanilla's AI never turns them on"
    com.green1052.aiassist.AttackTargets:0 "Attack targets"
    com.green1052.aiassist.AttackTargets.desc:0 "Local attacks pick targets by value instead of at random.\n- Order: provinces that cut off enemy divisions, then victory points, capitals, supply hubs, airfields, resources, weak defenders, then ones that shorten the front\n- Defenders dug in to 60 %+ count against\n- Opens a relief or breakout corridor first when its own divisions are pocketed\n- Fresh divisions take empty enemy provinces next to the line"
    com.green1052.aiassist.Exploitation:0 "Exploitation"
    com.green1052.aiassist.Exploitation.desc:0 "Through a gap in the enemy line, fresh mobile divisions drive deep.\n- Gap: empty enemy ground with no enemy division next to it\n- Up to 4 provinces deep, to the most valuable province (capital, victory points, supply hub, airfields)\n- 2 divisions per target at most, 4 per country every 3 hours; off their battle plan for a week, then back"
    com.green1052.aiassist.Pincers:0 "Pincers"
    com.green1052.aiassist.Pincers.desc:0 "Where the enemy masses divisions, the breakthrough axis becomes two arms that close behind them.\n- Mass: 3+ divisions in a line province, twice the line's average\n- Arms: the thinnest enemy sector on each side, 2-5 line provinces away\n- Kept 3 days while both arms' targets are still the enemy's\nNeeds Breakthrough axis."
    com.green1052.aiassist.Feints:0 "Feints"
    com.green1052.aiassist.Feints.desc:0 "Before a new main push, the AI first attacks elsewhere so the enemy's reserves move there.\n- Feint: the enemy line province with the most divisions, 5+ provinces from the push\n- For 36 hours; the push waits meanwhile, then the feint stops\nNeeds Breakthrough axis."
    com.green1052.aiassist.BeachDefense:0 "Beach defence"
    com.green1052.aiassist.BeachDefense.desc:0 "Answers naval landings at once by sealing off and attacking the beachhead.\n- Free divisions near the landing wall it in and attack into it\n- Beachhead: ground the enemy took from the sea in the last 10 days, or a small enemy pocket on the coast\nVanilla leaves a landing alone until the front collapses"
    com.green1052.aiassist.SupplyAwareAttacks:0 "Supply-aware attacks"
    com.green1052.aiassist.SupplyAwareAttacks.desc:0 "Local attacks skip provinces that couldn't be supplied once taken.\n- No attack when the attacking province is short and no other province of ours next to the target has supply to spare\n- Supply only flows through our and our allies' provinces\n- Exceptions: pocket-closing targets, the corridor to a pocket of ours\nThreshold: the minimum supply (%) setting below"
    com.green1052.aiassist.SupplyAwareMinPercent:0 "Supply-aware attacks: min supply (%)"
    com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "Minimum supply for a local attack.\n- The attacking province must get this % of what it needs, or another province of ours next to the target must have that much to spare"
    com.green1052.aiassist.RefitPriority:0 "Front-line refit"
    com.green1052.aiassist.RefitPriority.desc:0 "Reinforcements and new equipment go to front-line divisions first.\n- Front line: in combat or next to enemy-held ground\n- Rear and garrison divisions come after\n- A front-line division over 75 % full yields to emptier ones"
    com.green1052.aiassist.BombingTargets:0 "Bombing targets"
    com.green1052.aiassist.BombingTargets.desc:0 "Strategic bombers hit enemy regions right behind the land front first.\n- Targets: the factories, supply hubs and airfields feeding the battle\n- Twice the planes for regions next to the front\n- Half the planes and lower priority for regions far behind it"
    com.green1052.aiassist.AirTraining:0 "Air training"
    com.green1052.aiassist.AirTraining.desc:0 "Trains green air wings instead of flying them where nothing happens.\n- Who: wings below the second experience level\n- At peace: any wing it would send on a mission; at war: fighters it would send to patrol land regions with no enemy planes\n- At most half the wings at once; back to their missions once trained"
    com.green1052.aiassist.ProductionLines:0 "Production lines"
    com.green1052.aiassist.ProductionLines.desc:0 "Keeps factories on production lines that have built up efficiency.\n- Small cuts (up to 1/4) to equipment whose lines average 35 %+ efficiency are held off\n- The factories come off the smallest increase elsewhere instead\n- Big cuts and full stops go through\nVanilla moves factories regardless and they restart at 10 % efficiency"
    com.green1052.aiassist.StickyDays:0 "Production lines: hold (days)"
    com.green1052.aiassist.StickyDays.desc:0 "Days a small cut to an efficient production line is held off.\n- If the AI still wants it after that, it goes through"
    com.green1052.aiassist.StrategicInvasions:0 "Strategic invasions"
    com.green1052.aiassist.StrategicInvasions.desc:0 "Picks invasion beaches by what is there, and covers the route with planes.\n- First: thinly held coast near victory points, capitals, supply hubs, airfields and resources\n- Last: beaches with enemy divisions nearby, forts or coastal bunkers\n- Waits (a week at most) while enemy divisions near the beach outnumber half the landing force\n- Twice the fighters over the route (100 at least), twice the naval bombers where enemy ships are"
    com.green1052.aiassist.StrategicParadrops:0 "Strategic paradrops"
    com.green1052.aiassist.StrategicParadrops.desc:0 "The AI drops paratroopers behind its breakthrough axis or its own beachheads (vanilla's AI never paradrops).\n- Up to 4 divisions onto an empty enemy province behind the line near the axis (victory points, supply hubs, airfields, pockets first)\n- With no axis drop, behind a beachhead from the last 10 days\n- Only when prepared, with enough transports and air superiority on the route; given up after 2 weeks\nNeeds: Breakthrough axis. Units and transports come from the 'Airborne units' setting"
    com.green1052.aiassist.AirborneUnits:0 "Airborne units"
    com.green1052.aiassist.AirborneUnits.desc:0 "Makes major AI powers field paratroopers and transport planes.\n- Who: Germany, UK, US, Japan, USSR, Italy\n- From 1938 with 30+ military factories: researches the techs\n- With 40+ military factories: about 4 % paratrooper divisions and transport plane production\nTakes effect at next start. Changes the checksum: turn it off and restart for multiplayer with players without it"
