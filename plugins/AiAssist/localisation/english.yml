l_english:
    com.green1052.aiassist.name:0 "AI Assist"
    com.green1052.aiassist.desc:0 "Add-on for Sheep Mod: fixes AI decisions its scripts can't reach, with no stat bonuses.\n- Holds the line and refills its holes\n- Focuses attacks on a breakthrough axis and on valuable targets\n- Outmatched countries fall back to a defensible line\n- Better use of planes, ships and naval invasions\n- Steadier production, refits, supply and training\nSingle player only; does nothing without Sheep Mod."
    com.green1052.aiassist.ArmorTerrain:0 "Armor terrain"
    com.green1052.aiassist.ArmorTerrain.desc:0 "Armored and motorized divisions don't make local attacks into terrain that cripples them.\n- Forest, hills, marsh and the like\n- No river crossings into mountains, marsh, jungle or cities\n- Uses the divisions' own terrain modifiers, so modded values count"
    com.green1052.aiassist.AirRetreat:0 "Air retreat"
    com.green1052.aiassist.AirRetreat.desc:0 "The AI pulls planes out of regions where it is losing the air war badly and uses them where it can win.\n- Losing: under 35 % air superiority, 20+ planes lost in a week, 1.5+ losses per kill\n- Under 15 % it leaves entirely"
    com.green1052.aiassist.HoldTheLine:0 "Hold the line"
    com.green1052.aiassist.HoldTheLine.desc:0 "At war, the AI never leaves its line facing the enemy empty.\n- Every province bordering the enemy keeps a division; other fronts and redeployments can't take it\n- Holes are refilled from nearby (ports, victory points, cities, mountains first)\n- Spare divisions stand in reserve and counterattack break-ins\n- Short of divisions, it starts no attacks and stops its offensives (unless 2x stronger there)\n- Worn-out divisions rest behind the line; divisions in a closing salient pull out\n- Offensives losing most of their attacks are called off\n- Fewer coast and home garrisons while the land front needs divisions"
    com.green1052.aiassist.DefensivePostures:0 "Defensive postures"
    com.green1052.aiassist.DefensivePostures.desc:0 "Facing a much stronger enemy, the AI gives up exposed ground and falls back to a grad.\n- Grad: the most defensible short line between that enemy and its capital; redrawn weekly, one line back if broken\n- When: the enemy is 2x stronger (1.6x while it is losing line provinces)\n- No new offensives (landings go on); it counterattacks only fought-out enemy stacks, with 2+ divisions\n- Returns once every enemy stays under 80 % of its strength for a week (a month at the earliest); for a month after, only 2x sends it back\nNeeds Hold the line."
    com.green1052.aiassist.BreakthroughAxis:0 "Breakthrough axis"
    com.green1052.aiassist.BreakthroughAxis.desc:0 "Local attacks keep to one breakthrough axis instead of spreading along the front.\n- While the armored spearhead (force concentration) attacks, the axis follows it\n- Otherwise: the theatre's thinnest enemy sector (few divisions, no forts, open terrain), kept 3 days and moved only once taken\n- Off the axis, only attacks that pin enemy divisions next to it\n- Close air support backs battles on the axis first"
    com.green1052.aiassist.Encirclement:0 "Encirclement"
    com.green1052.aiassist.Encirclement.desc:0 "The breakthrough axis goes for enemy salients first.\n- Target: a salient whose neck (1-3 provinces) cuts off 3+ enemy divisions when taken, worth the cost\n- Both flanks' local attacks and close air support hit the neck, not the salient head-on\n- Kept until the pocket closes, a week at most\nNeeds Breakthrough axis."
    com.green1052.aiassist.RailwayGuns:0 "Railway guns"
    com.green1052.aiassist.RailwayGuns.desc:0 "The AI's railway guns go to the armies on its breakthrough axis first and stay there.\n- Other armies can't take them\n- Vanilla gives them to the biggest armies wherever they are\nNeeds Breakthrough axis."
    com.green1052.aiassist.SupplyHubs:0 "Supply hubs"
    com.green1052.aiassist.SupplyHubs.desc:0 "Upgrades railways and builds supply hubs where AI divisions are low on supply.\n- The railway from their hub to the capital gains a level (weekly; the same hub again after 60 days)\n- From 1941, a country with 60+ civilian factories builds a hub where none is within 3 provinces (railway-linked provinces first)\n- At most 2 new hubs a month (a hub costs 20000)"
    com.green1052.aiassist.GroundCrews:0 "Ground crews"
    com.green1052.aiassist.GroundCrews.desc:0 "The AI turns on More Ground Crews where its air wings fight hardest.\n- Effect: +10 % air efficiency in a region for 20 command power, refunded when turned off\n- Every 2 days, up to 2 regions with 10+ planes lost and shot down in 3 days, if 50+ command power is left\n- Off after a week without fighting, or one at a time while command power is under 50\nVanilla's AI never uses it."
    com.green1052.aiassist.AttackTargets:0 "Attack targets"
    com.green1052.aiassist.AttackTargets.desc:0 "Local attacks pick targets by value instead of at random.\n- First: provinces that cut off enemy divisions\n- Then: victory points, capitals, supply hubs, airfields, resources, weak defenders (60 %+ dug in counts against)\n- Then: provinces that shorten the front\n- With its own divisions pocketed, a relief or breakout corridor comes first\n- Fresh divisions take empty enemy provinces next to the line"
    com.green1052.aiassist.Exploitation:0 "Exploitation"
    com.green1052.aiassist.Exploitation.desc:0 "Fresh mobile divisions drive through gaps in the enemy line.\n- Gap: empty enemy ground no enemy division covers\n- Up to 4 provinces deep, to the most valuable province (capital, victory points, supply hub, airfields)\n- 2 divisions per target, 4 per country every 3 hours; off their battle plan for a week\nNeeds Hold the line."
    com.green1052.aiassist.Pincers:0 "Pincers"
    com.green1052.aiassist.Pincers.desc:0 "Where the enemy masses divisions, the breakthrough axis splits into two arms that close behind them.\n- Mass: 3+ divisions in a line province, twice the line's average\n- Arms: the thinnest enemy sector on each side, 2-5 line provinces away\n- Kept 3 days while both arms' targets are still enemy-held\nNeeds Breakthrough axis."
    com.green1052.aiassist.Feints:0 "Feints"
    com.green1052.aiassist.Feints.desc:0 "Before a new main push, the AI attacks elsewhere first to draw the enemy's reserves away.\n- Feint: the enemy line province with the most divisions, 5+ provinces from the push\n- Lasts 36 hours; the push waits meanwhile\nNeeds Breakthrough axis."
    com.green1052.aiassist.OffensiveTiming:0 "Offensive timing"
    com.green1052.aiassist.OffensiveTiming.desc:0 "A battle plan's offensive starts only once its divisions are ready.\n- Held while: organisation averages under 60 %, over 30 % are still moving up, the enemy holds over 70 % of the air, or most stand in mud\n- Also held: a fortified line ahead not outgunned 2:1, a division in a closing salient, an offensive beaten back in the last 3 days\n- Battle odds: each attack is rated with the game's own combat math; more lost than won holds it\nNeeds Hold the line."
    com.green1052.aiassist.BeachDefense:0 "Beach defence"
    com.green1052.aiassist.BeachDefense.desc:0 "Answers naval landings at once.\n- Free divisions nearby wall in the beachhead and attack into it\n- Beachhead: ground the enemy took from the sea in the last 10 days, or a small enemy pocket on the coast\nVanilla leaves a landing alone until the front collapses."
    com.green1052.aiassist.SupplyAwareAttacks:0 "Supply-aware attacks"
    com.green1052.aiassist.SupplyAwareAttacks.desc:0 "Local attacks skip provinces that couldn't be supplied once taken.\n- Skipped when the attacking province gets too little and no other of ours next to the target has supply to spare\n- Supply only flows through our and allied provinces\n- Still taken: pocket-closing targets and the corridor to a pocket of ours"
    com.green1052.aiassist.SupplyAwareMinPercent:0 "Supply-aware attacks: min supply (%)"
    com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "Supply (% of need) the attacking province must get, or another of ours next to the target must have to spare."
    com.green1052.aiassist.RefitPriority:0 "Front-line refit"
    com.green1052.aiassist.RefitPriority.desc:0 "Reinforcements and new equipment go to front-line divisions first.\n- Front line: in combat or next to enemy-held ground\n- Rear and garrison divisions come after\n- Over 75 % full, a front-line division yields to emptier ones"
    com.green1052.aiassist.BombingTargets:0 "Bombing targets"
    com.green1052.aiassist.BombingTargets.desc:0 "Strategic bombers hit enemy regions next to the land front first.\n- Targets: the factories, supply hubs and airfields feeding the battle\n- Twice the planes for regions next to the front\n- Half the planes and a lower priority for regions far behind it"
    com.green1052.aiassist.AirTraining:0 "Air training"
    com.green1052.aiassist.AirTraining.desc:0 "Green air wings train instead of flying where nothing happens.\n- Green: below the second experience level\n- At peace any wing; at war fighters bound for land regions with no enemy planes\n- Wings with no mission train too; carrier wings never\n- At most half the wings at once; back to their missions once trained\n- A wing isn't flown back to the base it left this week"
    com.green1052.aiassist.ArmyTraining:0 "Army training"
    com.green1052.aiassist.ArmyTraining.desc:0 "Idle AI armies train their divisions up to regular.\n- At peace: any army; at war: armies holding no front (garrisons, reserves)\n- Not while a division fights, stands next to enemy ground or is under 70 % strength\n- Not while the AI expects a war: it digs in instead\nVanilla stops all exercises once a war starts."
    com.green1052.aiassist.BreakOffLosingAttacks:0 "Break off losing attacks"
    com.green1052.aiassist.BreakOffLosingAttacks.desc:0 "A losing AI attack is broken off, and that province isn't attacked again for 3 days.\n- Losing: under 40 % of the battle against 1.5x the defenders, or under 25 %\n- Kept up anyway: closing a pocket, opening the way to a pocket of its own, a feint\n- Divisions another plugin runs (breakouts, pinning attacks, operations) are left alone"
    com.green1052.aiassist.StableLeaders:0 "Stable leaders"
    com.green1052.aiassist.StableLeaders.desc:0 "The AI doesn't take a general or field marshal from a group he commands.\nVanilla swapped leaders between armies every day or two."
    com.green1052.aiassist.NavalTraining:0 "Naval training"
    com.green1052.aiassist.NavalTraining.desc:0 "At peace, idle AI task forces train until their ships are regulars instead of waiting in port.\n- Vanilla stops once world tension passes 50 %\n- None while the AI expects a war: training holds ships at a fifth of their organisation"
    com.green1052.aiassist.ShoreBombardment:0 "Shore bombardment"
    com.green1052.aiassist.ShoreBombardment.desc:0 "At war, AI task forces with guns or carriers hold the sea next to coastal land battles.\n- Taken from patrol, strike force, hold or training (never invasion support, convoys, raiding or mines); one per uncovered battle, within 6 sea provinces\n- Their guns bombard the enemy divisions; carrier wings join the land battle\n- A week at a battle, up to two weeks at sea waiting for the next; split in half when a second battle has none\nVanilla keeps them on its objectives or in port."
    com.green1052.aiassist.ProductionLines:0 "Production lines"
    com.green1052.aiassist.ProductionLines.desc:0 "Keeps factories on production lines that have built up efficiency.\n- Small cuts (up to 1/4) to equipment averaging 35 %+ efficiency are held off\n- The factories come off the smallest increase elsewhere instead\n- Big cuts and full stops go through\nVanilla moves them anyway, and they restart at 10 % efficiency."
    com.green1052.aiassist.StickyDays:0 "Production lines: hold (days)"
    com.green1052.aiassist.StickyDays.desc:0 "Days a small cut to an efficient production line is held off. After that it goes through."
    com.green1052.aiassist.StrategicInvasions:0 "Strategic invasions"
    com.green1052.aiassist.StrategicInvasions.desc:0 "Picks invasion beaches by what is there and covers the route with planes.\n- First: thinly held coast near victory points, capitals, supply hubs, airfields and resources\n- Last: beaches with enemy divisions nearby, forts or coastal bunkers\n- Waits (a week at most) while enemy divisions near the beach outnumber half the landing\n- Twice the fighters over the route (100 at least) and twice the naval bombers"
