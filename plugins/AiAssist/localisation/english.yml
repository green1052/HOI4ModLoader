l_english:
 com.green1052.aiassist.desc:0 "Add-on for Sheep Mod: fixes AI logic its scripts cannot reach (no bonuses). Single player; does nothing without Sheep Mod."
 com.green1052.aiassist.Production:0 "Production rebalancing"
 com.green1052.aiassist.Production.desc:0 "The AI moves factories from equipment it has plenty of to equipment it is short of, instead of stockpiling surpluses. Air and land totals stay as vanilla split them; ships are left alone."
 com.green1052.aiassist.SurplusPercent:0 "Surplus (% above need)"
 com.green1052.aiassist.SurplusPercent.desc:0 "Equipment more than this much (%) above what its army needs counts as surplus."
 com.green1052.aiassist.OffensiveReadiness:0 "Offensive readiness"
 com.green1052.aiassist.OffensiveReadiness.desc:0 "The AI holds an attack while the army's divisions are worn out (average organisation or strength below the settings below), while it is out of supply, or while its country has too few divisions for the line it holds; it starts once they recover. Running attacks are never stopped, and invasions and paradrops are left alone."
 com.green1052.aiassist.MinOrganisation:0 "Attack: average organisation (%)"
 com.green1052.aiassist.MinOrganisation.desc:0 "Average organisation (%) an army needs to start an attack."
 com.green1052.aiassist.MinStrength:0 "Attack: average strength (%)"
 com.green1052.aiassist.MinStrength.desc:0 "Average strength (%: equipment and manpower) an army needs to start an attack."
 com.green1052.aiassist.MinSupply:0 "Attack: average supply (%)"
 com.green1052.aiassist.MinSupply.desc:0 "Average supply (%) an army needs to start an attack (0: not checked; colonial fronts are always short)."
 com.green1052.aiassist.PocketClosing:0 "Pocket closing"
 com.green1052.aiassist.PocketClosing.desc:0 "The AI's local attacks go for provinces that cut off enemy divisions first, when there are any. Vanilla picks at random among the targets that pass its checks."
 com.green1052.aiassist.FrontShortening:0 "Front shortening"
 com.green1052.aiassist.FrontShortening.desc:0 "Otherwise the AI's local attacks prefer provinces whose capture shortens the front over ones that lengthen it."
 com.green1052.aiassist.ArmorTerrain:0 "Armor terrain"
 com.green1052.aiassist.ArmorTerrain.desc:0 "Armored and motorized divisions don't make local attacks into terrain that cripples them (forest, hills, marsh...) or across a river into mountains, marsh, jungle or cities. It reads the divisions' own terrain modifiers, so modded values count."
 com.green1052.aiassist.AirRetreat:0 "Air retreat"
 com.green1052.aiassist.AirRetreat.desc:0 "The AI pulls its planes out of regions where it is losing the air war badly (under 35 % of air superiority, 20+ planes lost in a week, 1.5+ losses per kill) and uses them where it can win. Under 15 % it leaves completely."
 com.green1052.aiassist.Roles:0 "Division roles"
 com.green1052.aiassist.Roles.desc:0 "Line infantry holds the line: provinces with only infantry make local attacks only into empty provinces or pockets; armored and breakthrough divisions do the pushing (not for armies with no such divisions)."
 com.green1052.aiassist.Leaders:0 "Leader assignment"
 com.green1052.aiassist.Leaders.desc:0 "The AI gives its best field marshals and generals to its biggest, fighting, attacking fronts first (vanilla takes them in list order), and counts the traits it ignores: infantry traits for infantry armies, offensive or defensive doctrine for attacking or holding fronts, bad status."
 com.green1052.aiassist.Concentration:0 "Troop concentration"
 com.green1052.aiassist.Concentration.desc:0 "The AI keeps only a thin screen on fronts with no enemy at war (neutral or friendly borders) and sends the rest to fronts facing more enemy divisions than they hold. Borders of a country in a warring country's faction keep their garrison, and fronts at war are never thinned."
 com.green1052.aiassist.TargetValue:0 "Target value"
 com.green1052.aiassist.TargetValue.desc:0 "The AI's local attacks go for valuable provinces first: victory points, capitals, supply hubs, airfields, resources, empty or worn-out defences (after pockets, before front shortening)."
 com.green1052.aiassist.HoldTheLine:0 "Hold the line"
 com.green1052.aiassist.HoldTheLine.desc:0 "At war, the AI keeps a division in every province of a front that borders the enemy (enemy divisions or not); vanilla can ship a whole fighting front away (supply crisis, another front). Its regrouping can't take a province's last defender or the divisions walling in a pocket, free divisions walk back into empty line provinces, and a country short of divisions for its line doesn't start attacks (advancing would widen it and get the spearhead cut off)."
 com.green1052.aiassist.DefensePriority:0 "Defence priority"
 com.green1052.aiassist.DefensePriority.desc:0 "Holes in AI lines are refilled where holding counts first: ports, victory points, river banks, cities and mountains. Key ground is worth walking twice as far for."
 com.green1052.aiassist.BreakthroughAxis:0 "Breakthrough axis"
 com.green1052.aiassist.BreakthroughAxis.desc:0 "The AI's local attacks keep to a breakthrough axis: its front's thinnest enemy sector (few divisions, no forts, open terrain), held for a day so divisions don't zig-zag between sectors."
 com.green1052.aiassist.Reserves:0 "Reserves"
 com.green1052.aiassist.Reserves.desc:0 "A country with divisions to spare keeps reserve posts a province behind its line, on the ground covering the most front; the theatre shuffle leaves those divisions where they are."
 com.green1052.aiassist.BeachDefense:0 "Beach defence"
 com.green1052.aiassist.BeachDefense.desc:0 "Naval landings are answered at once: free divisions next to the beachhead wall it in and attack into it. Vanilla leaves a landing alone until the front collapses."
 com.green1052.aiassist.NavalSortie:0 "Naval engagement"
 com.green1052.aiassist.NavalSortie.desc:0 "AI task forces pick their fights by the strength they see in their region: clearly stronger, they press; half as strong, they slip away; pairs of ships only shadow the enemy. Vanilla gives every mission one fixed level."
 com.green1052.aiassist.NavalEscort:0 "Convoy escort priority"
 com.green1052.aiassist.NavalEscort.desc:0 "While a country is losing convoys fast, its naval fuel budget for convoy defence is doubled for that pass of the task force allocator: more fleets escort, fewer strike."
 com.green1052.aiassist.AirbaseEvacuation:0 "Airbase evacuation"
 com.green1052.aiassist.AirbaseEvacuation.desc:0 "The AI's planes leave airbases the enemy is about to overrun (enemy divisions within two provinces), instead of sitting there until the base falls."
 com.green1052.aiassist.CasConcentration:0 "CAS concentration"
 com.green1052.aiassist.CasConcentration.desc:0 "The AI's close air support backs its breakthrough axis first: battles on the axis get the planes before ones elsewhere in the region. Vanilla goes by province list order."
 com.green1052.aiassist.Entrenchment:0 "Dug-in defenders"
 com.green1052.aiassist.Entrenchment.desc:0 "The AI's local attacks count the defenders' dig-in: a province held by entrenched divisions (60 %+ of their dig-in) is a worse target than its garrison numbers alone say."
 com.green1052.aiassist.Stationing:0 "Stationing"
 com.green1052.aiassist.Stationing.desc:0 "A division the theatre shuffle just walked to a new front stays there for a week; vanilla re-shuffles freshly arrived divisions back and forth (ping-pong)."
