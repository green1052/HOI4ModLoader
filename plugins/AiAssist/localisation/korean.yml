l_korean:
    com.green1052.aiassist.name:0 "AI 보조"
    com.green1052.aiassist.desc:0 "디스코드 모드(Sheep Mod) 애드온입니다. 스크립트로는 닿지 않는 AI 판단 로직을 고칩니다(버프 없음). 싱글 플레이 전용이고, Sheep Mod가 없으면 아무것도 하지 않습니다."
    com.green1052.aiassist.ArmorTerrain:0 "기갑 지형 판단"
    com.green1052.aiassist.ArmorTerrain.desc:0 "기갑·기계화 사단이 공격력이 크게 깎이는 지형(숲, 언덕, 늪 등)으로 국지 공격하지 않고, 강 건너 산·늪·정글·도시도 치지 않습니다. 사단 데이터의 지형 보정을 그대로 쓰므로 모드의 수치도 반영됩니다."
    com.green1052.aiassist.AirRetreat:0 "공군 손실 회피"
    com.green1052.aiassist.AirRetreat.desc:0 "제공권에서 크게 지고(점유 35% 미만, 일주일 손실 20기 이상, 격추 1기당 1.5기 이상 손실) 있는 지역에서 AI가 공군을 빼고, 이길 수 있는 지역에 씁니다. 점유가 15% 미만이면 완전히 철수합니다."
    com.green1052.aiassist.HoldTheLine:0 "전선 유지"
    com.green1052.aiassist.HoldTheLine.desc:0 "전쟁 중에 교전국과 맞닿은 우리 프로빈스마다 사단 하나는 남깁니다(적 사단이 없어도). 바닐라는 보급 위기나 다른 전선 때문에 싸우는 전선의 사단을 통째로 실어 가기도 합니다. 재편·재배치는 적 땅과 맞닿은 프로빈스의 마지막 수비자(적 사단이 없어도), 포위벽을 이룬 사단, 예비대, 도착한 지 일주일이 안 된 사단을 가져가지 못합니다(바닐라는 갓 도착한 사단을 다시 보내 왕복만 시킵니다). 빈 전선 프로빈스는 근처의 쉬는 사단으로 채우는데, 항구·승점·강 건너 지대·도시와 산악부터 채우고 이런 요지는 더 멀리서도 데려옵니다. 같은 전선의 사단을 먼저 쓰고, 다른 전선에서 데려온 사단은 그 자리에 붙잡아 둡니다. 사단에 여유가 있는 나라는 전선 한 칸 뒤에 예비대를 두고 요지 뒤에는 2선 사단을 하나 더 둡니다. 준비된 예비대는 근처로 뚫고 들어온 적(우리 땅 안의 적 부대, 이틀 안에 빼앗긴 땅, 상륙)에 반격한 뒤 제자리로 돌아갑니다. 전선을 지킬 사단이 모자란 나라는 공격을 시작하지 않고 얇은 전선에서 진행 중인 공세도 멈춥니다(진격하면 전선이 넓어져 선봉이 포위됩니다). 그곳에서 적보다 두 배 강하면 예외입니다. 같은 프로빈스에 다른 사단이 남아 있으면, 싸우다 지친 사단은 몇 칸 뒤로 빠져 쉬고(주변 사단의 4분의 1까지), 퇴로가 좁아지는데 적이 우리만큼 강한 돌출부의 사단은 포위되기 전에 빠져나옵니다. 적보다 두 배 강한 곳에서는 둘 다 하지 않습니다. 회복한 사단은 원래 명령으로 돌아가고, 전선이 멀어진 예비대도 그렇습니다(바닐라는 먼 전선으로 보냈다가 다시 데려옵니다). 새로 배치된 사단은 가장 급한 곳부터 갑니다. 방어선(방어 태세)의 빈 곳, 없으면 전선의 빈 프로빈스, 그다음 가장 얇은 전선에서 수비가 가장 적은 프로빈스 순입니다. 바닐라의 전역 배분은 요청이 가리키는 곳 어디로든 보냅니다. 가는 동안에는 건드리지 않습니다."
    com.green1052.aiassist.DefensivePostures:0 "방어 태세"
    com.green1052.aiassist.DefensivePostures.desc:0 "훨씬 강한 적(전선에서 우리 몫보다 두 배, 또는 지난 일주일 동안 전선 프로빈스를 잃었거나 사단이 모자랄 때 1.3배)을 마주한 AI 국가는 노출된 땅을 내주고 그라드를 지킵니다. 그라드는 그 적과 수도 사이에서 가장 방어하기 좋은 짧은 전선입니다(앞에 강·산악·습지·숲·언덕·도시·요새가 있고 공격받는 방향이 적은 곳). 일주일마다 다시 긋고, 적이 뚫고 들어오면 한 줄 뒤로 물러납니다. 사단은 그곳으로 걸어가 머물고(승점 도시는 하나 더), 새 공세나 공수 강하는 하지 않으며(상륙은 그대로), 전선 바로 앞에서 지쳐 버린 적 스택만 쌩쌩한 사단 둘 이상으로(그라드 뒤의 예비대도 함께) 반격합니다. 이때 그 스택을 도우러 올 수 있는 이웃 적 스택은 사단 하나씩으로 묶어 두고, 조직력이 떨어진 공격 사단은 공격을 멈춥니다. 물러나게 만든 적이 모두 일주일 내내 우리 힘의 80 % 아래에 머물면(물러난 지 한 달이 지난 뒤부터) 사단은 원래 명령으로 돌아가고, 그 뒤 한 달 동안은 적이 두 배 강해야 다시 그라드로 물러납니다. 적과 떨어져 있는 동안에는 태세를 그대로 둡니다. 전선 유지가 켜져 있어야 합니다."
    com.green1052.aiassist.BreakthroughAxis:0 "돌파축 일관성"
    com.green1052.aiassist.BreakthroughAxis.desc:0 "AI의 국지 공격이 돌파축을 따라가게 합니다. AI의 기갑 돌격(게임의 병력 집중)이 공격 중이면 그 진격로가 적 전선을 넘는 곳이 축이 되고, 선두가 나아가면 축도 함께 옮겨 갑니다. 그렇지 않으면 전선에서 가장 얇은 적 구역(사단 적고 요새 없고 지형 개방적)을 사흘 동안 축으로 정하고 점령한 뒤에야 다음으로 옮겨, 사단이 좌우로 흩어지지 않게 그 주변 목표만 칩니다. 축 밖에서는 축 옆의 적 사단을 묶어 두는 공격만, 이길 만할 때 합니다. 공격받는 사단은 후퇴 말고는 움직일 수 없어서 돌파 지점으로 옮겨 가지 못합니다. 근접항공지원도 축 위의 전투부터 지원합니다(바닐라는 프로빈스 목록 순서대로 나눕니다)."
    com.green1052.aiassist.Encirclement:0 "포위 섬멸"
    com.green1052.aiassist.Encirclement.desc:0 "돌파 축이 적 돌출부를 먼저 노립니다. 적 땅이 프로빈스 한두 개 너비의 목을 통해 아군 전선 안으로 튀어나와 있고, 그 목을 점령하면 적 사단 3개 이상이 고립되며 그만한 값어치가 있으면, 양쪽 측면의 국지 공격과 근접 항공 지원이 돌출부를 정면으로 밀지 않고 목으로 향합니다. 포위가 닫히거나 최대 일주일까지 유지합니다. 돌파 축이 필요합니다."
    com.green1052.aiassist.RailwayGuns:0 "열차포"
    com.green1052.aiassist.RailwayGuns.desc:0 "AI의 열차포가 돌파 축의 군에 먼저 배정되고 그대로 남습니다. 그 군이 가장 먼저 배정받고, 다른 군이 열차포를 빼앗아 가지 못합니다. 바닐라는 위치와 상관없이 가장 큰 군에 줍니다. 돌파 축이 필요합니다."
    com.green1052.aiassist.SupplyHubs:0 "보급 허브"
    com.green1052.aiassist.SupplyHubs.desc:0 "AI 국가의 사단이 보급 부족이면 그 사단에 보급을 대는 보급 허브에서 수도까지 가는 철도를 한 단계 올립니다(일주일에 한 번, 같은 허브는 60일 뒤에 다시). 철도 한 단계는 허브보다 훨씬 쌉니다. 1941년부터는 민간 공장이 60개 이상인 AI 국가의 사단이 보급 부족인데 3 프로빈스 안에 보급 허브가 없으면 그곳에 허브도 새로 짓습니다(철도가 이어진 프로빈스 먼저). 매주 확인하며 한 달에 최대 두 개까지입니다. 허브는 20000이나 들어서 그 전이나 공장이 적으면 짓지 않습니다. 바닐라 AI는 있는 허브의 철도를 개량하고 연결만 합니다."
    com.green1052.aiassist.GroundCrews:0 "지상 근무단"
    com.green1052.aiassist.GroundCrews.desc:0 "AI가 더 많은 지상 근무단(지휘력 20으로 한 지역의 항공 효율 +10%, 끄면 지휘력을 돌려받음)을 씁니다. 이틀마다, 최근 사흘 동안 자기 항공단이 가장 치열하게 싸운 지역(적 항공기가 활동하는 곳에서 잃고 격추한 항공기 10대 이상)에서 최대 두 곳까지, 비용을 내고도 지휘력이 50 이상 남을 때 켭니다. 일주일 동안 싸움이 없던 지역은 끄고, 지휘력이 50 아래면 한 번에 한 곳씩 끕니다. 바닐라 AI는 이것을 켜지 않습니다."
    com.green1052.aiassist.AttackTargets:0 "공격 목표 선정"
    com.green1052.aiassist.AttackTargets.desc:0 "AI의 국지 공격이 조건을 통과한 목표 중에서 무작위로 고르지 않고 목표를 가려서 칩니다. 적 사단을 고립시킬 수 있는 프로빈스가 먼저이고, 그다음은 가치 높은 프로빈스(승점, 수도, 보급 허브, 공항, 자원, 비었거나 지친 수비대. 참호를 60% 이상 판 수비군은 감점), 마지막으로 전선을 늘리는 곳보다 줄이는 곳을 고릅니다. 아군 사단이 포위되어 있으면 포위망 옆의 사단은 포위망과 아군 전선 사이를 잇는 적 프로빈스부터 쳐서 통로를 엽니다(포위망 안에서 뚫고 나오는 공격도 같습니다). 갇힌 아군 사단이 그 공격으로 고립시킬 적 사단보다 적지 않으면 포위보다 이쪽이 먼저입니다. 바닐라에는 구출이나 탈출 로직이 없습니다. 전선 옆의 빈 적 프로빈스에는 기운이 남은 사단이 들어가 점령합니다(원래 자리에는 한 사단이 남습니다). 바닐라 국지 공격은 이런 빈 프로빈스를 자주 지나칩니다."
    com.green1052.aiassist.BeachDefense:0 "해안 상륙 대응"
    com.green1052.aiassist.BeachDefense.desc:0 "해안 상륙에 즉시 대응합니다: 상륙장 근처의 쉬는 사단이 교두보를 둘러싸 막고 안으로 공격해 들어갑니다. 교두보는 적이 열흘 안에 바다에서 빼앗은 땅(적의 해안 바로 옆이어도)이나 해안의 작은 적 고립 지대입니다. 바닐라는 전선이 무너질 때까지 상륙을 방치합니다."
    com.green1052.aiassist.SupplyAwareAttacks:0 "보급 고려 공격"
    com.green1052.aiassist.SupplyAwareAttacks.desc:0 "점령해도 사단에 보급이 닿지 않을 프로빈스는 AI가 국지 공격 대상에서 뺍니다. 보급은 아군과 동맹의 프로빈스로만 흐르는데, 공격하는 프로빈스가 받는 보급이 모자라고 목표와 맞닿은 다른 아군 프로빈스에도 남는 보급이 없으면 공격하지 않습니다. 포위를 완성하는 목표와 포위된 아군에게 가는 통로는 예외입니다. 바닐라는 국지 공격 대상을 고를 때 보급을 보지 않습니다."
    com.green1052.aiassist.SupplyAwareMinPercent:0 "보급 고려 공격: 보급(%)"
    com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "국지 공격을 하려면 공격하는 프로빈스가 필요한 보급의 이만큼(%)을 받거나, 목표와 맞닿은 다른 아군 프로빈스에 그만큼 보급이 남아야 합니다."
    com.green1052.aiassist.RefitPriority:0 "전선 우선 보충"
    com.green1052.aiassist.RefitPriority.desc:0 "AI의 보충과 신형 장비가 후방·수비대 사단보다 전선 사단(교전 중이거나 적이 점령한 땅에 맞닿은 사단)에 먼저 갑니다. 바닐라는 템플릿과 전구 우선순위만 봅니다. 75% 넘게 채워진 전선 사단은 빈 사단에 양보합니다."
    com.green1052.aiassist.BombingTargets:0 "전략 폭격 목표"
    com.green1052.aiassist.BombingTargets.desc:0 "AI의 전략 폭격기가 지상 전선 바로 뒤의 적 지역(전투를 떠받치는 공장, 보급 허브, 공항)부터 폭격합니다. 전선에 맞닿은 지역에는 폭격기를 두 배로 요청하고, 전선에서 먼 지역은 폭격기를 절반만 요청하고 우선순위도 낮춥니다. 바닐라는 전선과의 거리는 보지 않고 지역 안에 무엇이 있는지만 봅니다."
    com.green1052.aiassist.ProductionLines:0 "생산 라인 유지"
    com.green1052.aiassist.ProductionLines.desc:0 "AI가 효율이 오른 생산 라인의 공장을 지킵니다. 라인 평균 효율이 35% 이상인 장비에서 공장을 조금(4분의 1 이하) 빼는 변경은 한동안 미루고, 그만큼은 다른 장비 중 가장 적게 늘어나는 쪽에서 덜어 냅니다. 바닐라는 효율과 상관없이 마지막 라인부터 공장을 빼서 다른 장비로 옮기고, 옮긴 공장은 효율 10%부터 다시 시작합니다. 크게 줄이거나 생산을 아예 멈추는 변경은 그대로 진행합니다."
    com.green1052.aiassist.StickyDays:0 "생산 라인 유지: 기간(일)"
    com.green1052.aiassist.StickyDays.desc:0 "효율 높은 라인에서 공장을 조금 빼는 변경을 미루는 기간입니다. 그 뒤에도 AI가 원하면 그대로 진행합니다."
    com.green1052.aiassist.StrategicInvasions:0 "전략 상륙"
    com.green1052.aiassist.StrategicInvasions.desc:0 "AI가 상륙할 해안을 그곳 사정을 보고 고릅니다. 승점·수도·보급 허브·공항·자원 가까이에 있으면서 수비가 얇은 해안을 먼저 고르고, 근처에 적 사단이 있거나 육상 요새·해안 벙커가 있는 해안은 뒤로 미룹니다. 바닐라는 거리와 항구, 지역 우선순위만 봅니다. 계획한 상륙도 해안 주변의 적 사단이 상륙 병력의 절반을 넘는 동안은 기다립니다(최대 일주일). 계획한 상륙의 항로에 있는 해역에는 전투기를 붙입니다. 공군 AI가 그곳에 원하는 수의 두 배(최소 100대)이고, 적 함선이 있는 곳에는 대함 폭격기도 두 배로 보냅니다. 바닐라 공군 AI는 항로를 보지 않습니다(해군은 상륙선이 출발하기 전에 그 해역들을 장악해야 합니다)."
    com.green1052.aiassist.StrategicParadrops:0 "전략 공수 강하"
    com.green1052.aiassist.StrategicParadrops.desc:0 "AI가 공수부대를 씁니다(돌파축 일관성 필요). 돌파축이 있는 전구에 속한 군의 공수 가능 사단을 최대 4개까지, 이들을 실어 나를 수 있는 공항 중 축에서 가장 가까운 곳에서 띄워 축 근처 적 전선 뒤의 빈 프로빈스에 내립니다(승점, 보급 허브, 공항, 포위를 완성하는 곳이 먼저). 바닐라가 강하를 허락할 때만 뜹니다: 준비가 끝나고, 수송기가 넉넉하고, 경로의 제공권을 쥐었을 때입니다. 그동안 다른 AI 로직은 이 사단들을 건드리지 않고, 2주 안에 뜨지 못하면 포기합니다. 바닐라 AI는 공수 강하를 하지 않습니다. Sheep Mod의 AI는 공수부대와 수송기를 만들지 않아 강하가 드뭅니다. 어느 조건에서 막혔는지는 로그에 남습니다."
