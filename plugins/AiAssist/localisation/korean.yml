l_korean:
 com.green1052.aiassist.name:0 "AI 보조"
 com.green1052.aiassist.desc:0 "디스코드 모드(Sheep Mod) 애드온입니다. 스크립트로는 닿지 않는 AI 판단 로직을 고칩니다(버프 없음). 싱글 플레이 전용이고, Sheep Mod가 없으면 아무것도 하지 않습니다."
 com.green1052.aiassist.Production:0 "생산 재배분"
 com.green1052.aiassist.Production.desc:0 "AI가 남아도는 장비의 공장 절반(군에서 아무도 쓰지 않는 장비는 전부)을 모자란 장비로 옮깁니다. 바닐라 AI는 재고 버퍼 때문에 잉여 장비를 계속 생산합니다. 항공·지상 공장 총수는 바닐라 배분 그대로 두고, 함선은 건드리지 않습니다."
 com.green1052.aiassist.SurplusPercent:0 "잉여 기준(%)"
 com.green1052.aiassist.SurplusPercent.desc:0 "장비가 군 필요량보다 이 비율 이상 많으면 잉여로 봅니다."
 com.green1052.aiassist.OffensiveReadiness:0 "공세 준비도"
 com.green1052.aiassist.OffensiveReadiness.desc:0 "야전군의 사단들이 지쳐 있으면(아래 평균 조직력·강도 미만) AI가 공격 개시를 미룹니다. 매시간 다시 판단하므로 회복되면 바로 공격합니다. 진행 중인 공격은 멈추지 않고, 상륙·공수 작전은 건드리지 않습니다."
 com.green1052.aiassist.MinOrganisation:0 "공격 기준: 평균 조직력(%)"
 com.green1052.aiassist.MinOrganisation.desc:0 "야전군 사단의 평균 조직력이 이 이상이어야 공격을 시작합니다."
 com.green1052.aiassist.MinStrength:0 "공격 기준: 평균 강도(%)"
 com.green1052.aiassist.MinStrength.desc:0 "야전군 사단의 평균 강도(장비·인력)가 이 이상이어야 공격을 시작합니다."
 com.green1052.aiassist.PocketClosing:0 "포위 우선 공격"
 com.green1052.aiassist.PocketClosing.desc:0 "AI의 국지 공격이 적 사단을 고립시킬 수 있는 프로빈스가 있으면 그곳부터 노립니다. 바닐라는 조건을 통과한 목표 중 무작위로 고릅니다."
 com.green1052.aiassist.MinSupply:0 "공격 기준: 평균 보급(%)"
 com.green1052.aiassist.MinSupply.desc:0 "야전군 사단의 평균 보급률이 이 이상이어야 공격을 시작합니다. 0이면 보급은 보지 않습니다(식민지 전선은 늘 보급이 모자람)."
 com.green1052.aiassist.FrontShortening:0 "전선 단축 공격"
 com.green1052.aiassist.FrontShortening.desc:0 "포위할 목표가 없으면, AI의 국지 공격이 전선을 늘리는 목표 대신 전선을 줄이는 목표를 고릅니다."
 com.green1052.aiassist.ArmorTerrain:0 "기갑 지형 판단"
 com.green1052.aiassist.ArmorTerrain.desc:0 "기갑·기계화 사단이 공격력이 크게 깎이는 지형(숲, 언덕, 늪 등)으로 국지 공격하지 않고, 강 건너 산·늪·정글·도시도 치지 않습니다. 사단 데이터의 지형 보정을 그대로 쓰므로 모드의 수치도 반영됩니다."
 com.green1052.aiassist.AirRetreat:0 "공군 손실 회피"
 com.green1052.aiassist.AirRetreat.desc:0 "제공권에서 크게 지고(점유 35% 미만, 일주일 손실 20기 이상, 격추 1기당 1.5기 이상 손실) 있는 지역에서 AI가 공군을 빼고, 이길 수 있는 지역에 씁니다. 점유가 15% 미만이면 완전히 철수합니다."
 com.green1052.aiassist.Roles.desc:0 "전선 보병은 전선을 지키고 돌파 사단(기갑, 돌파력이 방어력보다 높은 사단)이 공세를 맡습니다. 보병만 있는 프로빈스는 빈 적 프로빈스나 포위된 적에게만 국지 공격합니다. 돌파 사단이 없는 나라에는 적용하지 않습니다."
 com.green1052.aiassist.Roles:0 "사단 역할 운용"
 com.green1052.aiassist.Leaders:0 "지휘관 배치"
 com.green1052.aiassist.Leaders.desc:0 "AI가 가장 크고 교전 중이며 공세 중인 전선부터 좋은 원수·장군을 고르게 합니다(바닐라는 전선 목록 순서대로 고름). 바닐라가 무시하는 특성도 반영합니다: 보병 위주 군에 보병 특성, 공세·수비 전선에 원수의 공세·수비 교리, 병·부상 같은 나쁜 상태."
 com.green1052.aiassist.Concentration:0 "병력 집중"
 com.green1052.aiassist.Concentration.desc:0 "AI가 교전국이 없는 전선(중립국·동맹국 국경)에는 최소 병력만 남기고, 적 사단이 요구량보다 많은 전선에 병력을 더 붙입니다. 전쟁 중인 국가의 세력에 속한 국가와 맞닿은 국경은 바닐라 배치를 그대로 유지하고(언제 전쟁으로 번질지 모르는 국경), 교전 중인 전선도 절대 줄이지 않습니다."
 com.green1052.aiassist.TargetValue:0 "공세 목표 선정"
 com.green1052.aiassist.TargetValue.desc:0 "AI의 국지 공격이 가치 높은 프로빈스부터 노립니다: 승점, 수도, 보급 허브, 공항, 자원, 비었거나 지친 수비대(요새화된 다수 병력은 감점). 포위 목표 다음, 전선 단축보다 먼저 봅니다."
 com.green1052.aiassist.HoldTheLine:0 "전선 유지"
 com.green1052.aiassist.HoldTheLine.desc:0 "전쟁 중에 교전국과 맞닿은 우리 프로빈스마다 사단 하나는 남깁니다(적 사단이 없어도). 바닐라는 보급 위기나 다른 전선 때문에 싸우는 전선의 사단을 통째로 실어 가서 전선을 비우기도 합니다. 재편·재배치가 프로빈스의 마지막 수비자나 포위벽의 사단을 가져가지 못하게 막고, 빈 전선 프로빈스에는 근처의 쉬는 사단을 보내 채우며, 전선을 지킬 사단이 모자란 나라는 공격을 시작하지 않습니다(진격이 전선을 넓혀 포위당하는 일을 막습니다)."
 com.green1052.aiassist.DefensePriority:0 "방어 우선순위"
 com.green1052.aiassist.DefensePriority.desc:0 "전선에 생긴 구멍을 채울 때 지켜야 할 곳부터 메웁니다: 항구, 승점, 강 건너 지대, 도시와 산악. 중요 거점은 두 배 멀리까지 걸어가서 채웁니다."
 com.green1052.aiassist.BreakthroughAxis:0 "돌파축 일관성"
 com.green1052.aiassist.BreakthroughAxis.desc:0 "AI의 국지 공격이 정한 돌파축을 따라가게 합니다: 전선에서 가장 얇은 적 구역(사단 적고 요새 없고 지형 개방적)을 하루 동안 축으로 정하고, 사단이 좌우로 흩어지지 않게 그 주변 목표만 칩니다."
 com.green1052.aiassist.Reserves:0 "예비대 운용"
 com.green1052.aiassist.Reserves.desc:0 "사단에 여유가 있는 나라는 전선 한 칸 뒤에 예비 거점을 둡니다. 가장 많은 전선을 커버하는 자리부터 채우고, 그 사단은 전선 재편 대상에서 빠져 자리를 지킵니다."
 com.green1052.aiassist.BeachDefense:0 "해안 상륙 대응"
 com.green1052.aiassist.BeachDefense.desc:0 "해안 상륙에 즉시 대응합니다: 상륙장 옆의 쉬는 사단이 교두보를 둘러싸 막고 안으로 공격해 들어갑니다. 바닐라는 전선이 무너질 때까지 상륙을 방치합니다."
 com.green1052.aiassist.NavalSortie:0 "해상 교전 판단"
 com.green1052.aiassist.NavalSortie.desc:0 "AI 함대가 해역에서 보이는 적 전력에 맞춰 교전 수위를 정합니다: 확실히 강하면 맞서고, 절반 이하면 피하며, 2척 이하 소함대는 적을 추적만 합니다. 바닐라는 미션 종류마다 고정 수준을 씁니다."
 com.green1052.aiassist.NavalEscort:0 "호송 방어 우선"
 com.green1052.aiassist.NavalEscort.desc:0 "호송선이 빠르게 격침되는 동안 해군 연료 예산의 호송 방어 몫을 그 할당 차례에 한해 두 배로 늘려, 더 많은 함대가 호송을 맡게 합니다."
 com.green1052.aiassist.AirbaseEvacuation:0 "공군기지 철수"
 com.green1052.aiassist.AirbaseEvacuation.desc:0 "적이 곧 점령할 공군기지(2프로빈스 이내에 적 사단)에서 AI가 항공기를 뺍니다. 바닐라는 기지가 함락될 때까지 항공기를 방치합니다."
 com.green1052.aiassist.CasConcentration:0 "근접항공지원 집중"
 com.green1052.aiassist.CasConcentration.desc:0 "AI의 근접항공지원이 당일 돌파축부터 지원합니다: 축 위의 전투에 먼저 항공기가 배분됩니다. 바닐라는 프로빈스 목록 순서대로 나눕니다."
 com.green1052.aiassist.Entrenchment:0 "참호 고려"
 com.green1052.aiassist.Entrenchment.desc:0 "AI의 국지 공격이 수비군의 참호를 봅니다: 참호를 60% 이상 완성한 수비군이 지키는 프로빈스는 병력 수만 보았을 때보다 나쁜 목표로 쳐서 피해갑니다."
 com.green1052.aiassist.Stationing:0 "배치 안정화"
 com.green1052.aiassist.Stationing.desc:0 "전선 재편으로 갓 도착한 사단은 일주일 동안 자리를 지킵니다. 바닐라는 갓 도착한 사단을 다시 다른 전선으로 보내 왕복만 시킵니다(핑퐁)."
 com.green1052.aiassist.SupplyAwareAttacks:0 "보급 고려 공격"
 com.green1052.aiassist.SupplyAwareAttacks.desc:0 "점령해도 사단에 보급이 닿지 않을 프로빈스는 AI가 국지 공격 대상에서 뺍니다. 보급은 아군과 동맹의 프로빈스로만 흐르는데, 공격하는 프로빈스가 받는 보급이 모자라고 목표와 맞닿은 다른 아군 프로빈스에도 남는 보급이 없으면 공격하지 않습니다. 포위를 완성하는 목표는 예외입니다. 바닐라는 국지 공격 대상을 고를 때 보급을 보지 않습니다."
 com.green1052.aiassist.SupplyAwareMinPercent:0 "보급 고려 공격: 보급(%)"
 com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "국지 공격을 하려면 공격하는 프로빈스가 필요한 보급의 이만큼(%)을 받거나, 목표와 맞닿은 다른 아군 프로빈스에 그만큼 보급이 남아야 합니다."
 com.green1052.aiassist.RefitPriority:0 "전선 우선 보충"
 com.green1052.aiassist.RefitPriority.desc:0 "AI의 보충과 신형 장비가 후방·수비대 사단보다 전선 사단(교전 중이거나 적이 점령한 땅에 맞닿은 사단)에 먼저 갑니다. 바닐라는 템플릿과 전구 우선순위만 봅니다. 75% 넘게 채워진 전선 사단은 빈 사단에 양보합니다."
