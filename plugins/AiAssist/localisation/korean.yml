l_korean:
 com.green1052.aiassist.name:0 "AI 보조"
 com.green1052.aiassist.desc:0 "디스코드 모드(Sheep Mod) 애드온입니다. 스크립트로는 닿지 않는 AI 판단 로직을 고칩니다(버프 없음). 싱글 플레이 전용이고, Sheep Mod가 없으면 아무것도 하지 않습니다."
 com.green1052.aiassist.ArmorTerrain:0 "기갑 지형 판단"
 com.green1052.aiassist.ArmorTerrain.desc:0 "기갑·기계화 사단이 공격력이 크게 깎이는 지형(숲, 언덕, 늪 등)으로 국지 공격하지 않고, 강 건너 산·늪·정글·도시도 치지 않습니다. 사단 데이터의 지형 보정을 그대로 쓰므로 모드의 수치도 반영됩니다."
 com.green1052.aiassist.AirRetreat:0 "공군 손실 회피"
 com.green1052.aiassist.AirRetreat.desc:0 "제공권에서 크게 지고(점유 35% 미만, 일주일 손실 20기 이상, 격추 1기당 1.5기 이상 손실) 있는 지역에서 AI가 공군을 빼고, 이길 수 있는 지역에 씁니다. 점유가 15% 미만이면 완전히 철수합니다."
 com.green1052.aiassist.HoldTheLine:0 "전선 유지"
 com.green1052.aiassist.HoldTheLine.desc:0 "전쟁 중에 교전국과 맞닿은 우리 프로빈스마다 사단 하나는 남깁니다(적 사단이 없어도). 바닐라는 보급 위기나 다른 전선 때문에 싸우는 전선의 사단을 통째로 실어 가기도 합니다. 재편·재배치는 프로빈스의 마지막 수비자, 포위벽을 이룬 사단, 예비대, 도착한 지 일주일이 안 된 사단을 가져가지 못합니다(바닐라는 갓 도착한 사단을 다시 보내 왕복만 시킵니다). 빈 전선 프로빈스는 근처의 쉬는 사단으로 채우는데, 항구·승점·강 건너 지대·도시와 산악부터 채우고 이런 요지는 두 배 멀리서도 데려옵니다. 사단에 여유가 있는 나라는 전선 한 칸 뒤에 예비대를 두고, 전선을 지킬 사단이 모자란 나라는 공격을 시작하지 않습니다(진격하면 전선이 넓어져 선봉이 포위됩니다). 적과 맞닿아 지친 사단은 같은 프로빈스에 다른 사단이 남아 있으면 몇 칸 뒤로 빠져 쉬고, 퇴로가 좁아지는 돌출부의 사단은 포위되기 전에 빠져나옵니다. 둘 다 회복하면 다시 전선에 들어갑니다. 진행 중인 공격은 멈추지 않습니다."
 com.green1052.aiassist.BreakthroughAxis:0 "돌파축 일관성"
 com.green1052.aiassist.BreakthroughAxis.desc:0 "AI의 국지 공격이 정한 돌파축을 따라가게 합니다: 전선에서 가장 얇은 적 구역(사단 적고 요새 없고 지형 개방적)을 하루 동안 축으로 정하고, 사단이 좌우로 흩어지지 않게 그 주변 목표만 칩니다. 근접항공지원도 축 위의 전투부터 지원합니다(바닐라는 프로빈스 목록 순서대로 나눕니다)."
 com.green1052.aiassist.AttackTargets:0 "공격 목표 선정"
 com.green1052.aiassist.AttackTargets.desc:0 "AI의 국지 공격이 조건을 통과한 목표 중에서 무작위로 고르지 않고 목표를 가려서 칩니다. 적 사단을 고립시킬 수 있는 프로빈스가 먼저이고, 그다음은 가치 높은 프로빈스(승점, 수도, 보급 허브, 공항, 자원, 비었거나 지친 수비대. 참호를 60% 이상 판 수비군은 감점), 마지막으로 전선을 늘리는 곳보다 줄이는 곳을 고릅니다. 아군 사단이 포위되어 있으면 포위망 옆의 사단은 포위망과 아군 전선 사이를 잇는 적 프로빈스부터 쳐서 통로를 엽니다(포위망 안에서 뚫고 나오는 공격도 같습니다). 갇힌 아군 사단이 그 공격으로 고립시킬 적 사단보다 적지 않으면 포위보다 이쪽이 먼저입니다. 바닐라에는 구출이나 탈출 로직이 없습니다. 전선 옆의 빈 적 프로빈스에는 기운이 남은 사단이 들어가 점령합니다(원래 자리에는 한 사단이 남습니다). 바닐라 국지 공격은 이런 빈 프로빈스를 자주 지나칩니다."
 com.green1052.aiassist.BeachDefense:0 "해안 상륙 대응"
 com.green1052.aiassist.BeachDefense.desc:0 "해안 상륙에 즉시 대응합니다: 상륙장 옆의 쉬는 사단이 교두보를 둘러싸 막고 안으로 공격해 들어갑니다. 바닐라는 전선이 무너질 때까지 상륙을 방치합니다."
 com.green1052.aiassist.SupplyAwareAttacks:0 "보급 고려 공격"
 com.green1052.aiassist.SupplyAwareAttacks.desc:0 "점령해도 사단에 보급이 닿지 않을 프로빈스는 AI가 국지 공격 대상에서 뺍니다. 보급은 아군과 동맹의 프로빈스로만 흐르는데, 공격하는 프로빈스가 받는 보급이 모자라고 목표와 맞닿은 다른 아군 프로빈스에도 남는 보급이 없으면 공격하지 않습니다. 포위를 완성하는 목표와 포위된 아군에게 가는 통로는 예외입니다. 바닐라는 국지 공격 대상을 고를 때 보급을 보지 않습니다."
 com.green1052.aiassist.SupplyAwareMinPercent:0 "보급 고려 공격: 보급(%)"
 com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "국지 공격을 하려면 공격하는 프로빈스가 필요한 보급의 이만큼(%)을 받거나, 목표와 맞닿은 다른 아군 프로빈스에 그만큼 보급이 남아야 합니다."
 com.green1052.aiassist.RefitPriority:0 "전선 우선 보충"
 com.green1052.aiassist.RefitPriority.desc:0 "AI의 보충과 신형 장비가 후방·수비대 사단보다 전선 사단(교전 중이거나 적이 점령한 땅에 맞닿은 사단)에 먼저 갑니다. 바닐라는 템플릿과 전구 우선순위만 봅니다. 75% 넘게 채워진 전선 사단은 빈 사단에 양보합니다."
 com.green1052.aiassist.BombingTargets:0 "전략 폭격 목표"
 com.green1052.aiassist.BombingTargets.desc:0 "AI의 전략 폭격기가 지상 전선 바로 뒤의 적 지역(전투를 떠받치는 공장, 보급 허브, 공항)부터 폭격합니다. 전선에 맞닿은 지역에는 폭격기를 두 배로 요청하고, 전선에서 먼 지역은 폭격기를 절반만 요청하고 우선순위도 낮춥니다. 바닐라는 전선과의 거리는 보지 않고 지역 안에 무엇이 있는지만 봅니다."
 com.green1052.aiassist.ProductionLines:0 "생산 라인 유지"
 com.green1052.aiassist.ProductionLines.desc:0 "AI가 효율이 오른 생산 라인의 공장을 지킵니다. 라인 평균 효율이 35% 이상인 장비에서 공장을 조금(4분의 1 이하) 빼는 변경은 한동안 미루고, 그만큼은 다른 장비 중 가장 적게 늘어나는 쪽에서 덜어 냅니다. 바닐라는 효율과 상관없이 마지막 라인부터 공장을 빼서 다른 장비로 옮기고, 옮긴 공장은 효율 10%부터 다시 시작합니다. 크게 줄이거나 생산을 아예 멈추는 변경은 그대로 진행합니다."
 com.green1052.aiassist.StickyDays:0 "생산 라인 유지: 기간(일)"
 com.green1052.aiassist.StickyDays.desc:0 "효율 높은 라인에서 공장을 조금 빼는 변경을 미루는 기간입니다. 그 뒤에도 AI가 원하면 그대로 진행합니다."
