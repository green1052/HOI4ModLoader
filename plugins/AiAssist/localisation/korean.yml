l_korean:
 com.green1052.aiassist.name:0 "AI 보조"
 com.green1052.aiassist.desc:0 "디스코드 모드(Sheep Mod) 애드온입니다. 스크립트로는 닿지 않는 AI 판단 로직을 고칩니다(버프 없음). 싱글 플레이 전용이고, Sheep Mod가 없으면 아무것도 하지 않습니다."
 com.green1052.aiassist.Production:0 "생산 재배분"
 com.green1052.aiassist.Production.desc:0 "AI가 남아도는 장비의 공장 절반(군에서 아무도 쓰지 않는 장비는 전부)을 모자란 장비로 옮깁니다. 바닐라 AI는 재고 버퍼 때문에 잉여 장비를 계속 생산합니다. 항공·지상 공장 총수는 바닐라 배분 그대로 두고, 함선은 건드리지 않습니다."
 com.green1052.aiassist.SurplusPercent:0 "잉여 기준(%)"
 com.green1052.aiassist.SurplusPercent.desc:0 "장비가 군 필요량보다 이 비율 이상 많으면 잉여로 봅니다."
 com.green1052.aiassist.OffensiveReadiness:0 "공세 준비도"
 com.green1052.aiassist.OffensiveReadiness.desc:0 "야전군의 사단들이 지쳐 있으면(아래 평균 조직력·강도 미만) AI가 공격 개시를 미룹니다. 매시간 다시 판단하므로 회복되면 바로 공격합니다. 진행 중인 공격은 멈추지 않고, 상륙·공수 작전은 건드리지 않습니다."
 com.green1052.aiassist.MinOrganisation:0 "공격 기준: 평균 조직력(%)"
 com.green1052.aiassist.MinOrganisation.desc:0 "야전군 사단의 평균 조직력이 이 이상이어야 공격을 시작합니다."
 com.green1052.aiassist.MinStrength:0 "공격 기준: 평균 강도(%)"
 com.green1052.aiassist.MinStrength.desc:0 "야전군 사단의 평균 강도(장비·인력)가 이 이상이어야 공격을 시작합니다."
 com.green1052.aiassist.PocketClosing:0 "포위 우선 공격"
 com.green1052.aiassist.PocketClosing.desc:0 "AI의 국지 공격이 적 사단을 고립시킬 수 있는 프로빈스가 있으면 그곳부터 노립니다. 바닐라는 조건을 통과한 목표 중 무작위로 고릅니다."
 com.green1052.aiassist.MinSupply:0 "공격 기준: 평균 보급(%)"
 com.green1052.aiassist.MinSupply.desc:0 "야전군 사단의 평균 보급률이 이 이상이어야 공격을 시작합니다. 0이면 보급은 보지 않습니다(식민지 전선은 늘 보급이 모자람)."
 com.green1052.aiassist.FrontShortening:0 "전선 단축 공격"
 com.green1052.aiassist.FrontShortening.desc:0 "포위할 목표가 없으면, AI의 국지 공격이 전선을 늘리는 목표 대신 전선을 줄이는 목표를 고릅니다."
 com.green1052.aiassist.ArmorTerrain:0 "기갑 지형 판단"
 com.green1052.aiassist.ArmorTerrain.desc:0 "기갑·기계화 사단이 공격력이 크게 깎이는 지형(숲, 언덕, 늪 등)으로 국지 공격하지 않고, 강 건너 산·늪·정글·도시도 치지 않습니다. 사단 데이터의 지형 보정을 그대로 쓰므로 모드의 수치도 반영됩니다."
 com.green1052.aiassist.AirRetreat:0 "공군 손실 회피"
 com.green1052.aiassist.AirRetreat.desc:0 "제공권에서 크게 지고(점유 35% 미만, 일주일 손실 20기 이상, 격추 1기당 1.5기 이상 손실) 있는 지역에서 AI가 공군을 빼고, 이길 수 있는 지역에 씁니다. 점유가 15% 미만이면 완전히 철수합니다."
 com.green1052.aiassist.Roles.desc:0 "전선 보병은 전선을 지키고 돌파 사단(기갑, 돌파력이 방어력보다 높은 사단)이 공세를 맡습니다. 보병만 있는 프로빈스는 빈 적 프로빈스나 포위된 적에게만 국지 공격합니다. 돌파 사단이 없는 나라에는 적용하지 않습니다."
 com.green1052.aiassist.Roles:0 "사단 역할 운용"
 com.green1052.aiassist.Leaders:0 "지휘관 배치"
 com.green1052.aiassist.Leaders.desc:0 "AI가 가장 크고 교전 중이며 공세 중인 전선부터 좋은 원수·장군을 고르게 합니다(바닐라는 전선 목록 순서대로 고름). 바닐라가 무시하는 특성도 반영합니다: 보병 위주 군에 보병 특성, 공세·수비 전선에 원수의 공세·수비 교리, 병·부상 같은 나쁜 상태."
 com.green1052.aiassist.Concentration:0 "병력 집중"
 com.green1052.aiassist.Concentration.desc:0 "AI가 교전국이 없는 전선(중립국·동맹국 국경)에는 최소 병력만 남기고, 적 사단이 요구량보다 많은 전선에 병력을 더 붙입니다. 교전 중인 적과 맞닿은 전선은 절대 줄이지 않습니다."
 com.green1052.aiassist.TargetValue:0 "공세 목표 선정"
 com.green1052.aiassist.TargetValue.desc:0 "AI의 국지 공격이 가치 높은 프로빈스부터 노립니다: 승점, 수도, 보급 허브, 공항, 자원, 비었거나 지친 수비대(요새화된 다수 병력은 감점). 포위 목표 다음, 전선 단축보다 먼저 봅니다."
