l_korean:
    com.green1052.aiassist.name:0 "AI 보조"
    com.green1052.aiassist.desc:0 "Sheep Mod 애드온입니다. 스크립트로는 손댈 수 없는 AI 판단을 고치며, 능력치 보너스는 주지 않습니다.\n- 전선을 지키고 빈 곳을 메움\n- 공격을 돌파 축과 가치 있는 목표에 모음\n- 힘에서 밀리는 나라는 지키기 좋은 선으로 물러남\n- 공군·해군·상륙을 더 잘 씀\n- 생산·보충·보급·훈련을 안정시킴\n싱글플레이 전용이며, Sheep Mod가 없으면 아무것도 하지 않습니다."
    com.green1052.aiassist.ArmorTerrain:0 "기갑 지형 판단"
    com.green1052.aiassist.ArmorTerrain.desc:0 "기갑·기계화 사단이 불리한 지형으로는 국지 공격하지 않습니다.\n- 숲, 언덕, 늪 같은 지형\n- 강 건너 산악·늪·정글·도시\n- 사단의 지형 보정을 그대로 읽으므로 모드 수치도 반영"
    com.green1052.aiassist.AirRetreat:0 "공군 손실 회피"
    com.green1052.aiassist.AirRetreat.desc:0 "공중전에서 크게 지는 지역에서는 공군을 빼서 이길 수 있는 곳에 씁니다.\n- 기준: 제공권 35% 미만, 일주일 손실 20기 이상, 격추 1기당 손실 1.5기 이상\n- 제공권 15% 미만이면 완전히 철수"
    com.green1052.aiassist.HoldTheLine:0 "전선 유지"
    com.green1052.aiassist.HoldTheLine.desc:0 "전쟁 중에는 적과 맞닿은 전선을 비우지 않습니다.\n- 적과 맞닿은 프로빈스마다 사단을 하나씩 남기고, 다른 전선이나 재배치로 빼 가지 못함\n- 빈 곳은 근처 사단으로 메움(항구·승점·도시·산악 먼저)\n- 남는 사단은 예비대로 두고, 뚫고 들어온 적에게 반격\n- 사단이 모자라면 공격을 시작하지 않고 공세도 멈춤(그곳에서 2배 강하면 예외)\n- 지친 사단은 뒤에서 쉬고, 포위되려는 돌출부의 사단은 빠져나옴\n- 공격 대부분을 지는 공세는 중지\n- 지상 전선에 사단이 필요하면 해안·본토 수비대를 줄임"
    com.green1052.aiassist.DefensivePostures:0 "방어 태세"
    com.green1052.aiassist.DefensivePostures.desc:0 "훨씬 강한 적 앞에서는 노출된 땅을 내주고 그라드로 물러납니다.\n- 그라드: 그 적과 수도 사이에서 가장 지키기 좋은 짧은 선. 매주 다시 긋고, 뚫리면 한 줄 뒤로\n- 발동: 적이 2배 강할 때(전선 프로빈스를 잃는 중이면 1.6배)\n- 새 공세는 없음(상륙은 계속). 지친 적 부대만 사단 2개 이상으로 반격\n- 모든 적이 일주일 내내 우리 힘의 80% 미만이면 복귀(빨라도 한 달 뒤). 그 뒤 한 달은 2배여야 다시 물러남\n전선 유지가 켜져 있어야 합니다."
    com.green1052.aiassist.BreakthroughAxis:0 "돌파 축"
    com.green1052.aiassist.BreakthroughAxis.desc:0 "국지 공격을 전선에 흩지 않고 돌파 축 하나에 모읍니다.\n- 기갑 선봉(병력 집중)이 공격 중이면 축이 그 진격로를 따라감\n- 아니면 전역에서 가장 얇은 적 구간(사단 적음, 요새 없음, 개활지). 3일 유지하고 점령해야 옮김\n- 축 밖에서는 축 옆 적 사단을 묶어 두는 공격만 함\n- 근접 항공 지원도 축 위 전투가 먼저"
    com.green1052.aiassist.Encirclement:0 "포위 섬멸"
    com.green1052.aiassist.Encirclement.desc:0 "돌파 축이 적 돌출부부터 노립니다.\n- 대상: 목(1~3 프로빈스)을 점령하면 적 사단 3개 이상이 고립되고, 그만한 값어치가 있는 돌출부\n- 양 측면의 국지 공격과 근접 항공 지원이 돌출부 정면이 아니라 목을 침\n- 포위가 닫힐 때까지, 최대 일주일 유지\n돌파 축이 켜져 있어야 합니다."
    com.green1052.aiassist.RailwayGuns:0 "열차포"
    com.green1052.aiassist.RailwayGuns.desc:0 "AI의 열차포를 돌파 축의 군에 먼저 주고 그대로 둡니다.\n- 다른 군이 빼앗아 가지 못함\n- 바닐라는 위치와 상관없이 가장 큰 군에 줌\n돌파 축이 켜져 있어야 합니다."
    com.green1052.aiassist.SupplyHubs:0 "보급 허브"
    com.green1052.aiassist.SupplyHubs.desc:0 "AI 사단의 보급이 모자란 곳에 철도를 개량하고 보급 허브를 짓습니다.\n- 그 사단에 보급하는 허브에서 수도까지 철도를 1단계 개량(주 1회, 같은 허브는 60일 뒤 다시)\n- 1941년부터, 민간 공장이 60개 이상인 나라는 3 프로빈스 안에 허브가 없으면 새로 지음(철도가 닿는 곳 먼저)\n- 새 허브는 한 달에 최대 2개(하나에 20000)"
    com.green1052.aiassist.GroundCrews:0 "지상 근무단"
    com.green1052.aiassist.GroundCrews.desc:0 "비행단이 가장 치열하게 싸우는 지역에서 AI가 지상 근무단 증원을 켭니다.\n- 효과: 지휘력 20으로 그 지역 항공 효율 +10%(끄면 지휘력 반환)\n- 2일마다, 최근 3일간 손실과 격추가 10기 이상인 지역 최대 2곳. 비용을 내고도 지휘력이 50 이상 남을 때만\n- 일주일간 싸움이 없으면 끔. 지휘력이 50 아래면 한 번에 한 곳씩 끔\n바닐라 AI는 이 기능을 쓰지 않습니다."
    com.green1052.aiassist.AttackTargets:0 "공격 목표 선정"
    com.green1052.aiassist.AttackTargets.desc:0 "국지 공격 목표를 무작위가 아니라 가치를 따져 고릅니다.\n- 먼저: 적 사단을 고립시키는 프로빈스\n- 다음: 승점·수도·보급 허브·비행장·자원, 약한 수비(참호 60% 이상이면 감점)\n- 그다음: 전선을 줄이는 프로빈스\n- 아군이 포위되면 구출·탈출 통로가 먼저\n- 전선 옆 빈 적 프로빈스는 쌩쌩한 사단이 들어가 점령"
    com.green1052.aiassist.Exploitation:0 "돌파 후 종심 진격"
    com.green1052.aiassist.Exploitation.desc:0 "쌩쌩한 기동 사단이 적 전선의 구멍으로 깊숙이 진격합니다.\n- 구멍: 적 사단이 지키지 않는 빈 적 땅\n- 최대 4 프로빈스 깊이, 가장 가치 있는 곳(수도·승점·보급 허브·비행장)으로\n- 목표당 2개, 나라당 3시간마다 4개 사단까지. 일주일 동안 전투 계획에서 빠짐\n전선 유지가 켜져 있어야 합니다."
    com.green1052.aiassist.Pincers:0 "양익 포위"
    com.green1052.aiassist.Pincers.desc:0 "적이 사단을 한곳에 모으면 돌파 축을 둘로 나눠 그 뒤에서 조입니다.\n- 집결: 전선 프로빈스 하나에 사단 3개 이상, 전선 평균의 2배\n- 두 축: 집결지 양쪽으로 2~5 프로빈스 떨어진 가장 얇은 적 구간\n- 두 목표가 적 땅인 동안 3일 유지\n돌파 축이 켜져 있어야 합니다."
    com.green1052.aiassist.Feints:0 "기만 공격"
    com.green1052.aiassist.Feints.desc:0 "새 주공 전에 다른 곳을 먼저 쳐서 적 예비대를 그쪽으로 끌어냅니다.\n- 기만 지점: 주공에서 5 프로빈스 이상 떨어진, 적 사단이 가장 많은 전선 프로빈스\n- 36시간 동안. 그동안 주공은 기다림\n돌파 축이 켜져 있어야 합니다."
    com.green1052.aiassist.OffensiveTiming:0 "공세 타이밍"
    com.green1052.aiassist.OffensiveTiming.desc:0 "전투 계획의 공세는 사단이 준비된 뒤에야 시작합니다.\n- 대기: 평균 조직력 60% 미만, 30% 넘는 사단이 이동 중, 적 제공권 70% 초과, 대부분이 진흙 속\n- 이때도 보류: 앞이 요새선인데 2:1로 앞서지 못함, 귀로가 닫히는 돌출부에 사단이 있음, 3일 안에 공세가 격퇴됨\n- 승산: 게임 전투 계산으로 공격마다 승패를 매겨 지는 쪽이 많으면 보류\n전선 유지가 켜져 있어야 합니다."
    com.green1052.aiassist.BeachDefense:0 "해안 상륙 대응"
    com.green1052.aiassist.BeachDefense.desc:0 "적이 상륙하면 바로 대응합니다.\n- 근처의 남는 사단이 교두보를 둘러싸고 안으로 공격\n- 교두보: 적이 10일 안에 바다에서 빼앗은 땅, 또는 해안의 작은 적 고립 지대\n바닐라는 전선이 무너질 때까지 상륙을 내버려 둡니다."
    com.green1052.aiassist.SupplyAwareAttacks:0 "보급 고려 공격"
    com.green1052.aiassist.SupplyAwareAttacks.desc:0 "점령해도 보급이 닿지 않을 프로빈스는 국지 공격하지 않습니다.\n- 공격하는 프로빈스의 보급이 모자라고, 목표와 맞닿은 다른 아군 프로빈스에도 남는 보급이 없으면 건너뜀\n- 보급은 아군·동맹 땅으로만 흐름\n- 그래도 공격: 포위를 닫는 목표, 포위된 아군에게 가는 통로"
    com.green1052.aiassist.SupplyAwareMinPercent:0 "보급 고려 공격: 최소 보급(%)"
    com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "공격하는 프로빈스가 필요량의 이만큼(%)을 받거나, 목표와 맞닿은 다른 아군 프로빈스에 이만큼 남아야 공격합니다."
    com.green1052.aiassist.RefitPriority:0 "전선 우선 보충"
    com.green1052.aiassist.RefitPriority.desc:0 "보충병과 신형 장비를 전선 사단에 먼저 보냅니다.\n- 전선 사단: 교전 중이거나 적 점령지와 맞닿은 사단\n- 후방·수비대 사단은 그다음\n- 75% 넘게 찬 전선 사단은 더 빈 사단에 양보"
    com.green1052.aiassist.BombingTargets:0 "전략 폭격 목표"
    com.green1052.aiassist.BombingTargets.desc:0 "전략 폭격기가 지상 전선과 맞닿은 적 지역부터 폭격합니다.\n- 대상: 전투를 떠받치는 공장·보급 허브·비행장\n- 전선과 맞닿은 지역에는 폭격기를 2배로\n- 전선에서 먼 지역은 절반만, 우선순위도 낮춤"
    com.green1052.aiassist.AirTraining:0 "공군 훈련"
    com.green1052.aiassist.AirTraining.desc:0 "경험이 적은 비행단은 할 일 없는 곳에 띄우지 않고 훈련시킵니다.\n- 대상: 두 번째 숙련도 미만인 비행단\n- 평시에는 모든 비행단, 전시에는 적기가 없는 지상 지역으로 초계 나갈 전투기\n- 임무가 없는 비행단도 훈련, 항모 비행단은 제외\n- 동시에 최대 절반까지, 훈련을 마치면 원래 임무로\n- 이번 주에 떠난 기지로는 되돌아가지 않음"
    com.green1052.aiassist.ArmyTraining:0 "육군 훈련"
    com.green1052.aiassist.ArmyTraining.desc:0 "할 일 없는 AI 군이 사단을 정규병까지 훈련시킵니다.\n- 평시에는 모든 군, 전시에는 전선을 맡지 않은 군(수비대, 예비대)\n- 사단이 전투 중이거나 적 땅과 맞닿아 있거나 전력 70% 미만이면 안 함\n- AI가 전쟁을 예상하면 훈련 대신 참호를 팜\n바닐라는 전쟁이 나면 훈련을 모두 멈춥니다."
    com.green1052.aiassist.BreakOffLosingAttacks:0 "지는 공격 중단"
    com.green1052.aiassist.BreakOffLosingAttacks.desc:0 "AI가 지고 있는 공격은 중단하고, 그 프로빈스는 3일간 다시 공격하지 않습니다.\n- 지는 기준: 수비 사단이 1.5배일 때 전투 우세 40% 미만, 아니면 25% 미만\n- 그래도 계속: 포위를 닫는 공격, 포위된 아군에게 가는 길을 여는 공격, 기만 공격\n- 다른 플러그인이 맡은 사단(탈출, 견제 공격, 작전)은 건드리지 않음"
    com.green1052.aiassist.StableLeaders:0 "지휘관 고정"
    com.green1052.aiassist.StableLeaders.desc:0 "AI가 다른 부대를 지휘 중인 장군·원수를 빼 오지 않습니다.\n바닐라에서는 하루이틀마다 군의 지휘관이 바뀌었습니다."
    com.green1052.aiassist.NavalTraining:0 "해군 훈련"
    com.green1052.aiassist.NavalTraining.desc:0 "평시에 할 일 없는 AI 기동부대가 항구에서 기다리지 않고 함선이 정규병이 될 때까지 훈련합니다.\n- 바닐라는 세계 긴장도가 50%를 넘으면 훈련을 멈춤\n- AI가 전쟁을 예상하면 훈련하지 않음(훈련 중에는 조직력이 1/5로 묶임)"
    com.green1052.aiassist.ShoreBombardment:0 "해안 포격"
    com.green1052.aiassist.ShoreBombardment.desc:0 "전시에 포나 항모를 가진 AI 기동부대가 해안 지상전 옆 바다에 자리 잡습니다.\n- 초계·타격부대·대기·훈련 중인 부대에서 뽑음(상륙 지원·호송·통상 파괴·기뢰는 제외). 아무도 맡지 않은 전투마다 하나, 바다 6칸 이내\n- 함포로 그 전투의 적 사단을 포격하고, 항모 비행단은 지상전에 가세\n- 전투 옆에서 일주일, 다음 전투를 바다에서 최대 2주 기다림. 두 번째 전투에 아무도 없으면 함대를 반으로 나눔\n바닐라는 자기 목표에 두거나 항구로 보냅니다."
    com.green1052.aiassist.ProductionLines:0 "생산 라인 유지"
    com.green1052.aiassist.ProductionLines.desc:0 "효율이 오른 생산 라인에서는 공장을 쉽게 빼지 않습니다.\n- 평균 효율 35% 이상인 장비에서 공장을 조금(1/4 이하) 빼는 변경은 미룸\n- 대신 다른 장비 중 가장 적게 늘어나는 쪽에서 덜어 냄\n- 크게 줄이거나 생산을 멈추는 변경은 그대로 진행\n바닐라는 그냥 공장을 옮기고, 옮긴 공장은 효율 10%부터 다시 시작합니다."
    com.green1052.aiassist.StickyDays:0 "생산 라인 유지: 기간(일)"
    com.green1052.aiassist.StickyDays.desc:0 "효율 높은 라인에서 공장을 조금 빼는 변경을 미루는 기간입니다. 지나면 그대로 진행합니다."
    com.green1052.aiassist.StrategicInvasions:0 "전략 상륙"
    com.green1052.aiassist.StrategicInvasions.desc:0 "상륙 해안을 그곳 사정을 보고 고르고, 항로를 공군으로 엄호합니다.\n- 먼저: 승점·수도·보급 허브·비행장·자원 근처의 수비가 얇은 해안\n- 나중: 근처에 적 사단이 있거나 요새·해안 벙커가 있는 해안\n- 해안 주변 적 사단이 상륙 병력의 절반을 넘으면 대기(최대 일주일)\n- 항로 해역에 전투기 2배(최소 100기), 대함 폭격기도 2배"
