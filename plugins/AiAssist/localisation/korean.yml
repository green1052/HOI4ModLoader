l_korean:
    com.green1052.aiassist.name:0 "AI 보조"
    com.green1052.aiassist.desc:0 "Sheep Mod 애드온입니다. 스크립트로는 고칠 수 없는 AI 판단을 고치며(능력치 보너스 없음), 싱글 전용이고 Sheep Mod가 없으면 아무것도 하지 않습니다."
    com.green1052.aiassist.ArmorTerrain:0 "기갑 지형 판단"
    com.green1052.aiassist.ArmorTerrain.desc:0 "기갑·기계화 사단이 불리한 지형으로 국지 공격하지 않습니다.\n- 공격력이 크게 깎이는 지형(숲, 언덕, 늪 등)은 피함\n- 강 건너 산악·늪·정글·도시도 치지 않음\n- 사단의 지형 보정을 그대로 읽어 모드 수치도 반영"
    com.green1052.aiassist.AirRetreat:0 "공군 손실 회피"
    com.green1052.aiassist.AirRetreat.desc:0 "제공권 싸움에서 크게 지는 지역에서 공군을 빼 이길 수 있는 곳에 씁니다.\n- 조건: 제공권 35% 미만, 일주일 손실 20기 이상, 격추 1기당 손실 1.5기 이상\n- 제공권 15% 미만이면 완전히 철수"
    com.green1052.aiassist.HoldTheLine:0 "전선 유지"
    com.green1052.aiassist.HoldTheLine.desc:0 "전쟁 중 적과 맞닿은 전선을 비우지 않습니다.\n- 적과 맞닿은 프로빈스마다 사단 1개는 남김(적 사단이 없어도). 전선 전체에는 맞은편 적 사단 수 이상을 남김(다른 전선이 빼 가지 못함). 적 사단이 가까운 전선과 그 바로 뒤의 사단은 다른 전선으로 전략 재배치하지 못함. 포위벽·예비대·도착 1주 안 된 사단도 빼 가지 못함\n- 적에게 항구가 없으면(상륙 불가) 해안·후방 수비대를 두지 않고 그 사단을 전선에 둠\n- 빈 곳은 근처 쉬는 사단으로 채움(항구·승점·도시·산악 먼저). 여유가 있으면 예비대를 두고 뚫고 들어온 적에 반격\n- 사단이 모자라면 공세를 멈춤(그곳에서 적보다 2배 강하면 예외)\n- 지친 사단은 뒤로 빼 쉬고, 포위될 돌출부에서는 빠져나옴\n- 이미 적의 2배인 전선은 주마다 1개만 붙잡아, 남는 사단이 부족한 전선으로 갈 수 있음. 전선이 모자랐던 뒤 한 달 동안, 그리고 본토 육상 국경에서 전쟁 중이거나 전쟁이 예상될 때(정당화·전쟁 목표·중점·전쟁 준비) 해안·도시 수비대는 본토 항구당 사단 1개만 남기고 전선으로(육상 전쟁 전에도 같음). 육상 전선(자국 또는 동맹국 본토)에서 전쟁 중이면 수비대는 사단의 1/10~1/3(1939~1943년에 걸쳐 1/4~거의 절반으로 늘어남, 육상 전쟁 전에도 최소 1/4)\n- 공격 대부분을 지거나 귀로가 닫히는 돌출부로 사단을 밀어 넣는 공세는 중지, 군 HQ는 전선에서 뺌"
    com.green1052.aiassist.DefensivePostures:0 "방어 태세"
    com.green1052.aiassist.DefensivePostures.desc:0 "훨씬 강한 적 앞에서는 노출된 땅을 내주고 그라드로 물러납니다.\n- 그라드: 적과 수도 사이의 가장 지키기 좋은 짧은 전선(매주 갱신, 뚫리면 한 줄 뒤로)\n- 발동: 적이 2배 강할 때(1주 안에 전선 땅을 잃고 있으면 1.6배)\n- 새 공세·공수 강하 중지(상륙은 유지), 전선 앞 지친 적만 사단 2개 이상으로 반격\n- 적이 1주 내내 우리 힘의 80% 미만이면 복귀(후퇴 1달 뒤부터). 이후 1달은 2배여야 재후퇴\n필요: 전선 유지"
    com.green1052.aiassist.BreakthroughAxis:0 "돌파 축"
    com.green1052.aiassist.BreakthroughAxis.desc:0 "국지 공격을 돌파 축 한 곳에 모아 사단이 좌우로 흩어지지 않게 합니다.\n- 기갑 돌격(병력 집중) 중이면 그 진격로가 축이 되고 선두를 따라 이동\n- 아니면 전역에서 가장 얇은 적 구역(사단 적고 요새 없고 개활지)을 3일간 축으로 삼고, 점령한 뒤에야 옮김\n- 축 밖에서는 이길 만할 때 견제 공격만 함\n- 근접 항공 지원도 축 위의 전투부터"
    com.green1052.aiassist.Encirclement:0 "포위 섬멸"
    com.green1052.aiassist.Encirclement.desc:0 "돌파 축이 적 돌출부를 먼저 노려 포위합니다.\n- 대상: 1~3 프로빈스 너비의 목을 점령하면 적 사단 3개 이상이 고립되고, 그만한 값어치가 있는 돌출부\n- 양 측면의 국지 공격과 근접 항공 지원이 정면 대신 목을 침\n- 포위가 닫히거나 최대 1주까지 유지\n필요: 돌파 축"
    com.green1052.aiassist.RailwayGuns:0 "열차포"
    com.green1052.aiassist.RailwayGuns.desc:0 "AI의 열차포를 돌파 축의 군에 먼저 배정하고 그대로 둡니다.\n- 다른 군이 빼앗아 가지 못함\n- 바닐라는 위치와 상관없이 가장 큰 군에 줌\n필요: 돌파 축"
    com.green1052.aiassist.SupplyHubs:0 "보급 허브"
    com.green1052.aiassist.SupplyHubs.desc:0 "보급이 모자란 AI 사단을 위해 철도를 개량하고 보급 허브를 짓습니다.\n- 그 사단에 보급하는 허브에서 수도까지 철도 1단계 개량(주 1회, 같은 허브는 60일 뒤 다시)\n- 1941년부터, 민간 공장 60개 이상이고 3 프로빈스 안에 허브가 없으면 새로 지음(철도가 닿는 곳 먼저)\n- 허브는 한 달 최대 2개(비용 20000)"
    com.green1052.aiassist.GroundCrews:0 "지상 근무단"
    com.green1052.aiassist.GroundCrews.desc:0 "공중전이 치열한 지역에서 AI가 더 많은 지상 근무단을 켭니다.\n- 효과: 지휘력 20으로 그 지역 항공 효율 +10%(끄면 지휘력 반환)\n- 2일마다, 최근 3일간 손실+격추 10대 이상인 지역 최대 2곳. 비용을 내고도 지휘력이 50 이상 남을 때만\n- 1주간 싸움이 없으면 끔, 지휘력이 50 아래면 한 번에 한 곳씩 끔\n바닐라 AI는 이것을 켜지 않음"
    com.green1052.aiassist.AttackTargets:0 "공격 목표 선정"
    com.green1052.aiassist.AttackTargets.desc:0 "국지 공격 목표를 무작위가 아니라 가치 순으로 고릅니다.\n- 순서: 적 사단을 고립시키는 곳 → 승점·수도·보급 허브·공항·자원·약한 수비 → 전선을 줄이는 곳\n- 참호를 60% 이상 판 수비는 감점\n- 아군이 포위되면 구출·탈출 통로부터 엶\n- 전선 옆 빈 적 프로빈스는 기운 남은 사단이 들어가 점령"
    com.green1052.aiassist.Exploitation:0 "돌파 후 종심 진격"
    com.green1052.aiassist.Exploitation.desc:0 "적 전선에 구멍이 나면 쌩쌩한 기동 사단이 깊숙이 진격합니다.\n- 구멍: 적 사단이 없고 옆에도 적 사단이 없는 적 땅\n- 최대 4칸 깊이, 가장 가치 있는 곳(수도·승점·보급 허브·비행장)으로\n- 목표당 최대 2개, 나라당 3시간마다 최대 4개 사단. 일주일 동안 전투 계획에서 빠졌다가 복귀\n필요: 전선 유지"
    com.green1052.aiassist.Pincers:0 "양익 포위"
    com.green1052.aiassist.Pincers.desc:0 "적이 사단을 한곳에 모으면 돌파축을 둘로 나눠 그 뒤에서 조입니다.\n- 집결: 전선 프로빈스에 사단 3개 이상, 전선 평균의 2배\n- 두 축: 집결지 양쪽에서 2~5칸 떨어진 가장 얇은 적 구간\n- 두 목표가 적 땅인 동안 3일 유지\n돌파축 설정이 켜져 있어야 합니다."
    com.green1052.aiassist.Feints:0 "기만 공격"
    com.green1052.aiassist.Feints.desc:0 "새 주공 전에 다른 곳을 먼저 쳐서 적 예비대를 그쪽으로 끌어냅니다.\n- 견제 지점: 주공에서 5칸 이상 떨어진, 적 사단이 가장 많은 전선 프로빈스\n- 36시간 동안. 그동안 주공은 대기하고, 끝나면 견제를 멈춤\n돌파축 설정이 켜져 있어야 합니다."
    com.green1052.aiassist.OffensiveTiming:0 "공세 타이밍"
    com.green1052.aiassist.OffensiveTiming.desc:0 "전투 계획의 공세는 사단이 준비된 뒤에 시작합니다.\n- 평균 조직력 60% 미만이면 대기\n- 30% 넘는 사단이 아직 전선으로 이동 중이면 대기\n- 대부분의 사단 위 하늘에서 적 제공권이 70%를 넘거나, 대부분이 진흙에 있으면 대기\n전선 유지 설정이 켜져 있어야 합니다.\n- 이때도 보류: 앞이 요새선인데 2:1로 앞서지 못함, 귀로가 닫히는 돌출부에 사단이 있음, 최근 3일 안에 공세가 격퇴됨\n- 승산 예측: 게임 전투식(공격 대 방어/돌파, 경도, 장갑, 요새, 강)으로 공격마다 승패를 계산해 지는 쪽이 많으면 보류"
    com.green1052.aiassist.BeachDefense:0 "해안 상륙 대응"
    com.green1052.aiassist.BeachDefense.desc:0 "적 상륙에 바로 대응해 교두보를 막고 공격합니다.\n- 상륙장 근처의 쉬는 사단이 교두보를 둘러싸고 안으로 공격\n- 교두보: 적이 10일 안에 바다에서 빼앗은 땅, 또는 해안의 작은 적 고립 지대\n바닐라는 전선이 무너질 때까지 상륙을 방치함"
    com.green1052.aiassist.SupplyAwareAttacks:0 "보급 고려 공격"
    com.green1052.aiassist.SupplyAwareAttacks.desc:0 "점령해도 보급이 닿지 않을 프로빈스는 국지 공격하지 않습니다.\n- 공격하는 프로빈스도, 목표와 맞닿은 다른 아군 프로빈스도 보급이 모자라면 공격하지 않음\n- 보급은 아군·동맹 땅으로만 흐름\n- 예외: 포위를 완성하는 목표, 포위된 아군에게 가는 통로\n기준은 아래 최소 보급(%) 설정"
    com.green1052.aiassist.SupplyAwareMinPercent:0 "보급 고려 공격: 최소 보급(%)"
    com.green1052.aiassist.SupplyAwareMinPercent.desc:0 "국지 공격에 필요한 최소 보급 비율입니다.\n- 공격하는 프로빈스가 필요량의 이만큼(%)을 받거나, 목표와 맞닿은 다른 아군 프로빈스에 그만큼 남아야 공격"
    com.green1052.aiassist.RefitPriority:0 "전선 우선 보충"
    com.green1052.aiassist.RefitPriority.desc:0 "보충병과 신형 장비를 전선 사단에 먼저 보냅니다.\n- 전선 사단: 교전 중이거나 적 점령지와 맞닿은 사단\n- 후방·수비대 사단은 그다음\n- 75% 넘게 찬 전선 사단은 더 빈 사단에 양보"
    com.green1052.aiassist.BombingTargets:0 "전략 폭격 목표"
    com.green1052.aiassist.BombingTargets.desc:0 "전략 폭격기가 지상 전선 바로 뒤의 적 지역부터 폭격합니다.\n- 대상: 전투를 떠받치는 공장·보급 허브·공항\n- 전선과 맞닿은 지역은 폭격기를 2배로 요청\n- 전선에서 먼 지역은 절반만, 우선순위도 낮춤"
    com.green1052.aiassist.AirTraining:0 "공군 훈련"
    com.green1052.aiassist.AirTraining.desc:0 "경험이 적은 비행단을 헛되이 띄우지 않고 훈련시킵니다.\n- 대상: 두 번째 숙련도 미만인 비행단\n- 평시: 임무에 보내려던 모든 비행단 / 전시: 적기가 없는 지상 지역으로 초계 갈 전투기\n- 동시에 최대 절반까지, 훈련을 마치면 원래 임무로\n- 임무가 아예 없는 비행단도 매일 훈련(전시 포함), 항모 비행단은 훈련하지 않음\n- 이번 주에 떠난 기지로 비행단을 되돌리지 않음(바닐라는 두 기지 사이를 매일 오감)"
    com.green1052.aiassist.ArmyTraining:0 "육군 훈련"
    com.green1052.aiassist.ArmyTraining.desc:0 "할 일 없는 AI 군이 사단을 정규병까지 훈련시킵니다.\n- 평시: 모든 군\n- 전시: 전선을 맡지 않은 군(수비대, 예비대)\n- 사단이 전투 중이거나 적 땅에 붙어 있거나 전력 70% 미만이면 안 함\n바닐라는 전쟁이 나면 모든 훈련을 멈추고, 전선에 없는 군은 훈련시키지 않습니다.\nAI가 전쟁을 예상하면(전쟁 준비 전략, 서로를 겨냥한 중점) 훈련하지 않고 참호를 팝니다."
    com.green1052.aiassist.StableLeaders:0 "지휘관 고정"
    com.green1052.aiassist.StableLeaders.desc:0 "AI가 다른 군을 지휘 중인 장군·원수를 빼 오지 않습니다.\n바닐라는 매일 지휘관을 다시 고르며 서로의 군에서 장군을 빼 갔다가 되찾아, 군마다 하루이틀마다 지휘관이 바뀌었습니다."
    com.green1052.aiassist.NavalTraining:0 "해군 훈련"
    com.green1052.aiassist.NavalTraining.desc:0 "평시에 할 일 없는 AI 기동부대가 항구에서 기다리지 않고 함선이 정규병이 될 때까지 훈련합니다.\n바닐라는 세계 긴장도가 50%를 넘으면 훈련을 멈춥니다.\nAI가 전쟁을 예상하면 훈련하지 않습니다(훈련 중인 함선은 조직력이 1/5로 묶임)."
    com.green1052.aiassist.ShoreBombardment:0 "해안 포격"
    com.green1052.aiassist.ShoreBombardment.desc:0 "전시에 포를 가진 기동부대나 항모 기동부대가 자국 해안 지상전 옆 바다로 가서 대기합니다.\n- 해군 AI 목표가 가져가기 전에 초계·타격부대·대기·훈련 중인 것을 데려옴(상륙 지원·호송·통상 파괴·기뢰는 제외), 아무도 맡지 않은 전투마다 1개, 바닷길 6칸 이내\n- 대기 중인 함선은 그 전투의 적 사단을 포격, 항모 비행단은 그 지상 지역에 닿음\n- 전투 해역에 1주, 다음 전투를 바다에서 최대 2주 기다림. 두 번째 전투가 비어 있으면 함대를 반으로 나눔\n바닐라는 자기 목표에 두거나 항구로 보냅니다."
    com.green1052.aiassist.ProductionLines:0 "생산 라인 유지"
    com.green1052.aiassist.ProductionLines.desc:0 "효율이 오른 생산 라인에서 공장을 쉽게 빼지 않습니다.\n- 평균 효율 35% 이상인 장비에서 공장을 조금(1/4 이하) 빼는 변경은 미룸\n- 대신 다른 장비 중 가장 적게 늘어나는 쪽에서 덜어 냄\n- 크게 줄이거나 생산을 멈추는 변경은 그대로 진행\n바닐라는 효율과 무관하게 공장을 옮겨 효율 10%부터 다시 시작함"
    com.green1052.aiassist.StickyDays:0 "생산 라인 유지: 기간(일)"
    com.green1052.aiassist.StickyDays.desc:0 "효율 높은 라인에서 공장을 조금 빼는 변경을 미루는 기간(일)입니다.\n- 기간이 지나도 AI가 원하면 그대로 진행"
    com.green1052.aiassist.StrategicInvasions:0 "전략 상륙"
    com.green1052.aiassist.StrategicInvasions.desc:0 "상륙할 해안을 그곳 사정을 보고 고르고, 항로를 공군으로 엄호합니다.\n- 우선: 승점·수도·보급 허브·공항·자원 근처의 수비가 얇은 해안\n- 나중: 근처에 적 사단이나 요새·해안 벙커가 있는 해안\n- 해안 주변 적 사단이 상륙 병력의 절반을 넘으면 대기(최대 1주)\n- 항로 해역에 전투기 2배(최소 100대), 적 함선이 있으면 대함 폭격기도 2배"
    com.green1052.aiassist.StrategicParadrops:0 "전략 공수 강하"
    com.green1052.aiassist.StrategicParadrops.desc:0 "AI가 공수부대를 돌파 축 뒤나 자기 교두보 뒤에 강하시킵니다(바닐라 AI는 공수를 하지 않음).\n- 축 근처 적 전선 뒤 빈 프로빈스에 최대 4개 사단(승점·보급 허브·공항·포위 지점 먼저)\n- 축 강하가 없으면 10일 안에 상륙한 교두보 뒤로\n- 준비 완료·수송기 충분·항로 제공권일 때만. 2주 안에 못 뜨면 포기\n필요: 돌파 축. 부대·수송기는 '공수부대 편성' 설정이 만듦\n공수 사단은 전선에서 빼(바닐라는 일반 보병처럼 소모) 근처의 가장 좋은 공군 기지에서 대기"
    com.green1052.aiassist.AirborneUnits:0 "공수부대 편성"
    com.green1052.aiassist.AirborneUnits.desc:0 "주요국 AI가 공수부대와 수송기를 갖추게 합니다.\n- 대상: 독일·영국·미국·일본·소련·이탈리아\n- 1938년부터 군수 공장 30개 이상이면 관련 기술 연구\n- 군수 공장 40개 이상이면 사단의 약 4%를 공수부대로 편성하고 수송기 생산\n다음 실행부터 적용. 체크섬이 바뀌니 이 설정이 없는 사람과 멀티하려면 끄고 재시작"
