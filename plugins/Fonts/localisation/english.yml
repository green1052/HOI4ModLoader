l_english:
    com.green1052.fonts.desc:0 "The game's text in a font you choose: pick an installed font with the Font setting's arrows, or set the path of a .ttf/.otf file in the config file (HOI4ModLoader\config\com.green1052.fonts.cfg). Takes effect when the game is restarted."
    com.green1052.fonts.Font:0 "Font"
    com.green1052.fonts.Font.desc:0 "The font for the game's text: the arrows step through the installed fonts that have the game language's characters; the config file also takes the path of a .ttf/.otf/.ttc file. (none): the game's own fonts. Takes effect when the game is restarted."
    com.green1052.fonts.HeaderFont:0 "Title font"
    com.green1052.fonts.HeaderFont.desc:0 "The same for titles (the fonts named *header*). (none): Font."
    com.green1052.fonts.SizePercent:0 "Size (%)"
    com.green1052.fonts.SizePercent.desc:0 "Glyph size against the original font's line height (%): bigger or smaller text in the same lines."
    com.green1052.fonts.Keep:0 "Kept fonts"
    com.green1052.fonts.Keep.desc:0 "Fonts that stay the game's own: comma-separated parts of their file names (e.g. typewriter,mapfont)."
