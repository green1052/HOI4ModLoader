l_korean:
    com.green1052.fonts.desc:0 "게임 글꼴을 원하는 폰트로 바꿉니다. 설치된 폰트 이름이나 .ttf/.otf 파일 경로를 설정 파일(HOI4ModLoader\config\com.green1052.fonts.cfg)에 적으세요. 다음 실행부터 적용됩니다."
    com.green1052.fonts.Font:0 "폰트"
    com.green1052.fonts.Font.desc:0 "게임 글꼴로 쓸 폰트: 설치된 폰트 이름(예: Malgun Gothic) 또는 .ttf/.otf/.ttc 파일 경로입니다. 비우면 게임 원래 글꼴을 씁니다. 다음 실행부터 적용됩니다."
    com.green1052.fonts.HeaderFont:0 "제목 폰트"
    com.green1052.fonts.HeaderFont.desc:0 "제목 글꼴(이름에 header가 들어간 폰트)에 쓸 폰트입니다. 비우면 위 폰트를 씁니다."
    com.green1052.fonts.SizePercent:0 "크기 (%)"
    com.green1052.fonts.SizePercent.desc:0 "원래 글꼴의 줄 높이에 대한 글자 크기(%)입니다. 줄 간격은 그대로 두고 글자만 키우거나 줄입니다."
    com.green1052.fonts.Keep:0 "유지할 폰트"
    com.green1052.fonts.Keep.desc:0 "게임 원래 글꼴로 남길 폰트입니다. 파일 이름의 일부를 쉼표로 구분해 적습니다(예: typewriter,mapfont)."
