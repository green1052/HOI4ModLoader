l_korean:
    com.green1052.fonts.name:0 "폰트"
    com.green1052.fonts.desc:0 "게임 글꼴을 원하는 폰트로 바꿉니다.\n- 폰트 설정의 오른쪽 화살표로 설치된 폰트 중 선택\n- 또는 설정 파일(HOI4ModLoader\config\com.green1052.fonts.cfg)에 .ttf/.otf 경로 입력\n다음 실행부터 적용됩니다."
    com.green1052.fonts.Font:0 "폰트"
    com.green1052.fonts.Font.desc:0 "게임 글꼴로 쓸 폰트입니다. 오른쪽 화살표 목록에서 체크하세요. 폰트에 없는 글자(예: 한글)는 원래 글꼴로 나옵니다.\n(없음)이면 원래 글꼴. 다음 실행부터 적용."
    com.green1052.fonts.HeaderFont:0 "제목 폰트"
    com.green1052.fonts.HeaderFont.desc:0 "제목 글꼴(이름에 header가 들어간 폰트)에 쓸 폰트입니다. 고르는 방법은 위와 같습니다.\n(없음)이면 위 폰트를 씁니다."
    com.green1052.fonts.SizePercent:0 "크기 (%)"
    com.green1052.fonts.SizePercent.desc:0 "원래 줄 높이 대비 글자 크기(%, 50~150)입니다.\n줄 간격은 그대로 두고 글자만 키우거나 줄입니다."
    com.green1052.fonts.Typewriter:0 "타자기 글꼴도 바꾸기"
    com.green1052.fonts.Typewriter.desc:0 "문서·보고서에 쓰이는 타자기 글꼴도 새 폰트로 바꿉니다.\n끄면 원래 모양 그대로입니다."
