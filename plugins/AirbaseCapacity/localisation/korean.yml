l_korean:
 com.green1052.airbasecapacity.name:0 "공항 수용량"
 com.green1052.airbasecapacity.desc:0 "공군을 선택한 채 공항을 Shift+우클릭하면 남은 수용량에 들어가는 공군만 보냅니다."
 com.green1052.airbasecapacity.WithoutShift:0 "Shift 없이"
 com.green1052.airbasecapacity.WithoutShift.desc:0 "Shift+우클릭뿐 아니라 공항으로 보내는 모든 이동에 적용합니다."
 com.green1052.airbasecapacity.KeepFree:0 "비워 둘 수용량"
 com.green1052.airbasecapacity.KeepFree.desc:0 "공항에 비워 둘 수용량(비행기 수)입니다."
 com.green1052.airbasecapacity.AutoRebase:0 "자동 재배치"
 com.green1052.airbasecapacity.AutoRebase.desc:0 "공군의 공항이 임무 지역 일부에만 닿으면, 수용량이 남는 공항 중 더 많이 닿는 곳(같으면 지역에 가까운 곳)으로 옮깁니다. 임무는 그대로 이어집니다. 야전군에 배속된 공군은 게임이 직접 옮기므로 건드리지 않습니다."
 com.green1052.airbasecapacity.Coverage:0 "재배치 기준 범위(%)"
 com.green1052.airbasecapacity.Coverage.desc:0 "임무 지역이 이 비율보다 적게 닿는 공군을 재배치합니다."
 com.green1052.airbasecapacity.CasFollowsBattles:0 "CAS 전투 따라가기"
 com.green1052.airbasecapacity.CasFollowsBattles.desc:0 "배속되지 않은 근접항공지원 공군의 임무 지역에 30초 동안 우리 지상전이 없으면, 지금 공항에서 닿는 지역 중 우리 사단이 가장 많이 싸우는 곳으로 임무를 옮깁니다."
