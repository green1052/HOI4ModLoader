l_korean:
 com.green1052.plantools.name:0 "전투 계획 일괄 조작"
 com.green1052.plantools.desc:0 "군 일괄 조작: Ctrl+Alt+1/2/3으로 모든 태세를 한 번에 바꾸고, Ctrl+Alt+E로 모든 전투 계획을 시작하고, Ctrl+Alt+H로 전부 중단합니다."
 com.green1052.plantools.Stance:0 "태세 단축키"
 com.green1052.plantools.Stance.desc:0 "Ctrl+Alt+1/2/3으로 모든 군과 야전군의 태세(신중, 균형, 돌격)를 한 번에 바꿉니다."
 com.green1052.plantools.Execute:0 "계획 시작 키"
 com.green1052.plantools.Execute.desc:0 "Ctrl+Alt+E로 모든 전투 계획을 한 번에 시작합니다."
 com.green1052.plantools.Halt:0 "계획 중단 키"
 com.green1052.plantools.Halt.desc:0 "Ctrl+Alt+H로 모든 전투 계획을 한 번에 중단합니다."
