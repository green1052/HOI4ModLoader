l_korean:
 com.green1052.airwingfieldmarshal.name:0 "공군 배속"
 com.green1052.airwingfieldmarshal.desc:0 "공군을 원수에게도 배속할 수 있고(멀티: 야전군들에 나눠 배속), 배속된 공군이 임무 지역의 모든 전투에 근접항공지원을 합니다."
 com.green1052.airwingfieldmarshal.FieldMarshal:0 "원수 배속"
 com.green1052.airwingfieldmarshal.FieldMarshal.desc:0 "공군을 장군뿐 아니라 원수(집단군)에게도 배속할 수 있습니다. 싱글 플레이: 게임 규칙을 바꿉니다."
 com.green1052.airwingfieldmarshal.SpreadOverArmies:0 "멀티: 야전군에 나눠 배속"
 com.green1052.airwingfieldmarshal.SpreadOverArmies.desc:0 "멀티플레이에서는 원수가 공군을 가질 수 없으므로, 공군을 선택한 채 원수 카드를 우클릭하면 그 원수의 야전군들에 나눠 배속합니다."
 com.green1052.airwingfieldmarshal.WholeMissionArea:0 "임무 지역 전체 근접항공지원"
 com.green1052.airwingfieldmarshal.WholeMissionArea.desc:0 "장군에게 배속된 공군이 자기 사단의 전투뿐 아니라 임무 지역의 모든 전투에 근접항공지원을 합니다. 싱글 플레이: 게임 규칙을 바꿉니다."
