l_korean:
 com.green1052.autotrade.auto:0 "자동"
 com.green1052.autotrade.name:0 "자동 무역"
 com.green1052.autotrade.desc:0 "무역 화면에서 자원을 Shift+클릭하면 부족분을 괴뢰국, 세력, 가장 많이 파는 나라 순으로 수입하고, 남아도는 수입은 줄입니다. Ctrl+Alt+C를 누르면 어떤 지도 모드에서든 우리 나라의 무역 경로가 보입니다."
 com.green1052.autotrade.Surplus:0 "유지할 여유분"
 com.green1052.autotrade.Surplus.desc:0 "수지가 0이 아니라 이만큼 남을 때까지 수입합니다. 새 공장이나 끊긴 거래에 대비한 여유분입니다."
 com.green1052.autotrade.AlliesFirst:0 "동맹 우선"
 com.green1052.autotrade.AlliesFirst.desc:0 "괴뢰국에서 먼저 사고, 그다음 같은 세력, 그 뒤로는 가장 많이 팔 수 있는 나라에서 삽니다. 같으면 무역 영향력이 높은 쪽입니다."
