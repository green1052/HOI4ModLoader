l_korean:
 com.green1052.autoproduction.name:0 "자동 생산"
 com.green1052.autoproduction.desc:0 "장비가 크게 남는 생산 라인의 공장을 장비가 모자란 라인으로 하나씩 옮깁니다. 지상·항공 라인만 다루고, 라인을 새로 만들거나 비우지는 않습니다."
 com.green1052.autoproduction.SurplusPercent:0 "잉여 기준(필요량의 %)"
 com.green1052.autoproduction.SurplusPercent.desc:0 "장비 잉여가 군이 필요한 양의 이 비율보다 많으면 그 라인의 공장을 내줍니다."
 com.green1052.autoproduction.MinSurplus:0 "최소 잉여(개)"
 com.green1052.autoproduction.MinSurplus.desc:0 "그리고 잉여가 이 개수보다 많아야 합니다."
 com.green1052.autoproduction.MinFactories:0 "라인 최소 공장 수"
 com.green1052.autoproduction.MinFactories.desc:0 "라인의 공장을 이 수 아래로는 줄이지 않습니다."
 com.green1052.autoproduction.MovesPerTurn:0 "한 번에 옮길 공장 수"
 com.green1052.autoproduction.MovesPerTurn.desc:0 "10초마다 옮기는 최대 공장 수입니다. 라인 효율이 한꺼번에 떨어지지 않게 조금씩 옮깁니다."
 com.green1052.autoproduction.CoverDays:0 "자체 해소 기간(일)"
 com.green1052.autoproduction.CoverDays.desc:0 "모자란 라인이 지금 생산량으로 이 기간 안에 부족분을 채울 수 있으면 공장을 옮기지 않습니다. 옮긴 공장은 생산 효율이 기본값부터 다시 오르기 때문입니다."
