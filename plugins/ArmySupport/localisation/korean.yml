l_korean:
    com.green1052.armysupport.name:0 "육군 지원"
    com.green1052.armysupport.desc:0 "항공단·열차포 배속, 항공단 재배치, 야전군 편성을 돕습니다.\n- 원수 카드 우클릭: 선택한 항공단·열차포를 원수에게 배속\n- 공항 Shift+우클릭: 자리가 남는 만큼만 항공단 이동\n- Ctrl+Alt+G: 선택한 사단을 야전군으로 나눠 편성\n- 자동 재배치, 자동 지상 근무단, 자동 에이스 배치\n멀티에서도 동작합니다(열차포 설정은 싱글 전용)."
    com.green1052.armysupport.FieldMarshal:0 "원수 배속"
    com.green1052.armysupport.FieldMarshal.desc:0 "항공단이나 열차포를 선택한 채 원수 카드를 우클릭하면 배속합니다.\n싱글에서는 원수에게 직접, 멀티에서는 그 원수의 야전군들에 나눠 배속합니다."
    com.green1052.armysupport.FrontPenalty:0 "열차포: 최전선 감점"
    com.green1052.armysupport.FrontPenalty.desc:0 "최전선 프로빈스의 점수를 깎아 열차포가 전선 바로 뒤에 머물게 합니다. 바닐라의 전투 근처 보너스는 100~200 정도입니다.\n0이면 끔. 싱글 전용."
    com.green1052.armysupport.NoSeaTransfer:0 "열차포: 바다 수송 금지"
    com.green1052.armysupport.NoSeaTransfer.desc:0 "열차포를 바다로 수송하지 않고 자기 철도망 안에서만 움직입니다.\n싱글 전용."
    com.green1052.armysupport.Coverage:0 "자동 재배치: 최소 작전 범위(%)"
    com.green1052.armysupport.Coverage.desc:0 "임무 지역을 이 비율보다 적게 덮는 항공단을, 자리가 남고 더 많이 덮는 공항으로 옮깁니다. 임무는 그대로 유지합니다.\n0이면 끔. 야전군에 배속된 항공단은 게임에 맡깁니다."
    com.green1052.armysupport.AutoGroundCrews:0 "자동 지상 근무단"
    com.green1052.armysupport.AutoGroundCrews.desc:0 "항공단이 가장 치열하게 싸우는 지역에 더 많은 지상 근무단을 켭니다.\n- 최근 이틀간 손실+격추 10대 이상인 지역, 최대 2곳\n- 사흘간 전투가 없거나 지휘력이 예비분 아래로 떨어지면 끔\n직접 켜거나 끈 지역은 건드리지 않습니다. 멀티에서도 동작합니다."
    com.green1052.armysupport.GroundCrewsReserve:0 "자동 지상 근무단: 지휘력 예비분"
    com.green1052.armysupport.GroundCrewsReserve.desc:0 "지휘력을 이 값 아래로는 쓰지 않고, 이보다 떨어지면 지상 근무단을 끕니다."
    com.green1052.armysupport.AutoAces:0 "자동 에이스 배치"
    com.green1052.armysupport.AutoAces.desc:0 "놀고 있는 에이스를 살아 있는 에이스가 없는 항공단에 하루 한 번 배치합니다. 임무 중인 항공단, 그다음 큰 항공단이 먼저입니다.\n전사한 에이스도 항공단에서 뺍니다. 바닐라는 그대로 두어 자리를 막습니다(싱글에서는 모든 국가).\n멀티에서도 동작합니다."
    com.green1052.armysupport.Organize:0 "야전군 편성(Ctrl+Alt+G)"
    com.green1052.armysupport.Organize.desc:0 "사단을 선택하고 Ctrl+Alt+G를 누르면 가까운 사단끼리 야전군 정원에 맞춰 나눠 편성합니다.\n- 야전군마다 보직 없는 장군 중 가장 뛰어난 사람이 지휘\n- 사단 대부분이 속했던 집단군에 넣고, 없으면 새 집단군을 만들어 보직 없는 원수 중 가장 뛰어난 사람에게 맡김"
    com.green1052.armysupport.SplitDrops:0 "공수 목표 여러 곳"
    com.green1052.armysupport.SplitDrops.desc:0 "공수 사단 여러 개로 공수할 때, 첫 도착지 뒤에 도착지를 더 찍으면 사단을 고르게 나눠 보냅니다.
멀티플레이에서도 동작."
    com.green1052.armysupport.AutoTransports:0 "공수 수송기 자동 배치"
    com.green1052.armysupport.AutoTransports.desc:0 "공수 명령의 출발 공항에 공수 임무 수송기가 없으면, 목표까지 닿는 놀고 있는 수송기 항공단을 보냅니다.
멀티플레이에서도 동작."
