l_korean:
    com.green1052.armysupport.name:0 "육군 지원"
    com.green1052.armysupport.desc:0 "항공단·열차포를 원수에게 배속하고, 항공단 재배치와 야전군 편성을 돕습니다.\n- 원수 카드 우클릭: 선택한 항공단·열차포를 원수에게 배속\n- 공항 Shift+우클릭: 자리가 남는 만큼만 항공단 이동\n- Ctrl+Alt+G: 선택한 사단을 야전군으로 나눠 편성\n멀티에서도 동작합니다(열차포 설정은 싱글 전용)."
    com.green1052.armysupport.FieldMarshal:0 "원수 배속"
    com.green1052.armysupport.FieldMarshal.desc:0 "항공단이나 열차포를 선택한 채 원수 카드를 우클릭하면 배속합니다.\n- 싱글: 원수에게 직접 배속(바닐라에 없는 동작)\n- 멀티: 그 원수의 야전군들에 나눠 배속"
    com.green1052.armysupport.FrontPenalty:0 "열차포: 최전선 감점"
    com.green1052.armysupport.FrontPenalty.desc:0 "최전선(적 점령지·적 부대 옆) 프로빈스에서 깎는 점수로, 열차포가 전선 바로 뒤에 머물게 합니다.\n바닐라의 전투 근처 보너스는 100~200 정도입니다. 0이면 끔, 싱글 전용."
    com.green1052.armysupport.NoSeaTransfer:0 "열차포: 바다 수송 금지"
    com.green1052.armysupport.NoSeaTransfer.desc:0 "열차포를 바다로 수송하지 않고 자기 철도망 안에서만 움직입니다.\n싱글 전용."
    com.green1052.armysupport.Coverage:0 "자동 재배치: 최소 작전 범위(%)"
    com.green1052.armysupport.Coverage.desc:0 "임무 지역에 이 비율보다 적게 닿는 항공단을, 더 많이 닿고 자리가 남는 공항으로 옮깁니다. 임무는 그대로 이어집니다.\n0이면 끔. 야전군에 배속된 항공단은 게임이 직접 옮깁니다."
    com.green1052.armysupport.AutoGroundCrews:0 "자동 지상 근무단"
    com.green1052.armysupport.AutoGroundCrews.desc:0 "항공단이 싸우는 지역에 더 많은 지상 근무단(지휘력 소모, 항공 효율 +10%)을 자동으로 켭니다.\n- 최근 이틀간 가장 치열한 곳(손실+격추 10대 이상)부터 최대 2곳\n- 사흘간 전투가 없거나 지휘력이 예비분 아래로 떨어지면 끔\n직접 켜거나 끈 지역은 건드리지 않습니다. 멀티에서도 동작."
    com.green1052.armysupport.GroundCrewsReserve:0 "자동 지상 근무단: 지휘력 예비분"
    com.green1052.armysupport.GroundCrewsReserve.desc:0 "자동 지상 근무단은 지휘력을 이 값 아래로 쓰지 않고, 이 아래로 떨어지면 끕니다."
    com.green1052.armysupport.Organize:0 "야전군 편성(Ctrl+Alt+G)"
    com.green1052.armysupport.Organize.desc:0 "사단을 선택하고 Ctrl+Alt+G를 누르면 가까운 사단끼리 야전군 정원대로 나눠 편성합니다.\n- 야전군마다 보직 없는 장군 중 가장 뛰어난 사람을 지휘관으로\n- 사단 대부분이 있던 집단군에 넣고, 없으면 새 집단군을 만들어 보직 없는 원수 중 가장 뛰어난 사람에게"
