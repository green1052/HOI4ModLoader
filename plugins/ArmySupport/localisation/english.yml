l_english:
    com.green1052.armysupport.desc:0 "Attaches air wings and railway guns to field marshals, rebases air wings and organizes armies.\n- Right-click a field marshal's card: attach the selected air wings and railway guns to him\n- Shift+right-click an airbase: send only the air wings that fit\n- Ctrl+Alt+G: split the selected divisions into armies\nWorks in multiplayer (railway gun settings: single player only)."
    com.green1052.armysupport.FieldMarshal:0 "Field marshals"
    com.green1052.armysupport.FieldMarshal.desc:0 "Right-click a field marshal's card with air wings or railway guns selected to attach them.\n- Single player: to him directly (not something vanilla does)\n- Multiplayer: spread over his armies"
    com.green1052.armysupport.FrontPenalty:0 "Railway guns: front line penalty"
    com.green1052.armysupport.FrontPenalty.desc:0 "Score taken off front-line provinces (next to enemy-held land or hostile units), so railway guns stay just behind the front.\nVanilla's bonus near the fighting is about 100-200. 0: off. Single player only."
    com.green1052.armysupport.NoSeaTransfer:0 "Railway guns: no sea transfer"
    com.green1052.armysupport.NoSeaTransfer.desc:0 "Railway guns never go by sea; they only move along their own rail network.\nSingle player only."
    com.green1052.armysupport.Coverage:0 "Auto rebase below coverage (%)"
    com.green1052.armysupport.Coverage.desc:0 "Air wings covering less of their mission region than this (%) fly to an airbase with room that covers more, keeping their mission.\n0: off. Wings attached to an army are left to the game."
    com.green1052.armysupport.AutoGroundCrews:0 "Auto ground crews"
    com.green1052.armysupport.AutoGroundCrews.desc:0 "Turns More Ground Crews (+10% air efficiency for command power) on where your air wings fight.\n- Up to 2 regions, hardest fights of the last two days first (10+ planes lost and shot down)\n- Off after three quiet days or when command power drops under the reserve\nRegions you toggled yourself are left alone. Works in multiplayer."
    com.green1052.armysupport.GroundCrewsReserve:0 "Auto ground crews: command power reserve"
    com.green1052.armysupport.GroundCrewsReserve.desc:0 "Auto ground crews never spends command power below this, and turns them off when it drops under it."
    com.green1052.armysupport.AutoAces:0 "Auto aces"
    com.green1052.armysupport.AutoAces.desc:0 "Puts your idle aces on air wings without a living ace, once a day.\n- Wings on a mission first, then the biggest\n- Aces killed in action are taken off their wings (vanilla leaves them there, blocking the slot; every country's in single player)\nWorks in multiplayer."
    com.green1052.armysupport.Organize:0 "Organize armies (Ctrl+Alt+G)"
    com.green1052.armysupport.Organize.desc:0 "Ctrl+Alt+G with divisions selected splits them into armies of the game's army size, neighbours together.\n- Each army gets the best unassigned general\n- They join the army group most divisions came from, or a new one under the best unassigned field marshal"
