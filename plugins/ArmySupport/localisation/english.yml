l_english:
    com.green1052.armysupport.desc:0 "Helps with air wings, railway guns and organizing armies.\n- Right-click a field marshal's card: attach the selected air wings and railway guns to him\n- Shift+right-click an airbase: send only the air wings that fit\n- Ctrl+Alt+G: split the selected divisions into armies\n- Battle plan keys: D naval invasion, Ctrl+D with a floating harbour, G paradrop\n- Auto rebase, auto ground crews and auto aces\nWorks in multiplayer (railway gun settings: single player only)."
    com.green1052.armysupport.FieldMarshal:0 "Field marshals"
    com.green1052.armysupport.FieldMarshal.desc:0 "Right-click a field marshal's card with air wings or railway guns selected to attach them.\nSingle player: to him directly. Multiplayer: spread over his armies."
    com.green1052.armysupport.FrontPenalty:0 "Railway guns: front line penalty"
    com.green1052.armysupport.FrontPenalty.desc:0 "Score taken off front-line provinces, so railway guns stay just behind the front. Vanilla's bonus near the fighting is about 100-200.\n0: off. Single player only."
    com.green1052.armysupport.NoSeaTransfer:0 "Railway guns: no sea transfer"
    com.green1052.armysupport.NoSeaTransfer.desc:0 "Railway guns never go by sea; they only move along their own rail network.\nSingle player only."
    com.green1052.armysupport.Coverage:0 "Auto rebase below coverage (%)"
    com.green1052.armysupport.Coverage.desc:0 "Air wings covering less than this % of their mission region fly to an airbase with room that covers more, keeping their mission.\n0: off. Wings attached to an army are left to the game."
    com.green1052.armysupport.AutoGroundCrews:0 "Auto ground crews"
    com.green1052.armysupport.AutoGroundCrews.desc:0 "Turns More Ground Crews on where your air wings fight hardest.\n- Up to 2 regions with 10+ planes lost and shot down in the last two days\n- Off after three quiet days or when command power drops under the reserve\nRegions you toggled yourself are left alone. Works in multiplayer."
    com.green1052.armysupport.GroundCrewsReserve:0 "Auto ground crews: command power reserve"
    com.green1052.armysupport.GroundCrewsReserve.desc:0 "Auto ground crews never spends command power below this, and turns them off when it drops under."
    com.green1052.armysupport.AutoAces:0 "Auto aces"
    com.green1052.armysupport.AutoAces.desc:0 "Puts your idle aces on air wings without a living ace, once a day: wings on a mission first, then the biggest.\nAlso takes fallen aces off their wings; vanilla leaves them there, blocking the slot (every country's in single player).\nWorks in multiplayer."
    com.green1052.armysupport.Organize:0 "Organize armies (Ctrl+Alt+G)"
    com.green1052.armysupport.Organize.desc:0 "Ctrl+Alt+G with divisions selected splits them into armies of the game's army size, neighbours together.\n- Each army gets the best unassigned general\n- They join the army group most divisions came from, or a new one under the best unassigned field marshal"
    com.green1052.armysupport.SplitDrops:0 "Paradrop several destinations"
    com.green1052.armysupport.SplitDrops.desc:0 "With several paratrooper divisions on a paradrop, click more destinations after the first: the divisions are shared evenly over them.\nWorks in multiplayer."
    com.green1052.armysupport.AutoTransports:0 "Auto paradrop transports"
    com.green1052.armysupport.AutoTransports.desc:0 "A paradrop with no transport planes on the paradrop mission at its airbase gets the idle transport wings that reach its target.\nWorks in multiplayer."
    com.green1052.armysupport.AutoSupport:0 "Auto invasion support"
    com.green1052.armysupport.AutoSupport.desc:0 "A naval invasion with no task force on naval invasion support gets your idle (holding) task forces on that mission over the seas by its port and beaches.\nWorks in multiplayer."
    com.green1052.armysupport.SplitInvasions:0 "Invasion to several beaches"
    com.green1052.armysupport.SplitInvasions.desc:0 "With several divisions on a naval invasion, click more beaches after the first: each takes its share as another invasion from the same port.\nWorks in multiplayer."
