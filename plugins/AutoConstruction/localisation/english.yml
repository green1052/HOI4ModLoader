l_english:
    com.green1052.autoconstruction.desc:0 "Set a target count per building in the construction tab; whatever is missing is queued in the best states.\n- Shift+click a building +1, Ctrl+Shift+click +5, Ctrl+click -1, Alt+click off (and its unstarted lines out of the queue)\n- Builds railways and supply hubs where supply runs short (each optional, with its own thresholds)\n- Moves military factories from surplus lines to short ones\nWorks in multiplayer."
    com.green1052.autoconstruction.QueueAhead:0 "Lines queued ahead"
    com.green1052.autoconstruction.QueueAhead.desc:0 "Lines kept waiting in the queue beyond what idle civilian factories work on, so a finished line is replaced at once (no idle factory alert)."
    com.green1052.autoconstruction.AutoSupply:0 "Auto supply"
    com.green1052.autoconstruction.AutoSupply.desc:0 "Where divisions run low on supply: upgrade a saturated hub's railway, connect a cut-off hub, or build a new hub. Hub and railway work can each be turned off below."
    com.green1052.autoconstruction.BuildHubs:0 "Build supply hubs"
    com.green1052.autoconstruction.BuildHubs.desc:0 "Build a new supply hub (with a connecting railway) where starving divisions have none near."
    com.green1052.autoconstruction.BuildRailways:0 "Build railways"
    com.green1052.autoconstruction.BuildRailways.desc:0 "Upgrade a saturated hub's railway to the capital, or connect a cut-off hub to the nearest connected one."
    com.green1052.autoconstruction.StarvingDays:0 "Short for (days)"
    com.green1052.autoconstruction.StarvingDays.desc:0 "Divisions must be short on supply this many game days before anything is built for them."
    com.green1052.autoconstruction.HubEveryDays:0 "New hub spacing (days)"
    com.green1052.autoconstruction.HubEveryDays.desc:0 "At most one new supply hub per this many game days (a hub costs 20000)."
    com.green1052.autoconstruction.SaturationPercent:0 "Hub saturation (%)"
    com.green1052.autoconstruction.SaturationPercent.desc:0 "A hub using this share (%) of the supply it gets has its railway upgraded."
    com.green1052.autoconstruction.HubDistance:0 "Hub nearby (provinces)"
    com.green1052.autoconstruction.HubDistance.desc:0 "Starving divisions with a hub this close (provinces) don't get a new one."
    com.green1052.autoconstruction.AutoProduction:0 "Auto production"
    com.green1052.autoconstruction.SurplusPercent:0 "Surplus (% of need)"
    com.green1052.autoconstruction.MovesPerTurn:0 "Factories moved per game day"
    com.green1052.autoconstruction.CoverDays:0 "Cover days"
