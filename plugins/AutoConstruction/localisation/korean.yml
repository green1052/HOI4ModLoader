l_korean:
    com.green1052.autoconstruction.name:0 "자동 건설"
    com.green1052.autoconstruction.desc:0 "건설 탭에서 건물별 목표 개수를 정하면 모자란 만큼 좋은 주부터 짓습니다.\n- 건물 Shift+클릭 +1, Ctrl+Shift+클릭 +5, Ctrl+클릭 -1\n- 보급이 부족한 곳에 철도·보급 허브 자동 건설\n- 장비가 남는 라인의 군수 공장을 모자란 라인으로 이동\n멀티에서도 동작."
    com.green1052.autoconstruction.AutoSupply:0 "자동 보급"
    com.green1052.autoconstruction.AutoSupply.desc:0 "사단 보급이 부족하면 원인에 맞는 건설을 예약합니다.\n- 허브 포화: 수도로 가는 철도 보강(바다로 이어지면 항구)\n- 끊긴 허브: 연결된 허브까지 철도 건설\n- 근처에 허브 없음: 보급 허브 새로 건설"
    com.green1052.autoconstruction.AutoProduction:0 "자동 생산"
    com.green1052.autoconstruction.AutoProduction.desc:0 "장비가 크게 남는 라인의 군수 공장을 모자란 라인으로 하나씩 옮깁니다.\n지상·항공 라인만 다루며, 라인을 새로 만들거나 비우지 않습니다."
    com.green1052.autoconstruction.SurplusPercent:0 "잉여 기준(필요량의 %)"
    com.green1052.autoconstruction.SurplusPercent.desc:0 "장비 잉여가 군 필요량의 이 비율(%)을 넘는 라인에서 공장을 빼 옵니다."
    com.green1052.autoconstruction.MovesPerTurn:0 "하루에 옮길 공장 수"
    com.green1052.autoconstruction.MovesPerTurn.desc:0 "게임 시간 하루에 옮기는 최대 공장 수입니다.\n라인 효율이 한꺼번에 떨어지지 않게 조금씩 옮기며, 일시정지해도 하루 몫 이상은 옮기지 않습니다."
    com.green1052.autoconstruction.CoverDays:0 "자체 충당 기간(일)"
    com.green1052.autoconstruction.CoverDays.desc:0 "모자란 라인이 지금 생산량으로 이 기간 안에 부족분을 채우면 공장을 옮기지 않습니다.\n옮긴 공장은 생산 효율이 처음부터 다시 오르기 때문입니다."
