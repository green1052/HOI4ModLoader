l_korean:
 com.green1052.autoconstruction.name:0 "자동 건설"
 com.green1052.autoconstruction.desc:0 "건설 탭에서 건물을 Shift+클릭해 목표 개수를 정하면, 모자란 만큼 좋은 주부터 대기열에 넣습니다."
 com.green1052.autoconstruction.CtrlShiftStep:0 "Ctrl+Shift+클릭 단위"
 com.green1052.autoconstruction.CtrlShiftStep.desc:0 "Ctrl+Shift+클릭으로 목표를 올리는 양입니다. (Shift+클릭은 1)"
 com.green1052.autoconstruction.CoresFirst:0 "핵심 주 우선"
 com.green1052.autoconstruction.CoresFirst.desc:0 "핵심 주에 먼저 짓습니다."
 com.green1052.autoconstruction.InfrastructureFirst:0 "기반시설 우선"
 com.green1052.autoconstruction.InfrastructureFirst.desc:0 "그다음 기반시설이 높은 주(건설이 빠름)에 짓고, 그 뒤로는 빈 건물 슬롯이 많은 주 순서입니다."
 com.green1052.autoconstruction.AutoSupply:0 "자동 보급"
 com.green1052.autoconstruction.AutoSupply.desc:0 "사단이 보급 부족이면 원인에 맞춰 건설을 예약합니다. 포화된 보급 허브는 수도까지 철도를 올리고(해상 연결이면 항구), 끊긴 허브는 연결된 허브까지 철도를 놓고, 근처에 허브가 없으면 새로 짓습니다."
 com.green1052.autoconstruction.SaturationPercent:0 "허브 포화 기준(%)"
 com.green1052.autoconstruction.SaturationPercent.desc:0 "허브가 받는 보급을 이만큼 이상 쓰고 있으면 수도까지의 철도를 업그레이드합니다."
 com.green1052.autoconstruction.HubDistance:0 "새 허브 거리(프로빈스)"
 com.green1052.autoconstruction.HubDistance.desc:0 "보급이 부족한 사단 근처 이 거리 안에 허브가 없으면 새 보급 허브를 짓습니다."
