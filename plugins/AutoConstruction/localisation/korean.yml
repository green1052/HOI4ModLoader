l_korean:
    com.green1052.autoconstruction.name:0 "자동 건설"
    com.green1052.autoconstruction.desc:0 "건설 탭에서 건물별 목표 개수를 정하면 모자란 만큼 좋은 주부터 짓습니다.\n- 건물 Shift+클릭 +1, Ctrl+Shift+클릭 +5, Ctrl+클릭 -1, Alt+클릭 끄기(아직 시작 안 한 작업은 대기열에서 삭제)\n- 보급이 부족한 곳에 철도·보급 허브 자동 건설(각각 끄고 켤 수 있고 기준치 설정 가능)\n- 장비가 남는 라인의 군수 공장을 모자란 라인으로 이동\n멀티플레이에서도 동작."
    com.green1052.autoconstruction.QueueAhead:0 "미리 넣어 둘 작업 수"
    com.green1052.autoconstruction.QueueAhead.desc:0 "놀고 있는 민간 공장이 맡을 수 있는 것보다 이만큼 더 대기열에 넣어 둡니다. 작업이 끝나면 바로 다음 작업이 이어받아 공장이 놀지 않습니다(유휴 공장 알림 없음)."
    com.green1052.autoconstruction.AutoSupply:0 "자동 보급"
    com.green1052.autoconstruction.AutoSupply.desc:0 "사단 보급이 부족하면 포화된 허브의 철도를 보강하거나, 끊긴 허브를 철도로 잇거나, 보급 허브를 새로 짓습니다. 허브와 철도는 아래에서 각각 끌 수 있습니다."
    com.green1052.autoconstruction.BuildHubs:0 "보급 허브 건설"
    com.green1052.autoconstruction.BuildHubs.desc:0 "보급이 부족한 사단 근처에 허브가 없을 때 새 보급 허브를 짓습니다(연결 철도 포함)."
    com.green1052.autoconstruction.BuildRailways:0 "철도 건설"
    com.green1052.autoconstruction.BuildRailways.desc:0 "포화된 허브의 수도 연결 철도를 보강하거나, 끊긴 허브를 가까운 연결 허브와 철도로 잇습니다."
    com.green1052.autoconstruction.StarvingDays:0 "보급 부족 기준(일)"
    com.green1052.autoconstruction.StarvingDays.desc:0 "사단이 이 기간(게임 일) 이상 보급이 부족해야 건설을 시작합니다. 진격 중 일시적 부족은 무시됩니다."
    com.green1052.autoconstruction.HubEveryDays:0 "허브 건설 간격(일)"
    com.green1052.autoconstruction.HubEveryDays.desc:0 "새 보급 허브를 짓는 최소 간격(게임 일)입니다. 허브 하나에 20000이 듭니다."
    com.green1052.autoconstruction.SaturationPercent:0 "허브 포화 기준(%)"
    com.green1052.autoconstruction.SaturationPercent.desc:0 "허브가 받는 보급의 이 비율(%) 이상을 쓰면 포화로 보고 수도 연결 철도를 보강합니다."
    com.green1052.autoconstruction.HubDistance:0 "가까운 허브 거리(프로빈스)"
    com.green1052.autoconstruction.HubDistance.desc:0 "이 프로빈스 수 안에 허브가 있으면(포화 아님) 새 허브를 짓지 않습니다."
    com.green1052.autoconstruction.AutoProduction:0 "자동 생산"
    com.green1052.autoconstruction.AutoProduction.desc:0 "장비가 크게 남는 라인의 군수 공장을 모자란 라인으로 하나씩 옮깁니다.\n지상·항공 라인만 다루며, 라인을 새로 만들거나 비우지 않습니다."
    com.green1052.autoconstruction.SurplusPercent:0 "잉여 기준(필요량의 %)"
    com.green1052.autoconstruction.SurplusPercent.desc:0 "장비 잉여가 군 필요량의 이 비율(%)을 넘는 라인에서 공장을 빼 옵니다."
    com.green1052.autoconstruction.MovesPerTurn:0 "하루에 옮길 공장 수"
    com.green1052.autoconstruction.MovesPerTurn.desc:0 "게임 시간 하루에 옮기는 최대 공장 수입니다.\n라인 효율이 한꺼번에 떨어지지 않도록 조금씩 옮깁니다."
    com.green1052.autoconstruction.CoverDays:0 "자체 충당 기간(일)"
    com.green1052.autoconstruction.CoverDays.desc:0 "모자란 라인이 지금 생산량으로 이 기간 안에 부족분을 채울 수 있으면 공장을 옮기지 않습니다.\n옮긴 공장은 생산 효율이 처음부터 다시 오릅니다."
