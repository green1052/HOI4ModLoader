l_korean:
    com.green1052.autoconstruction.name:0 "자동 건설"
    com.green1052.autoconstruction.desc:0 "건설 탭에서 건물을 Shift+클릭해 목표 개수를 정하면, 모자란 만큼 좋은 주부터 대기열에 넣습니다. 보급이 부족한 곳에는 필요한 건물을 짓고, 장비가 남는 생산 라인의 군수 공장을 모자란 라인으로 옮깁니다."
    com.green1052.autoconstruction.AutoSupply:0 "자동 보급"
    com.green1052.autoconstruction.AutoSupply.desc:0 "사단이 보급 부족이면 원인에 맞춰 건설을 예약합니다. 포화된 보급 허브는 수도까지 철도를 올리고(해상 연결이면 항구), 끊긴 허브는 연결된 허브까지 철도를 놓고, 근처에 허브가 없으면 새로 짓습니다."
    com.green1052.autoconstruction.AutoProduction:0 "자동 생산"
    com.green1052.autoconstruction.AutoProduction.desc:0 "장비가 크게 남는 생산 라인의 군수 공장을 장비가 모자란 라인으로 하나씩 옮깁니다. 지상·항공 라인만 다루고, 라인을 새로 만들거나 비우지는 않습니다."
    com.green1052.autoconstruction.SurplusPercent:0 "잉여 기준(필요량의 %)"
    com.green1052.autoconstruction.SurplusPercent.desc:0 "장비 잉여가 군이 필요한 양의 이 비율보다 많으면 그 라인의 공장을 내줍니다."
    com.green1052.autoconstruction.MovesPerTurn:0 "하루에 옮길 공장 수"
    com.green1052.autoconstruction.MovesPerTurn.desc:0 "게임 시간으로 하루에 옮기는 최대 공장 수입니다. 라인 효율이 한꺼번에 떨어지지 않게 조금씩 옮기고, 일시정지 중에는 옮기지 않습니다."
    com.green1052.autoconstruction.CoverDays:0 "자체 해소 기간(일)"
    com.green1052.autoconstruction.CoverDays.desc:0 "모자란 라인이 지금 생산량으로 이 기간 안에 부족분을 채울 수 있으면 공장을 옮기지 않습니다. 옮긴 공장은 생산 효율이 기본값부터 다시 오르기 때문입니다."
