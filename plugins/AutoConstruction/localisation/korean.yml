l_korean:
    com.green1052.autoconstruction.name:0 "자동 건설"
    com.green1052.autoconstruction.desc:0 "건설 탭에서 건물별 목표 개수를 정하면 모자란 만큼 좋은 주부터 짓습니다.\n- 건물 Shift+클릭 +1, Ctrl+Shift+클릭 +5, Ctrl+클릭 -1, Alt+클릭 끄기(아직 시작 안 한 작업은 대기열에서 삭제)\n- 보급이 부족한 곳에 철도·보급 허브 자동 건설\n- 장비가 남는 라인의 군수 공장을 모자란 라인으로 이동\n멀티플레이에서도 동작."
    com.green1052.autoconstruction.QueueAhead:0 "미리 넣어 둘 작업 수"
    com.green1052.autoconstruction.QueueAhead.desc:0 "놀고 있는 민간 공장이 맡을 수 있는 것보다 이만큼 더 대기열에 넣어 둡니다. 작업이 끝나면 바로 다음 작업이 이어받아 공장이 놀지 않습니다(유휴 공장 알림 없음)."
    com.green1052.autoconstruction.AutoSupply:0 "자동 보급"
    com.green1052.autoconstruction.AutoSupply.desc:0 "사단 보급이 부족하면 포화된 허브의 철도를 보강하거나, 끊긴 허브를 철도로 잇거나, 보급 허브를 새로 짓습니다."
    com.green1052.autoconstruction.AutoProduction:0 "자동 생산"
    com.green1052.autoconstruction.AutoProduction.desc:0 "장비가 크게 남는 라인의 군수 공장을 모자란 라인으로 하나씩 옮깁니다.\n지상·항공 라인만 다루며, 라인을 새로 만들거나 비우지 않습니다."
    com.green1052.autoconstruction.SurplusPercent:0 "잉여 기준(필요량의 %)"
    com.green1052.autoconstruction.SurplusPercent.desc:0 "장비 잉여가 군 필요량의 이 비율(%)을 넘는 라인에서 공장을 빼 옵니다."
    com.green1052.autoconstruction.MovesPerTurn:0 "하루에 옮길 공장 수"
    com.green1052.autoconstruction.MovesPerTurn.desc:0 "게임 시간 하루에 옮기는 최대 공장 수입니다.\n라인 효율이 한꺼번에 떨어지지 않도록 조금씩 옮깁니다."
    com.green1052.autoconstruction.CoverDays:0 "자체 충당 기간(일)"
    com.green1052.autoconstruction.CoverDays.desc:0 "모자란 라인이 지금 생산량으로 이 기간 안에 부족분을 채울 수 있으면 공장을 옮기지 않습니다.\n옮긴 공장은 생산 효율이 처음부터 다시 오릅니다."
