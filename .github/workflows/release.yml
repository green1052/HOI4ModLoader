# Raise <Version> in HOI4ModLoader/HOI4ModLoader.csproj and push to master: a release v<Version> is built and published
# (with its tag) unless it already exists.
name: Release

on:
    push:
        branches: [ master ]
        paths: [ "HOI4ModLoader/HOI4ModLoader.csproj" ]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        permissions:
            contents: write # create the release and its tag
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 10.0.403

            -   name: Version
                id: version
                shell: pwsh
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    $tag = "v" + (dotnet msbuild HOI4ModLoader/HOI4ModLoader.csproj -getProperty:Version).Trim()
                    gh release view $tag *> $null
                    $new = $LASTEXITCODE -ne 0
                    "tag=$tag" >> $env:GITHUB_OUTPUT
                    "new=$($new.ToString().ToLower())" >> $env:GITHUB_OUTPUT
                    if (!$new) { "$tag is already released: nothing to do" }
                    exit 0

            -   name: Build
                if: steps.version.outputs.new == 'true'
                shell: pwsh
                run: |
                    dotnet build HOI4ModLoader.slnx -c Release -p:DeployDir=out
                    if ($LASTEXITCODE) { exit $LASTEXITCODE }
                    foreach ($file in "out\version.dll", "out\HOI4ModLoader\core\HOI4ModLoader.dll") {
                        if (!(Test-Path $file)) { throw "$file missing" }
                    }

            -   name: Package
                if: steps.version.outputs.new == 'true'
                shell: pwsh
                run: Compress-Archive -Path out\* -DestinationPath "HOI4ModLoader-${{ steps.version.outputs.tag }}.zip"

            -   name: Publish
                if: steps.version.outputs.new == 'true'
                shell: pwsh
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    $tag = "${{ steps.version.outputs.tag }}"
                    # Retried: once the API answered 403 "Resource not accessible by integration" with the same token and
                    # permissions that worked a minute later (v1.2.1). A tag the failed try left is reused by the next.
                    for ($try = 1; $try -le 3; $try++) {
                        gh release create $tag "HOI4ModLoader-$tag.zip" --target "${{ github.sha }}" --title "HOI4ModLoader $tag" --generate-notes
                        if ($LASTEXITCODE -eq 0) { exit 0 }
                        if ($try -lt 3) { "release create failed (try $try), retrying in 30 s"; Start-Sleep 30 }
                    }
                    exit 1
