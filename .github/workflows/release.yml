name: Release

on:
    push:
        tags: [ "v*" ]

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 10.0.x

            -   name: Build
                shell: pwsh
                run: |
                    $version = "${{ github.ref_name }}".TrimStart("v")
                    dotnet build HOI4ModLoader.slnx -c Release -p:Version=$version -p:DeployDir=out
                    if ($LASTEXITCODE) { exit $LASTEXITCODE }
                    foreach ($file in "out\version.dll", "out\HOI4ModLoader\core\HOI4ModLoader.dll", "out\HOI4ModLoader\core\mimalloc.dll") {
                        if (!(Test-Path $file)) { throw "$file missing" }
                    }

            -   name: Package
                shell: pwsh
                run: Compress-Archive -Path out\* -DestinationPath "HOI4ModLoader-${{ github.ref_name }}.zip"

            -   name: Publish
                shell: pwsh
                env:
                    GH_TOKEN: ${{ github.token }}
                run: gh release create "${{ github.ref_name }}" "HOI4ModLoader-${{ github.ref_name }}.zip" --title "HOI4ModLoader ${{ github.ref_name }}" --generate-notes
