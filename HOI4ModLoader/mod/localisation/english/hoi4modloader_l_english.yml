 HOIMOD_SP_ONLY:0 "Single player only: it changes game rules."
 com.green1052.railwaygunmovement.FrontPenalty:0 "Front line penalty"
 com.green1052.railwaygunmovement.FrontPenalty.desc:0 "Score taken off provinces on the front line (next to enemy-controlled provinces or hostile units). Vanilla bonuses for being near the fighting are about 100-200."
 com.green1052.railwaygunmovement.NoSeaTransfer:0 "No sea transfer"
 com.green1052.railwaygunmovement.NoSeaTransfer.desc:0 "Never ship railway guns by sea; they only move along their own rail network."
 com.green1052.autotrade.auto:0 "Auto"
 com.green1052.airbasecapacity.name:0 "Airbase Capacity"
 com.green1052.airbasecapacity.desc:0 "Shift+right-click an airbase with air wings selected to send only the wings that fit its free capacity."
 com.green1052.airwingfieldmarshal.name:0 "Air Wing Field Marshal"
 com.green1052.airwingfieldmarshal.desc:0 "Air wings can be attached to field marshals (army groups), not only to generals."
 com.green1052.airwingfieldmarshal.multiplayer.name:0 "Air Wing Field Marshal (multiplayer)"
 com.green1052.airwingfieldmarshal.multiplayer.desc:0 "Right-click a field marshal's card with air wings selected to attach them to his armies."
 com.green1052.attachedcas.name:0 "Attached CAS"
 com.green1052.attachedcas.desc:0 "Air wings attached to a general give close air support to every battle in their mission regions."
 com.green1052.autoconstruction.name:0 "Auto Construction"
 com.green1052.autoconstruction.desc:0 "Shift+click a building in the construction tab to set a target count; missing levels are queued in the best states."
 com.green1052.autotrade.name:0 "Auto Trade"
 com.green1052.autotrade.desc:0 "Shift+click a resource in the trade view: its shortage is imported from your subjects, your faction, then the biggest seller."
 com.green1052.checksumpatcher.name:0 "Checksum Patcher"
 com.green1052.checksumpatcher.desc:0 "Lets modded games keep achievements and Ironman by patching the checksum check."
 com.green1052.notelemetry.name:0 "No Telemetry"
 com.green1052.notelemetry.desc:0 "Gameplay telemetry is dropped instead of being sent to Paradox."
 com.green1052.politicalqueue.name:0 "Political Power Queue"
 com.green1052.politicalqueue.desc:0 "Shift+click advisors, ideas, laws and decisions to queue them; they are taken when you have the political power."
 com.green1052.queues.name:0 "Queues"
 com.green1052.queues.desc:0 "Shift+click techs, focuses and intelligence agency upgrades to queue them; they start when a slot is free."
 com.green1052.railwayguns.name:0 "Railway Gun Field Marshal"
 com.green1052.railwayguns.desc:0 "Railway guns can be assigned to field marshals and position along all of their armies."
 com.green1052.railwayguns.multiplayer.name:0 "Railway Gun Field Marshal (multiplayer)"
 com.green1052.railwayguns.multiplayer.desc:0 "Right-click a field marshal's card with railway guns selected to assign them to his armies."
 com.green1052.railwaygunmovement.name:0 "Railway Gun Movement"
 com.green1052.railwaygunmovement.desc:0 "Railway guns stay just behind the front line and never cross the sea."
