 HOIMOD_MODS_TAB:0 "모드"
 HOIMOD_TITLE:0 "HOI4ModLoader {0}  (플러그인 {2}개 중 {1}개 실행 중)"
 HOIMOD_VERSION_LINE:0 "HOI4ModLoader {0} (플러그인 {1}개)"
 HOIMOD_NO_PLUGINS:0 "로드된 플러그인 없음"
 HOIMOD_STATUS_RUNNING:0 "실행 중입니다."
 HOIMOD_STATUS_OFF:0 "꺼져 있습니다."
 HOIMOD_STATUS_OFF_MP:0 "게임 규칙을 바꾸므로 멀티플레이에서는 꺼집니다."
 HOIMOD_STATUS_MP_ONLY:0 "멀티플레이에서만 실행됩니다."
 HOIMOD_STATUS_FAILED:0 "로드하지 못했습니다. HOI4ModLoader/LogOutput.log를 확인하세요."
 HOIMOD_SP_ONLY:0 "게임 규칙을 바꾸므로 싱글 플레이 전용입니다."
 com.green1052.railwaygunmovement.FrontPenalty:0 "최전선 감점"
 com.green1052.railwaygunmovement.FrontPenalty.desc:0 "최전선(적 점령지나 적 부대 옆) 프로빈스에서 깎는 점수입니다. 전투 근처 바닐라 보너스는 100~200 정도입니다."
 com.green1052.railwaygunmovement.NoSeaTransfer:0 "바다 수송 금지"
 com.green1052.railwaygunmovement.NoSeaTransfer.desc:0 "열차포를 바다로 수송하지 않고 자기 철도망 안에서만 움직입니다."
 com.green1052.autotrade.auto:0 "자동"
 com.green1052.airbasecapacity.name:0 "공항 수용량"
 com.green1052.airbasecapacity.desc:0 "공군을 선택한 채 공항을 Shift+우클릭하면 남은 수용량에 들어가는 공군만 보냅니다."
 com.green1052.airwingfieldmarshal.name:0 "원수 공군 배속"
 com.green1052.airwingfieldmarshal.desc:0 "공군을 장군뿐 아니라 원수(집단군)에게도 배속할 수 있습니다."
 com.green1052.airwingfieldmarshal.multiplayer.name:0 "원수 공군 배속 (멀티)"
 com.green1052.airwingfieldmarshal.multiplayer.desc:0 "공군을 선택한 채 원수 카드를 우클릭하면 그 원수의 야전군들에 나눠 배속합니다."
 com.green1052.attachedcas.name:0 "배속 공군 근접항공지원"
 com.green1052.attachedcas.desc:0 "장군에게 배속된 공군이 임무 지역의 모든 전투에 근접항공지원을 합니다."
 com.green1052.autoconstruction.name:0 "자동 건설"
 com.green1052.autoconstruction.desc:0 "건설 탭에서 건물을 Shift+클릭해 목표 개수를 정하면, 모자란 만큼 좋은 주부터 대기열에 넣습니다."
 com.green1052.autotrade.name:0 "자동 무역"
 com.green1052.autotrade.desc:0 "무역 화면에서 자원을 Shift+클릭하면 부족분을 괴뢰국, 세력, 가장 많이 파는 나라 순으로 수입합니다."
 com.green1052.checksumpatcher.name:0 "체크섬 패처"
 com.green1052.checksumpatcher.desc:0 "체크섬 검사를 패치해 모드를 써도 도전과제와 철인 모드를 쓸 수 있습니다."
 com.green1052.notelemetry.name:0 "텔레메트리 차단"
 com.green1052.notelemetry.desc:0 "게임 플레이 텔레메트리를 Paradox로 보내지 않고 버립니다."
 com.green1052.politicalqueue.name:0 "정치력 대기열"
 com.green1052.politicalqueue.desc:0 "고문, 국민정신, 법, 결정을 Shift+클릭해 예약하면 정치력이 모이는 대로 실행합니다."
 com.green1052.queues.name:0 "대기열"
 com.green1052.queues.desc:0 "기술, 중점, 정보부 업그레이드를 Shift+클릭해 예약하면 자리가 비는 대로 시작합니다."
 com.green1052.railwayguns.name:0 "원수 열차포 배정"
 com.green1052.railwayguns.desc:0 "열차포를 원수에게 배정할 수 있고, 원수의 모든 야전군을 따라 자리를 잡습니다."
 com.green1052.railwayguns.multiplayer.name:0 "원수 열차포 배정 (멀티)"
 com.green1052.railwayguns.multiplayer.desc:0 "열차포를 선택한 채 원수 카드를 우클릭하면 그 원수의 야전군들에 나눠 배정합니다."
 com.green1052.railwaygunmovement.name:0 "열차포 이동 개선"
 com.green1052.railwaygunmovement.desc:0 "열차포가 전선 바로 뒤에 머물고 바다를 건너지 않습니다."
